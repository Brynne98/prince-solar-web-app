<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<!-- Drawn at 1200x900; shown at 600x450 in a newsletter. Smallest text 28px = 14px in the email. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:900px;overflow:hidden;background:#0a0d12}
body{font-family:"Space Grotesk",system-ui,sans-serif;color:#e7ecf2;position:relative}
.glow{position:absolute;inset:0;background:
  radial-gradient(800px 420px at 20% -10%,rgba(244,169,58,.16),transparent 65%),
  radial-gradient(900px 500px at 50% 120%,rgba(61,220,132,.10),transparent 60%)}
.copy{position:absolute;left:72px;top:64px;width:760px}
.brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:30px;color:#9aa5b3}
.dot{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffd56b,#f4a93a 60%,#e07a1f)}
h1{font-size:92px;line-height:1;font-weight:700;letter-spacing:-.035em;margin-top:34px}
h1 em{font-style:normal;color:#3ddc84}
.sub{font-size:36px;color:#9aa5b3;margin-top:20px}
.offer{font-size:32px;font-weight:600;color:#ffd56b;margin-top:26px}
.qr{position:absolute;right:72px;top:64px;width:250px;text-align:center}
.qr div{background:#fff;border-radius:16px;padding:10px}
.qr img{width:100%;display:block}
.qr p{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:28px;margin-top:16px;white-space:nowrap;margin-left:-40px;margin-right:-40px}
.shot{position:absolute;left:64px;right:64px;top:500px;height:400px;border-radius:16px 16px 0 0;overflow:hidden;
  border:2px solid rgba(255,255,255,.12);border-bottom:0;box-shadow:0 -20px 80px rgba(0,0,0,.5)}
.shot img{position:absolute;width:1153px;left:-41px;top:-338px}
.shot:after{content:"";position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(transparent,#0a0d12)}
</style></head>
<body>
<div class="glow"></div>

<div class="copy">
  <div class="brand"><span class="dot"></span>Prince Solar Hub</div>
  <h1>Got <em>SunSynk</em> solar?</h1>
  <p class="sub">See what your panels are doing, live.</p>
  <p class="offer">First 10 users get a year free.</p>
</div>

<div class="qr"><div><img src="qr.svg"></div><p>princesolarhub.com</p></div>

<div class="shot"><img src="site.png"></div>
</body></html>
