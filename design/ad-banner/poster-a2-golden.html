<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<!-- Estate poster A, round 2 (SOLAR-636). The showcase's noon sky, hills and house (public/sky.js, welcome.html), so the QR lands on the same scene. 1200x1600. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:1600px;overflow:hidden}
body{font-family:"Geist",system-ui,sans-serif;color:#20160a;position:relative;
  background:linear-gradient(180deg,#c4712f 0%,#e39a52 48%,#f3c486 100%)}
.sun{position:absolute;left:1010px;top:410px;width:0;height:0}
.sun::before{content:"";position:absolute;width:640px;height:640px;left:-320px;top:-320px;border-radius:50%;background:radial-gradient(circle,rgba(255,232,180,.8) 0,rgba(255,214,140,.3) 30%,transparent 62%)}
.sun b{position:absolute;width:150px;height:150px;left:-75px;top:-75px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff6dc,#ffd38a 70%)}
.top{position:absolute;left:72px;right:72px;top:72px}
.brand{display:flex;align-items:center;gap:16px;font:600 34px "Geist",sans-serif}
.dot{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffe08a,#f4a93a 60%,#e07a1f)}
h1{font:600 138px/1 "Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 96;letter-spacing:-.025em;margin-top:78px}
h1 em{font-style:normal;color:#5a2600}
.sub{position:absolute;left:72px;width:430px;top:536px;font-size:40px;line-height:1.28;color:#2a1606;text-wrap:pretty}
.card{position:absolute;right:72px;top:520px;width:560px;border-radius:24px;overflow:hidden;
  box-shadow:0 44px 90px rgba(70,25,0,.45),0 12px 26px rgba(70,25,0,.3)}
.card img{width:100%;display:block}
.land{position:absolute;left:0;right:0;bottom:0;height:660px}
.land svg{position:absolute;inset:0;width:100%;height:100%}
.house{position:absolute;left:96px;bottom:418px;width:230px}
.house svg{width:100%;display:block}
.foot{position:absolute;left:72px;right:72px;bottom:72px;display:flex;justify-content:space-between;align-items:flex-end;gap:48px;color:#f6ead2}
.offer{font:700 88px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;color:#ffd27a}
.then{font-size:38px;margin-top:12px}
.ask{font-size:30px;line-height:1.35;margin-top:30px;max-width:600px;color:rgba(246,234,210,.78)}
.ask b{font-weight:600;color:#f6ead2}
.qr{width:280px;text-align:center;flex:none}
.qr div{background:#fff;border-radius:20px;padding:18px}
.qr img{width:100%;display:block}
.qr p{font:700 28px "JetBrains Mono",monospace;margin-top:16px;white-space:nowrap;margin-left:-70px;margin-right:-70px}
</style></head>
<body>
<div class="sun"><b></b></div>

<div class="top">
  <div class="brand"><span class="dot"></span>Prince Solar Hub</div>
  <h1>Your SunSynk,<br><em>live.</em></h1>
</div>

<p class="sub">Know when the power goes, and how long the battery will last.</p>

<div class="land" aria-hidden="true">
  <svg viewBox="0 0 1200 560" preserveAspectRatio="none">
    <path fill="#8f5530" d="M0 150 C150 110 280 140 400 126 C540 110 640 84 780 108 C910 130 1030 98 1200 118 V560 H0Z"/>
    <path fill="#3f2418" d="M0 210 C190 180 360 204 540 190 C720 176 870 200 1040 184 C1110 178 1160 182 1200 185 V560 H0Z"/>
  </svg>
</div>

<div class="house" aria-hidden="true">
  <svg viewBox="0 0 250 150">
    <g fill="#3f2418"><path d="M12 74 L118 14 L224 74 V150 H12Z"/><rect x="182" y="24" width="14" height="34"/></g>
    <g fill="#2b2f3a"><path d="M54 58 L84 41 L96 47 L66 64Z"/><path d="M88 39 L118 22 L130 28 L100 45Z"/></g>
    <g fill="#ffd27a"><rect x="40" y="96" width="34" height="26" rx="2"/><rect x="98" y="96" width="34" height="26" rx="2"/><rect x="160" y="96" width="34" height="26" rx="2"/></g>
    <rect x="104" y="128" width="22" height="22" fill="#8f5530"/>
  </svg>
</div>

<div class="card"><img src="live-card.png" alt=""></div>

<div class="foot">
  <div>
    <p class="offer">7 days free</p>
    <p class="then">Scan the code to start.</p>
  </div>
  <div class="qr"><div><img src="qr-estate.svg" alt=""></div><p>princesolarhub.co.za</p></div>
</div>
</body></html>
