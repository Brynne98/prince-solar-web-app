# GitHub Pages is retired (SOLAR-110). The app is served by Cloudflare Pages at
# princesolarhub.com. Pages now publishes only github-pages-forward/, whose
# index.html and 404.html send every old brynne98.github.io/prince-solar-web-app
# address to the same path, query and #hash on princesolarhub.com. Once Pages is
# unpublished in the repo settings, delete this workflow and that folder.
#
# It still runs on every push to public/, so the secret check below keeps
# guarding what Cloudflare publishes from the same folder.
#
# Nothing secret is published. config.js carries the Supabase URL and the
# publishable key, both public by design; every table is RLS-protected and every
# api_* function requires an authenticated session. SunSynk credentials live only
# in Edge Function secrets and never reach the browser.
name: Forward GitHub Pages to princesolarhub.com

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'github-pages-forward/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; these are quick.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard against publishing secrets
        # Cheap backstop: the repo is public, so fail loudly if a Supabase secret
        # key or a service_role JWT ever lands in the published folder.
        run: |
          if grep -rEl 'sb_secret_[A-Za-z0-9_-]+|service_role' public/; then
            echo "::error::A secret-looking value is present in public/ — refusing to publish."
            exit 1
          fi
          echo "public/ is clean"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-forward

      - id: deployment
        uses: actions/deploy-pages@v4
