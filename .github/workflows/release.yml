# Release to production (SOLAR-679 F2, F3). Started by hand only: Brynne's say-so is the trigger.
# One commit, in a fixed order: tests, then database, then functions, then frontend. Each stage
# waits for the one before and stops the release on red. Every job checks out the same commit.
#
# Needs, in the GitHub environment "production" (Settings > Environments), with Brynne as the
# required reviewer:
#   SUPABASE_ACCESS_TOKEN   personal access token for the Supabase CLI
#   SUPABASE_DB_PASSWORD    the production database password
#   CLOUDFLARE_API_TOKEN    Cloudflare token with Pages edit on this account
#   CLOUDFLARE_ACCOUNT_ID
#   POSTHOG_CLI_TOKEN       PostHog personal API key, scope error tracking write (source maps, F19)
# and the variables SUPABASE_PROJECT_REF and POSTHOG_CLI_PROJECT_ID (PostHog project id, 321817). Take a backup before running it (DEPLOY.md).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version in public/config.js, e.g. v0.65.0 (checked, not set)'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  database:
    needs: tests
    # production takes main only: a branch's migrations would sit live with no file on main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_YES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: The version asked for is the one in this commit
        env:
          VERSION: ${{ inputs.version }}
        run: grep -qF "APP_VERSION = '$VERSION'" public/config.js
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - name: Link production (the CLI reads SUPABASE_DB_PASSWORD)
        run: supabase link --project-ref "$REF"
      - name: Functions address in Vault (0280 reads it)
        run: |
          supabase db query --remote \
            "select vault.create_secret('https://$REF.functions.supabase.co', 'functions_url')
              where not exists (select 1 from vault.secrets where name = 'functions_url')"
      - name: Migrations
        run: supabase db push --remote

  functions:
    needs: database
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_YES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - name: Deploy every function (unchanged ones are skipped)
        run: supabase functions deploy --remote="$REF" --use-api --jobs 4
      # After the functions, so old drift found here holds back only the frontend, which works
      # with the new backend; the database and functions are already in step.
      - name: Live database functions match their files
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/db-files.mjs --live

  frontend:
    needs: functions
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        env:
          SOURCEMAPS: '1'
      # Source maps go to PostHog only, so its error stacks show the source; the site serves none (F19).
      - name: Source maps to PostHog
        # a PostHog outage must not hold back a frontend whose backend is already live
        continue-on-error: true
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          ph="npx -y @posthog/cli@0.19.4 --host https://eu.posthog.com sourcemap"
          $ph inject -d public/build --release-name prince-solar-hub --release-version "$VERSION"
          $ph upload -d public/build --release-name prince-solar-hub --release-version "$VERSION" --delete-after
      - name: No source map left in public/
        run: |
          find public -name '*.map' -delete
          if [ -n "$(find public -name '*.map')" ]; then echo "::error::source maps left in public/"; exit 1; fi
      - name: Upload public/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.20.0 pages deploy public --project-name prince-solar-web-app --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: The live app serves this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for i in $(seq 1 30); do
            curl -s "https://app.princesolarhub.co.za/config.js?v=$(date +%s)" | grep -qF "APP_VERSION = '$VERSION'" && exit 0
            sleep 10
          done
          echo "::error::app.princesolarhub.co.za does not serve $VERSION"; exit 1
      - name: No source map is public
        run: |
          for f in $(grep -o 'build/[A-Za-z0-9._-]*\.js' public/index.html); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://app.princesolarhub.co.za/$f.map")
            [ "$code" = 404 ] || { echo "::error::$f.map answers $code"; exit 1; }
          done
