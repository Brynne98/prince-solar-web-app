# The repo is public and Cloudflare Pages publishes public/ as-is, so a committed secret
# is a published secret. On every push to main this scans the whole repo and its whole
# history with gitleaks (its own rules for API keys, tokens and private keys, plus the
# Supabase secret key from .gitleaks.toml) and fails loudly on a find. GitHub's own secret
# scanning and push protection run alongside it (repo settings). SOLAR-110, SOLAR-119.
name: Guard the repo against secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, not just the last commit

      - name: Install gitleaks 8.21.2
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: No secrets anywhere in the repo or its history
        # --redact keeps any secret it finds out of the public log
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
