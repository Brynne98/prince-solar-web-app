# Cheap backstop: the repo is public and Cloudflare Pages publishes public/ as-is,
# so fail loudly if a Supabase secret key or a service_role JWT ever lands there.
# Moved out of the old GitHub Pages workflow when Pages was switched off (SOLAR-110).
name: Guard public/ against secrets

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/secrets-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets in public/
        run: |
          if grep -rEl 'sb_secret_[A-Za-z0-9_-]+|service_role' public/; then
            echo "::error::A secret-looking value is present in public/."
            exit 1
          fi
          echo "public/ is clean"
