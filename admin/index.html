<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a0d12" />
<meta name="format-detection" content="email=no" />
<title>Prince Solar admin</title>
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0d12; --panel: #11161d; --panel-2: #141a22;
    --line: rgba(255,255,255,0.07); --line-2: rgba(255,255,255,0.12);
    --text: #e7ecf2; --muted: #9aa5b3; --dim: #7f8da0;
    --pv: #3ddc84; --load: #f87171; --warn: #f59e0b;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(91,157,255,0.06), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(52,211,153,0.05), transparent 55%),
      var(--bg);
    color: var(--text); font-family: var(--display); font-size: 14px; line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; flex: 1; min-width: 0; }
  header .who { color: var(--muted); font-size: 13px; }
  button {
    font: 500 13px var(--display); color: var(--text); background: var(--panel);
    border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 14px; cursor: pointer;
  }
  button:hover { border-color: rgba(255,255,255,0.22); }
  button.primary { background: var(--pv); color: #06210f; border-color: var(--pv); font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .card h2 .n { font-family: var(--mono); color: var(--text); letter-spacing: 0; margin-left: 6px; }
  .scroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--dim); font-size: 12px; padding: 0 12px 8px 0; white-space: nowrap; }
  td { padding: 8px 12px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.nowrap { white-space: nowrap; }
  td.msg { color: var(--muted); min-width: 280px; word-break: break-word; }
  .ok { color: var(--pv); } .warn { color: var(--warn); } .bad { color: var(--load); }
  .sub { color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); }
  .signin { max-width: 360px; margin: 12vh auto 0; }
  .signin h1 { font-size: 22px; margin: 0 0 18px; }
  .signin label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; letter-spacing: .04em; }
  .signin input {
    width: 100%; font: 14px var(--display); color: var(--text); background: var(--bg);
    border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px; margin-bottom: 14px;
  }
  .signin input:focus { outline: none; border-color: var(--pv); }
  .signin .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .signin .row button { flex: 1; padding: 10px 14px; }
  .err { color: var(--load); font-size: 13px; margin: 12px 0 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script type="text/babel" src="admin.jsx"></script>
</body>
</html>
