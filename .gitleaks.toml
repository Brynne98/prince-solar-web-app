# Secret scan for the whole repo and its history (SOLAR-119), run by
# .github/workflows/secrets-guard.yml. The repo is public, so anything committed is public.
# Starts from gitleaks' own rules (API keys, tokens, private keys for most providers).
[extend]
useDefault = true

# Supabase's secret API key. Gives full access to the database, past every row-level
# security rule. Must only live in Edge Function secrets and local .env files.
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

# The legacy service_role JWT is caught by gitleaks' own jwt rule.

# The publishable key is public by design: it ships in the app, and every table is
# behind row-level security. It appears in public/config.js, admin/config.js,
# the health workflow and DEPLOY.md.
# The PostHog project key (phc_) is public by design too: it can only send events, and every
# browser loads it. It appears in public/config.js and supabase/functions/_shared/errors.ts (SOLAR-246).
# The VAPID public key (window.VAPID_PUBLIC in public/config.js) is public by design too: every
# browser that turns pop-ups on is handed it. Its private half is the VAPID_KEYS function secret
# (SOLAR-244). Listed as the exact key, so a different value there is still caught.
[allowlist]
description = "Supabase publishable key, PostHog project key and VAPID public key (public by design)"
regexTarget = "match"
regexes = ['''sb_publishable_[A-Za-z0-9_-]+''', '''phc_[A-Za-z0-9]+''',
           '''BJV8XqKj_ZTALuCxzfsKRYSvHZFnauOhVdKzs1njlexSoV8eabU5lgvt6VyL6l_Quoa9QbO3IEnKaKEvQP0aocg''']
