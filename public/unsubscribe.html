<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Unsubscribe · Prince Solar Hub</title>
<!-- The Unsubscribe link in every email that offers a plan (SOLAR-552, SOLAR-569). The
     button posts the email's token to the unsubscribe function; opening the page changes
     nothing, because mail scanners open links on their own. No sign-in. After it, a link
     to the app's switch ("Offers and reminders"), which turns them back on. -->
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0d12" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<style>
:root{color-scheme:dark light;--bg:#0a0d12;--ink:#e7ecf2;--mute:#7f8da0;--accent:#3ddc84;--on-accent:#07130c}
@media (prefers-color-scheme:light){:root{--bg:#eaedf2;--ink:#0f172a;--mute:#5b6779}}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:340px}
h1{font-size:22px;line-height:1.25;margin-bottom:8px}
p{color:var(--mute);margin-bottom:20px}
button{font:600 16px/1 inherit;padding:14px 22px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1 id="title">Stop these emails?</h1>
  <p id="text">Offers and reminders about your plan.</p>
  <button id="go" type="button">Unsubscribe</button>
  <a id="back" href="/?tab=account&amp;section=notifications" hidden>Turn them back on in the app</a>
</main>
<script src="/config.js"></script>
<script src="/unsubscribe.js"></script>
</body>
</html>
