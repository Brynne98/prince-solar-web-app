<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prince Solar Hub</title>
<!-- What the Home Screen app shows with no signal (SOLAR-592). sw.js keeps this page,
     offline.js and theme.js, and answers a page load with it only when the network fails.
     Nothing else loads here: no fonts, no icons, so it draws with no connection at all. -->
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0d12" />
<script src="/theme.js"></script>
<style>
  :root { color-scheme: dark; --bg: #0a0d12; --text: #e7ecf2; --muted: #9aa5b3; --accent: #3ddc84; --on-accent: #07130c; }
  :root[data-theme="light"] { color-scheme: light; --bg: #eaedf2; --text: #111827; --muted: #4b5563; --accent: #137a3a; --on-accent: #ffffff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 16px; text-align: center; font: 400 16px/1.5 system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { color: var(--muted); }
  p:empty { display: none; }
  button { margin-top: 16px; height: 44px; padding: 0 22px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--on-accent); font: 600 15px system-ui, -apple-system, sans-serif; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <h1>No connection</h1>
  <p id="last"></p>
  <button type="button" id="again">Try again</button>
  <script src="/offline.js"></script>
</body>
</html>
