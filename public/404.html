<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Page not found · Prince Solar Hub</title>
<!-- Cloudflare Pages serves this, with a 404, for any address that has no file (SOLAR-350).
     It answers at every depth, so every link and file here is absolute.
     The showcase's day runs behind it (SOLAR-352): scroll either way and it never ends. -->
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#06080f" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist:wght@400&family=Space+Grotesk:wght@600&display=swap">
<style>
/* the showcase's night (welcome.html): same colours, type, buttons, sky, sun and moon */
:root{--night:#06080f;--paper:#f3eee4;--sun:#ffd56b;--sun-mid:#f4a93a;--sun-rim:#e07a1f;--gold:#f2c36b;
  --s1:#04060c;--s2:#070b16;--s3:#0e1424;--l1:#090c16;--l2:#05070c;--ink:var(--paper);
  --sans:"Space Grotesk",system-ui,sans-serif;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Geist",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night);scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{color:var(--ink);font:400 18px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
/* the scene and the words stay put; the page under them only carries the scroll */
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 55%,var(--s3) 100%)}
.stars{position:absolute;inset:0}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.sunorb{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;will-change:transform}
.sunorb b{position:absolute;inset:34px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffbe8,var(--sunc,#ffd678) 70%)}
.sunorb::before{content:"";position:absolute;inset:-140px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(255,200,110,.6)) 0,transparent 62%)}
.moonorb{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;will-change:transform;background:radial-gradient(circle at 30% 62%,rgba(150,145,135,.35) 0 7%,transparent 8%),radial-gradient(circle at 62% 38%,rgba(150,145,135,.3) 0 10%,transparent 11%),radial-gradient(circle at 58% 70%,rgba(150,145,135,.25) 0 5%,transparent 6%),radial-gradient(circle at 38% 34%,#fdfaf0,#d8d2c2 72%);box-shadow:0 0 30px 6px rgba(220,225,255,.22),0 0 90px 30px rgba(160,175,230,.12)}
.land{position:absolute;left:0;right:0;bottom:0;height:160px}
.land svg{position:absolute;inset:0;width:100%;height:100%}
.land svg.house{inset:auto 12% 44px auto;width:150px;height:auto}
.win{fill:#ffd27a}
.front{position:fixed;inset:0;display:flex;flex-direction:column}
header{max-width:1280px;width:100%;margin:0 auto;padding:0 56px;height:72px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:11px;font:600 18px var(--sans);text-decoration:none;letter-spacing:-.01em;min-height:44px}
.orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff6d6 0 12%,var(--sun) 30%,var(--sun-mid) 62%,var(--sun-rim) 100%);box-shadow:0 0 18px rgba(255,190,80,.55)}
main{flex:1;max-width:1280px;width:100%;margin:0 auto;padding:12vh 56px 48px}
h1{font:600 76px/1.04 var(--display);font-variation-settings:'opsz' 96;letter-spacing:-.035em;max-width:640px}
h1 em{font-style:normal;color:#ffd27a}
.light h1 em{color:#9a4a12}
p{margin-top:22px;font:400 20px/1.5 var(--body);opacity:.8;max-width:30em}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:12px;font:600 16px var(--sans);text-decoration:none;border:1px solid transparent}
.btn.sun{background:linear-gradient(180deg,#ffd877,#f3a83c);color:#241500;box-shadow:0 6px 20px -6px rgba(243,168,60,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{border-color:currentColor;opacity:.9}
.btn.ghost:hover{opacity:1;background:rgba(127,127,127,.1)}
.track{height:3100vh}
@media (max-width:860px){
  header,main{padding-left:16px;padding-right:16px}
  h1{font-size:40px}p{font-size:17px;margin-top:12px}.cta{margin-top:18px}
  .land{height:110px}.land svg.house{right:16px;bottom:30px;width:96px}
}
@media (prefers-reduced-motion:reduce){.track{display:none}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="moonorb" id="moon"></div>
  <div class="sunorb" id="sun"><b></b></div>
  <div class="land">
    <svg viewBox="0 0 1440 160" preserveAspectRatio="none">
      <path fill="var(--l1)" d="M0 60 C180 20 330 50 480 36 C640 20 760 0 930 22 C1090 44 1230 14 1440 30 V160 H0Z"/>
      <path fill="var(--l2)" d="M0 116 C220 84 420 108 640 94 C860 80 1040 102 1240 86 C1330 80 1390 84 1440 88 V160 H0Z"/>
    </svg>
    <svg class="house" viewBox="0 0 250 150">
      <path fill="var(--l2)" d="M12 74 L118 14 L224 74 V150 H12Z"/><rect fill="var(--l2)" x="182" y="24" width="14" height="34"/>
      <g id="wins"><rect class="win" x="40" y="96" width="34" height="26" rx="2"/><rect class="win" x="98" y="96" width="34" height="26" rx="2"/><rect class="win" x="160" y="96" width="34" height="26" rx="2"/></g>
      <rect fill="var(--l1)" x="104" y="128" width="22" height="22"/>
    </svg>
  </div>
</div>
<div class="front">
  <header><a class="brand" href="https://princesolarhub.co.za/"><span class="orb" aria-hidden="true"></span>Prince Solar Hub</a></header>
  <main>
    <h1>Nothing <em>here.</em></h1>
    <p>Check the address, or start again from the home page.</p>
    <div class="cta"><a class="btn sun" href="https://princesolarhub.co.za/">Home page</a><a class="btn ghost" href="https://app.princesolarhub.co.za/">Sign in</a></div>
  </main>
</div>
<div class="track" aria-hidden="true"></div>
<script src="/sky.js"></script>
<script>
(() => {
  const { mix, rgb, skyAt } = window.Sky;
  const $ = id => document.getElementById(id), root = document.documentElement;
  // stars: the showcase's field, same seed
  const st = $('stars'); let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 140; i++) { const s = document.createElement('i'); s.style.left = rnd() * 100 + '%'; s.style.top = rnd() * 62 + '%'; s.style.opacity = (.25 + rnd() * .75).toFixed(2); if (rnd() > .85) s.style.width = s.style.height = '3px'; st.appendChild(s); }
  const START = 4.5; // opens at night, the moon at the top of its arc and clear of the words
  function paint(h) {
    const s = skyAt(h), W = innerWidth, H = innerHeight;
    ['--s1', '--s2', '--s3', '--l1', '--l2'].forEach((n, i) => root.style.setProperty(n, s.c[i]));
    st.style.opacity = s.stars; $('moon').style.opacity = Math.min(1, s.stars * 1.4); $('wins').style.opacity = .25 + .75 * s.stars;
    root.style.setProperty('--ink', s.ink > .5 ? '#1d1408' : '#f3eee4'); document.body.classList.toggle('light', s.ink > .5);
    const foot = H - (W <= 860 ? 70 : 120), crown = W <= 860 ? 90 : 110;
    const arc = (t, el) => { const u = Math.min(1, Math.max(0, t)); el.style.transform = `translate(${W * (.06 + .88 * u)}px,${foot - Math.pow(Math.sin(Math.PI * u), .55) * (foot - crown)}px)`; };
    const t = (h - 5.9) / (18.8 - 5.9), sun = $('sun'); arc(t, sun); sun.style.opacity = t > -.02 && t < 1.02 ? 1 : 0;
    const warm = Math.sin(Math.PI * Math.min(1, Math.max(0, t)));
    sun.style.setProperty('--sunc', rgb(mix([233, 110, 40], [255, 214, 120], warm)));
    sun.style.setProperty('--glow', `rgba(255,${Math.round(150 + warm * 70)},${Math.round(70 + warm * 50)},${(.45 + warm * .2).toFixed(2)})`);
    arc(((h < 12 ? h + 24 : h) - 13.3) / 32.7, $('moon'));
  }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { paint(START); addEventListener('resize', () => paint(START)); return; }
  // one day is ten screens of scroll (three raced by on a laptop trackpad); the page holds three days
  // and the scroll is kept in the middle one, so it never reaches an end either way. The sky repeats
  // each day, so the jump does not show.
  const day = () => innerHeight * 10, track = document.querySelector('.track');
  const size = () => { track.style.height = 3 * day() + innerHeight + 'px'; };
  size();
  let busy = false;
  function frame() {
    busy = false;
    const D = day();
    if (scrollY < D) { scrollTo(0, scrollY + D); return; }
    if (scrollY >= 2 * D) { scrollTo(0, scrollY - D); return; }
    paint((START + (scrollY - D) / D * 24) % 24);
  }
  const ask = () => { if (!busy) { busy = true; requestAnimationFrame(frame); } };
  addEventListener('scroll', ask, { passive: true });
  addEventListener('resize', () => { size(); scrollTo(0, day()); ask(); });
  scrollTo(0, day()); paint(START);
})();
</script>
</body>
</html>
