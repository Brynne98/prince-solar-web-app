<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prince Solar Hub</title>
<!-- The app stays out of search; the showcase at princesolarhub.co.za is the one listed (SOLAR-120) -->
<meta name="robots" content="noindex" />
<!-- Installable / chromeless on a tablet: Add to Home Screen → runs fullscreen (ideal wall display) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Prince Solar Hub" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0d12" />
<!-- Dark, Light or the device's, before first paint (SOLAR-318) -->
<script src="theme.js"></script>
<!-- Safari/iOS turns email addresses in text into blue mailto links; keep them plain -->
<meta name="format-detection" content="email=no" />
<!-- Tab icon: the dashboard's own sun (see .sun below). SVG first for crispness at
     any size; the PNG is the fallback for anything that won't take an SVG favicon.
     apple-touch-icon is rendered on the dark background because iOS composites
     home-screen icons onto a solid backdrop and a transparent one looks accidental. -->
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0d12;
    --panel: #11161d;
    --panel-2: #141a22;
    /* what floats over the page: menus and pop-ups, then the larger dialogs, then hover cards */
    --pop-shadow: 0 12px 32px rgba(var(--shade-rgb),0.45);
    --dlg-shadow: 0 20px 50px rgba(var(--shade-rgb),0.5);
    --tip-bg: rgba(13,17,23,0.97);
    /* SOLAR-318: white on dark, dark ink on light. Every wash, rule and track is
       rgba(var(--ink-rgb), a); every shadow rgba(var(--shade-rgb), a). */
    --ink-rgb: 255,255,255; --shade-rgb: 0,0,0; --bg-rgb: 10,13,18;
    --bar: #0d1117; --avatar: #26303d; --scrim: rgba(4,6,9,0.6);
    --note-text: #b4bdc8; --warn-text: #fed7aa;
    --switch-off: rgba(255,255,255,0.1);
    /* day bars: the rest of the days, and the one under the pointer */
    --bar-a: 0.38; --bar-hover-a: 0.7;
    /* cards on the page: dark lifts them by tone and a hairline; light by a faint shadow (SOLAR-426) */
    --card-edge: var(--line); --card-shadow: none;
    /* small text in a power colour: the same as the colour in dark, a darker shade in light (SOLAR-427) */
    --pv-text: var(--pv); --batt-text: var(--batt); --grid-text: var(--grid); --load-text: var(--load); --soc-text: var(--soc);
    --lift: 0 24px 60px -30px rgba(0,0,0,0.9), 0 0 0 1px rgba(0,0,0,0.25) inset;
    color-scheme: dark;
    --line: rgba(var(--ink-rgb),0.07);
    --line-2: rgba(var(--ink-rgb),0.12);
    --text: #e7ecf2;
    /* Raised a step for readability (SOLAR-14): --muted is 7.0:1 and --dim 5.2:1 at worst,
       on --panel-2. Before that they were 5.8:1 and 4.5:1, and small grey labels still
       read as faint on a phone. Keep --dim above 5:1 on all three surfaces. */
    --muted: #9aa5b3;
    --dim: #7f8da0;
    --pv: #3ddc84; --batt: #a78bfa; --grid: #facc15; --load: #f87171; --soc: #22d3ee;
    /* Roles (SOLAR-346). The five above are power and mean nothing else. Status words,
       dots and edges take --ok, --warn or --bad: green, amber, red (blue, orange, rose
       were tried in SOLAR-346 and reverted by decision in SOLAR-352). --accent is what you press or pick (buttons, links, switch, setup);
       it is solar's green by decision, never on a reading. --focus marks the field you
       type in, the open picker and the chosen day. --money is plain text. Use these, never
       a hex or rgb() of them, outside :root (npm test checks). All text-safe: 4.5:1 or
       more on --panel-2. */
    --ok: #84cc16; --warn: #f59e0b; --bad: #ef4444;
    --accent: #3ddc84; --on-accent: #07130c;
    --focus: #e7ecf2;
    --money: var(--text);
    /* an offer (SOLAR-462): its band on Pick your plan, as the website's gold */
    --offer: #f2c36b; --offer-rgb: 242,195,107;
    /* the same at low alpha, for tints, edges and halos */
    --pv-rgb: 61,220,132; --batt-rgb: 167,139,250; --grid-rgb: 250,204,21; --load-rgb: 248,113,113; --soc-rgb: 34,211,238;
    --ok-rgb: 132,204,22; --warn-rgb: 245,158,11; --bad-rgb: 239,68,68; --accent-rgb: 61,220,132;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    /* The only font sizes in the app (SOLAR-344). 2xs is for uppercase labels and chart
       axes only; xs for short meta (dates, labels); sm for sub-lines and hints, 14px on
       phones; md is body text. Every font-size and font shorthand uses one of these. */
    --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px;
    --fs-xl: 18px; --fs-2xl: 22px; --fs-3xl: 30px; --fs-4xl: 44px;
    /* The only spacing and corner steps (SOLAR-345). Every padding, margin and gap up to
       40px uses an --sp-*; every corner an --r-*. Cards are xl, boxes inside a card lg,
       buttons and chips md; thin bars and switches are pills. Bigger offsets that match
       another element's size (the phone tab bar, an icon column) stay px. */
    --sp-3xs: 2px; --sp-2xs: 4px; --sp-xs: 6px; --sp-sm: 8px; --sp-md: 12px;
    --sp-lg: 16px; --sp-xl: 20px; --sp-2xl: 24px; --sp-3xl: 32px; --sp-4xl: 40px;
    --r-xs: 2px; --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-pill: 999px;
    /* icons (SOLAR-349): one line weight at every size, three sizes. The stroke is screen
       pixels (.ico * is non-scaling), so a 14 and an 18 icon draw the same line. */
    --icon-stroke: 1.5px; --icon-sm: 14px; --icon-md: 18px; --icon-lg: 28px;
    /* The only motion steps (SOLAR-351). fast: hovers, presses and anything leaving; base:
       a menu, sheet, dialog or bubble arriving, a row appearing; slow: a bar or line
       drawing to a new value. Arrivals ease out, exits ease in. Loops (spinners, the
       skeleton sweep, the status breath, the power-flow dots) and the one-off saved
       flash keep their own timing. npm test checks. Reduced motion zeroes all three. */
    --dur-fast: 120ms; --dur-base: 180ms; --dur-slow: 320ms;
    --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-in: cubic-bezier(.4, 0, 1, 1);
  }
  /* Light (SOLAR-318). theme.js sets data-theme on <html> before paint: the saved choice,
     or the device's when the choice is Device. Same roles and meanings as dark; every
     power and role colour is a darker shade that clears 4.5:1 on --panel-2. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eaedf2; --panel: #ffffff; --panel-2: #f1f4f8; --bar: #ffffff; --bg-rgb: 234,237,242;
    --ink-rgb: 15,23,42; --shade-rgb: 15,23,42;
    --pop-shadow: 0 12px 32px rgba(15,23,42,0.12);
    --dlg-shadow: 0 20px 50px rgba(15,23,42,0.18);
    --tip-bg: rgba(255,255,255,0.98);
    --line: rgba(15,23,42,0.09); --line-2: rgba(15,23,42,0.16);
    --text: #111827; --muted: #4b5563; --dim: #5a6676;
    --avatar: #e3e8ef; --scrim: rgba(15,23,42,0.35);
    --note-text: #4b5563; --warn-text: #92400e;
    --switch-off: rgba(15,23,42,0.22);
    --bar-a: 0.6; --bar-hover-a: 0.85;
    --card-edge: transparent; --card-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 3px 10px rgba(15,23,42,0.05);
    --lift: 0 20px 44px -28px rgba(15,23,42,0.28);
    /* big numbers, bars and charts: a middle step, 3.5:1 or more on every surface (SOLAR-427) */
    --pv: #158f42; --batt: #8247ef; --grid: #ad7204; --load: #c94a3c; --soc: #0b84a2;
    --pv-text: #137a3a; --batt-text: #7c3aed; --grid-text: #9a6404; --load-text: #b94a3c; --soc-text: #0e7490;
    --ok: #477310; --warn: #b4470e; --bad: #b91c1c;
    --accent: #137a3a; --on-accent: #ffffff;
    --focus: #111827;
    --offer: #875a06; --offer-rgb: 173,114,4;
    --pv-rgb: 21,143,66; --batt-rgb: 130,71,239; --grid-rgb: 173,114,4; --load-rgb: 201,74,60; --soc-rgb: 11,132,162;
    --ok-rgb: 71,115,16; --warn-rgb: 180,71,14; --bad-rgb: 185,28,28; --accent-rgb: 19,122,58;
  }
  @media (prefers-reduced-motion: reduce) { :root { --dur-fast: 0ms; --dur-base: 0ms; --dur-slow: 0ms; } }
  @media (max-width: 599px) { :root { --fs-sm: 14px; } }
  /* One focus ring (SOLAR-343): every control, keyboard focus only, 2px in --focus. Text
     fields mark focus with a --focus border instead. Never outline: none on :focus-visible;
     a rule may only move the ring (offset, radius). npm test checks. */
  :focus:not(:focus-visible) { outline: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  * { box-sizing: border-box; }
  /* the hidden attribute must beat any display: flex set by a class */
  [hidden] { display: none !important; }
  /* clip, not hidden: overflow-x hidden on body turns it into a scroll container and kills position: sticky further down */
  html, body { margin: 0; overflow-x: clip; max-width: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(91,157,255,0.06), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(52,211,153,0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--display);
    /* No -webkit-font-smoothing: antialiased. On a dark theme it renders light text
       THINNER than the default and reads as soft; the browser default is crisper here. */
    min-height: 100vh;
  }
  /* ---------- scrollbar ----------
     The browser default is a light bar, which reads as a bright seam down a dark app.
     Firefox takes the two standard properties; Chrome/Safari/Edge need the -webkit
     pseudo-elements. The thumb is inset via a transparent border + background-clip so
     it floats clear of the edge instead of butting against it.
     Note: on macOS with "Show scroll bars: When scrolling", this only appears mid-scroll. */
  /* The standard properties and the -webkit ones CONFLICT: if scrollbar-width is set,
     Chrome uses standard sizing and ignores ::-webkit-scrollbar entirely, which rendered
     a 2px sliver instead of the intended thumb. So the standard pair is scoped to
     browsers that have no -webkit scrollbar support (Firefox), and Chrome/Safari get
     the pseudo-elements. */
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: rgba(var(--ink-rgb),0.22) transparent; }
  }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(var(--ink-rgb),0.14); border-radius: var(--r-md);
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(var(--ink-rgb),0.26); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:active { background: rgba(var(--ink-rgb),0.34); background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- skeletons ---------- */
  .skel { position: relative; overflow: hidden; background: rgba(var(--ink-rgb),0.055); }
  .skel::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(var(--ink-rgb),0.07), transparent);
    animation: skel-sweep 1.5s ease-in-out infinite;
  }
  @keyframes skel-sweep { 100% { transform: translateX(100%); } }
  /* a sweeping highlight is exactly the kind of motion this setting exists to stop */
  @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }

  /* ---------- frame (SOLAR-13) ----------
     A sidebar of pages and the account (≥1024 px), an 84 px icon rail on a tablet
     (600–1023), and on a phone a header with the avatar plus a bottom bar. The page
     scrolls as a document; the sidebar and header stay put. The selected page is a
     raised neutral surface: green is kept for the data. */
  /* --stick: how far below the scroll box's top the header ends, for sticky tops and
     scroll margins. --sb: the scrollbar's width, when the page under the header has one.
     --safe-top: the status bar's height when opened from the Home Screen; the page draws
     under it (viewport-fit=cover, black-translucent), so the header and sidebar start below it (SOLAR-480).
     Plus 10px when there is a status bar: iOS fades its blur out past the bar's edge, onto the header.
     min() keeps it 0 in a browser tab, where the inset is 0 */
  .frame { --rail-w: 232px; --head-h: 60px; --safe-top: calc(env(safe-area-inset-top, 0px) + min(10px, env(safe-area-inset-top, 0px))); --stick: calc(var(--head-h) + var(--safe-top)); display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100dvh; }
  .frame-body { display: flex; flex-direction: column; min-width: 0; }
  .frame-scroll { flex: 1 0 auto; display: flex; flex-direction: column; }
  /* with a sidebar and a mouse or trackpad, only the page beside it scrolls, so a wheel
     over the sidebar moves nothing, and nothing bounces (SOLAR-22). A touch screen keeps
     scrolling the document, so it keeps the bounce and the browser's pull-down to
     reload (SOLAR-108) */
  @media (min-width: 600px) and (hover: hover) and (pointer: fine) {
    html, body { overscroll-behavior: none; }
    .frame { height: 100dvh; --stick: 0px; --sb: 11px; }
    /* the header stays out of the scroll box, so the scrollbar starts under it (SOLAR-388) */
    .frame-body { overflow: hidden; }
    /* stable: a short page keeps the scrollbar's room, so moving between pages never
       shifts the content sideways (SOLAR-95) */
    .frame-scroll { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: none; scrollbar-gutter: stable; }
  }
  /* flex: 1 0 auto: shrinking to the scroll box would push the bottom padding under the last card (SOLAR-25) */
  /* the gap under the last card matches the one above the first (SOLAR-25) */
  .content { flex: 1 0 auto; display: flex; flex-direction: column; width: 100%; max-width: 1360px; margin: 0 auto; padding: var(--sp-lg) var(--sp-2xl); }
  /* > * so a tab whose root is a grid/stack still behaves as it did before */
  .content > * { flex: none; }
  .ico { width: var(--icon-md); height: var(--icon-md); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }
  .ico * { vector-effect: non-scaling-stroke; }
  .ico.ico-sm { width: var(--icon-sm); height: var(--icon-sm); }
  .sun {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 38% 34%, #ffd56b, #f4a93a 58%, #e07a1f);
    box-shadow: 0 0 0 4px rgba(244,169,58,0.12);
  }

  .rail { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: var(--sp-2xs); padding: calc(var(--sp-lg) + var(--safe-top)) var(--sp-md) var(--sp-lg);
    background: var(--bar); border-right: 1px solid var(--line); z-index: 6; }
  .rail-logo { height: calc(var(--head-h) - 14px); display: flex; align-items: center; gap: var(--sp-md); padding-left: var(--sp-sm); margin-bottom: var(--sp-sm);
    font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .nav { display: flex; flex-direction: column; gap: var(--sp-3xs); flex: 1; min-height: 0; }
  .nav > button { display: flex; align-items: center; gap: var(--sp-md); width: 100%; padding: var(--sp-sm) var(--sp-md); border: none; background: none; color: var(--muted);
    border-radius: var(--r-md); font-size: var(--fs-md); font-weight: 500; text-align: left; }
  .nav > button:hover:not(:disabled) { color: var(--text); background: rgba(var(--ink-rgb),0.04); }
  .nav > button[aria-current="page"] { color: var(--text); background: rgba(var(--ink-rgb),0.075); box-shadow: inset 0 0 0 1px rgba(var(--ink-rgb),0.06); font-weight: 600; }
  .nav > button:disabled { cursor: progress; }

  /* the account: a row at the foot of the sidebar, an avatar in a phone's header */
  .acct { position: relative; }
  .acct-rail { border-top: 1px solid var(--line); margin-top: var(--sp-sm); padding-top: var(--sp-sm); }
  .acct-btn { position: relative; display: flex; align-items: center; gap: var(--sp-sm); width: 100%; padding: var(--sp-sm); border: none; background: none; border-radius: var(--r-md); text-align: left; color: var(--text); }
  .acct-btn:hover, .acct-btn[aria-expanded="true"], .acct-btn[aria-current="page"] { background: rgba(var(--ink-rgb),0.05); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--avatar); color: var(--text);
    font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.02em; }
  .who { display: grid; min-width: 0; line-height: 1.25; }
  .who b { font-weight: 600; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span.bad { color: var(--bad); }
  /* a SunSynk login needs reconnecting */
  .acct-btn.needs::after { content: ''; position: absolute; left: 32px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--bar); }
  .acct-head { display: none; }

  /* menus: the plant list and the account */
  /* One surface for everything that floats: the rules below add only their place and size */
  .menu, .notif-panel, .cal-pop, .fs-pop, .pop-dlg, .save-bar, .toast, .chart-tip, .chart-range, .info-bubble { border: 1px solid var(--line-2); box-shadow: var(--pop-shadow); }
  .menu, .notif-panel, .fs-pop, .pop-dlg, .save-bar, .toast { background: var(--panel-2); }
  .chart-tip, .chart-range, .info-bubble { background: var(--tip-bg); }
  .fs-pop, .pop-dlg { box-shadow: var(--dlg-shadow); }
  .menu { position: absolute; z-index: 20; border-radius: var(--r-lg); padding: var(--sp-xs); }
  /* Pop-ups arrive with a short fade and drop, and leave faster (SOLAR-351). translate and
     scale, not transform, so a pop-up's own centring transform stays. useExit (components.jsx)
     keeps a closing one on screen with [data-leaving] on its opener's box, or .leaving. */
  @keyframes pop-in { from { opacity: 0; translate: 0 -4px; scale: .98; } }
  @keyframes pop-out { to { opacity: 0; translate: 0 -4px; scale: .98; } }
  @keyframes dlg-in { from { opacity: 0; scale: .97; } }
  @keyframes dlg-out { to { opacity: 0; scale: .97; } }
  @keyframes sheet-in { from { translate: 0 100%; } }
  @keyframes sheet-out { to { translate: 0 100%; } }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes fade-out { to { opacity: 0; } }
  .menu, .notif-panel, .cal-pop, .fs-pop { animation: pop-in var(--dur-base) var(--ease-out); }
  [data-leaving] :is(.menu, .notif-panel, .cal-pop, .fs-pop) { animation: pop-out var(--dur-fast) var(--ease-in) forwards; pointer-events: none; }
  .pop-dlg[open] { animation: dlg-in var(--dur-base) var(--ease-out); }
  .pop-dlg[open]::backdrop { animation: fade-in var(--dur-base) var(--ease-out); }
  /* a closed dialog's copy, fading out over the page (Dialog, link.jsx) */
  .pop-dlg.leaving { inset: 0; margin: auto; height: fit-content; animation: dlg-out var(--dur-fast) var(--ease-in) forwards; pointer-events: none; }
  .pop-dlg.leaving::backdrop { background: var(--scrim); animation: fade-out var(--dur-fast) var(--ease-in) forwards; }
  .menu button { display: flex; align-items: center; gap: var(--sp-sm); width: 100%; padding: var(--sp-sm) var(--sp-sm); border: none; background: none; border-radius: var(--r-md); color: var(--text); font-size: var(--fs-md); text-align: left; }
  .menu button:hover, .menu button:focus-visible { background: rgba(var(--ink-rgb),0.06); }
  .menu button:focus-visible { outline-offset: -2px; }
  .menu button .ico { width: var(--icon-md); height: var(--icon-md); color: var(--muted); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: var(--sp-2xs) 0; }
  /* the small status dots: one size, each its own colour */
  .menu .dot, .pm-dot, .fbox-grid i, .set-nav .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .menu .dot { background: var(--bad); margin-left: auto; }
  .acct-menu { left: 0; right: 0; bottom: calc(100% + 6px); }
  /* who is signed in, above Account and Sign out (back in SOLAR-97) */
  .menu-email { padding: var(--sp-sm) var(--sp-sm) var(--sp-sm); margin-bottom: var(--sp-2xs); border-bottom: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plant-menu { top: calc(100% + 6px); left: 0; width: 320px; max-width: calc(100vw - 260px); }
  .plant-menu button { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; row-gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); white-space: nowrap; }
  /* each plant's state on the right; a turning ring while it sets up (SOLAR-182) */
  .pm-state { display: inline-flex; align-items: center; gap: var(--sp-xs); font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
  .pm-dot { background: currentColor; }
  .pm-pct { font-weight: 500; }
  .pm-state.status-live { color: var(--ok); } .pm-state.status-stale { color: var(--warn); }
  .pm-state.status-offline { color: var(--bad); } .pm-state.status-loading { color: var(--muted); }
  /* the picked row and a long name, in every menu that picks one (plants, Your data's plant) */
  .menu button[aria-checked="true"] { background: rgba(var(--ink-rgb),0.075); font-weight: 600; }
  .menu .nm { overflow: hidden; text-overflow: ellipsis; }
  /* each SunSynk login's email above its plants (SOLAR-251) */
  .plant-menu .pm-login { padding: var(--sp-sm) var(--sp-md) var(--sp-2xs); font-size: var(--fs-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plant-menu [role="group"] + [role="group"] { border-top: 1px solid var(--line); margin-top: var(--sp-2xs); padding-top: var(--sp-2xs); }
  .plant-menu .pm-stopped .nm { color: var(--dim); }

  /* header: the plant left; status and refresh right */
  /* flex: none: the page under it no longer shrinks, so a shrinkable header was squashed to 39px (SOLAR-25) */
  /* past 1360 px .content centres, so the padding grows on both sides to keep the plant
     and refresh over the cards' edges */
  /* the header spans the scrollbar too, so its right edge adds --sb to stay over the cards' edge */
  .head { --pad: max(var(--sp-2xl), calc((100% - var(--sb, 0px) - 1360px) / 2 + var(--sp-2xl)));
    flex: none; position: sticky; top: 0; z-index: 5; height: calc(var(--head-h) + var(--safe-top)); display: flex; align-items: center; gap: var(--sp-lg); padding: var(--safe-top) calc(var(--pad) + var(--sb, 0px)) 0 var(--pad);
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .plant { position: relative; min-width: 0; margin-left: calc(-1 * var(--sp-sm)); }
  .plant-btn { display: flex; align-items: center; gap: var(--sp-sm); max-width: 100%; padding: var(--sp-sm) var(--sp-sm); border: 1px solid transparent; border-radius: var(--r-md);
    background: none; color: var(--text); font-size: var(--fs-xl); font-weight: 600; }
  .plant-btn:not(.static):hover, .plant-btn[aria-expanded="true"] { background: var(--panel-2); border-color: var(--line-2); }
  .plant-btn .ico { width: var(--icon-sm); height: var(--icon-sm); color: var(--muted); }
  .plant-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* the plant name gives way first; the status and its age never clip */
  .status { margin-left: auto; display: flex; align-items: center; gap: var(--sp-sm); white-space: nowrap; flex: none; }
  .status-age { font-size: var(--fs-sm); }
  .status-word { font-size: var(--fs-md); font-weight: 600; }
  /* every state breathes, in its own colour; --ring is the halo */
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none;
    --ring: rgba(var(--ink-rgb),0.14); box-shadow: 0 0 0 3px var(--ring); animation: status-breathe 2.4s ease-in-out infinite; }
  .status-live .status-dot { background: var(--ok); --ring: rgba(var(--ok-rgb),0.18); }
  .status-live .status-word { color: var(--ok); }
  .status-stale .status-dot { background: var(--warn); --ring: rgba(var(--warn-rgb),0.18); }
  .status-stale .status-word, .status-stale .status-age { color: var(--warn); }
  .status-offline .status-dot { background: var(--bad); --ring: rgba(var(--bad-rgb),0.18); }
  .status-offline .status-word, .status-offline .status-age { color: var(--bad); }
  .status-idle .status-word { color: var(--muted); }
  .status-loading .status-dot { background: var(--muted); --ring: rgba(var(--ink-rgb),0.12); }
  .status-loading .status-word { color: var(--muted); }
  @keyframes status-breathe { 0%, 100% { box-shadow: 0 0 0 3px var(--ring); } 50% { box-shadow: 0 0 0 5px transparent; } }
  @media (prefers-reduced-motion: reduce) { .status-dot { animation: none; } }
  /* "Fetching history" beside the status while a fresh plant's 60 days arrive (0048) */
  .status-sync { display: inline-flex; align-items: center; gap: var(--sp-sm); font-size: var(--fs-sm); color: var(--muted); padding-left: var(--sp-sm); border-left: 1px solid var(--line-2); }
  .sync-arc { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(var(--ink-rgb),0.14); border-top-color: var(--muted); animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sync-arc { animation: none; border-top-color: var(--muted); } }
  /* the header's square buttons: Refresh and the bell share one box (SOLAR-248) */
  .refresh, .bell-btn { height: 38px; min-width: 38px; padding: 0; flex: none; border-radius: var(--r-md);
    background: var(--panel); border: 1px solid var(--line-2); color: var(--text); transition: border-color var(--dur-fast) var(--ease-out); }
  .refresh:hover:not(:disabled), .bell-btn:hover:not(:disabled), .bell-btn[aria-expanded="true"] { border-color: var(--muted); }
  .refresh:disabled, .bell-btn:disabled { opacity: .55; }
  .refresh { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm); font-size: var(--fs-md); font-weight: 500; }
  .refresh:disabled { cursor: progress; }
  .refresh-stale { color: var(--warn); border-color: rgba(var(--warn-rgb),0.45); }
  .refresh-offline { color: var(--bad); border-color: rgba(var(--bad-rgb),0.5); }
  /* the header's own notices (SOLAR-384): Grid off as a tag beside the status; a dead
     login's Reconnect in Refresh's place, the same height */
  .grid-tag { display: inline-flex; align-items: center; height: 26px; padding: 0 var(--sp-md); flex: none; white-space: nowrap; border-radius: var(--r-pill);
    font-size: var(--fs-sm); font-weight: 600; color: var(--bad); border: 1px solid rgba(var(--bad-rgb),0.45); background: rgba(var(--bad-rgb),0.07); }
  .head-act { height: 38px; flex: none; white-space: nowrap; }
  /* phone: the red dot and Reconnect say a dead login, the time gives way to the plant name; beside Grid off the time gives way too */
  @media (max-width: 599px) {
    .status.cut :is(.status-word, .status-age) { display: none; }
    .head-act { padding: 0 var(--sp-md); }
    .head:has(.grid-tag) .status-age { display: none; }
  }
  /* spins for as long as a snapshot fetch is in flight (app.jsx holds it ≥ 800 ms) */
  .refresh.busy .ico { animation: spin .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .refresh.busy .ico { animation: none; opacity: .5; } }

  /* Notifications (SOLAR-244): a bell right of Refresh with the unread count; a panel
     under it, a full page on a phone (below) */
  .bell { position: relative; flex: none; }
  .bell-btn { position: relative; display: grid; place-items: center; width: 38px; }
  .bell-btn .ico { width: var(--icon-md); height: var(--icon-md); }
  .bell-count { position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; padding: 0 var(--sp-2xs); border-radius: var(--r-md);
    background: var(--bad); color: #fff; font-size: var(--fs-2xs); font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
  .notif-panel { position: absolute; z-index: 20; top: calc(100% + 8px); right: 0; width: 400px; max-height: min(640px, calc(100vh - 90px));
    display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-xl); }
  .nl-head { flex: none; }
  /* the popup's head gets the same rule as See all (SOLAR-391); the full page's head doesn't */
  .notif-panel .nl-head { padding-bottom: var(--sp-md); border-bottom: 1px solid var(--line); }
  .nl-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: var(--sp-2xs); }
  .nl-head { display: flex; align-items: center; gap: var(--sp-xs); padding: var(--sp-md) var(--sp-sm) var(--sp-xs) var(--sp-lg); }
  .nl-head h2 { margin: 0; font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.01em; }
  .nl-all { margin-left: auto; background: none; border: none; color: var(--muted); font-size: var(--fs-sm); font-weight: 500; padding: var(--sp-sm) var(--sp-xs); }
  .nl-gear, .nl-back { width: 36px; height: 36px; display: grid; place-items: center; background: none; border: none; color: var(--muted); border-radius: var(--r-md); flex: none; }
  .nl-head h2 + .nl-gear { margin-left: auto; }
  .nl-all:hover, .nl-gear:hover, .nl-back:hover { color: var(--text); }
  .nl-gear .ico, .nl-back .ico { width: var(--icon-md); height: var(--icon-md); }
  .nl-back { display: none; }
  .nl-day { padding: var(--sp-md) var(--sp-lg) var(--sp-2xs); font-size: var(--fs-sm); color: var(--dim); font-weight: 500; }
  /* a row is not a link (SOLAR-327) */
  .nl-row { display: grid; grid-template-columns: 8px 32px minmax(0, 1fr); gap: var(--sp-sm); align-items: start; width: 100%; padding: var(--sp-sm) var(--sp-lg) var(--sp-sm) var(--sp-sm);
    color: var(--text); }
  .nl-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: var(--sp-md); }
  .nl-row.unread .nl-dot { background: var(--ok); }
  .nl-glyph { width: 32px; height: 32px; border-radius: var(--r-md); display: grid; place-items: center; }
  .nl-glyph .ico { width: var(--icon-md); height: var(--icon-md); }
  .g-grid { background: rgba(var(--grid-rgb),0.12); color: var(--grid-text); }
  .g-battery { background: rgba(var(--batt-rgb),0.14); color: var(--batt-text); }
  .g-panels { background: rgba(var(--pv-rgb),0.12); color: var(--pv-text); }
  .g-readings, .g-sunsynk { background: rgba(var(--ink-rgb),0.07); color: var(--muted); }
  .g-bad { background: rgba(var(--bad-rgb),0.14); color: var(--bad); }
  .g-warn { background: rgba(var(--warn-rgb),0.14); color: var(--warn); }
  /* billing notices (SOLAR-212): pinned above the alerts, with a button */
  .nl-pin .nl-title { font-weight: 600; }
  /* a notice's action: a green link under its text, at every width (SOLAR-353) */
  .nl-act { margin-top: var(--sp-3xs); min-height: 36px; padding: 0; background: none; border: none; color: var(--accent);
    font: 600 var(--fs-sm) var(--display); text-align: left; cursor: pointer; touch-action: manipulation; }
  .nl-act::after { content: ' \203A'; }
  .nl-act:hover { text-decoration: underline; }
  .nl-text { display: flex; flex-direction: column; min-width: 0; }
  .nl-title { font-size: var(--fs-md); font-weight: 500; line-height: 1.3; }
  .nl-row.unread .nl-title { font-weight: 600; }
  .nl-body { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--sp-3xs); line-height: 1.4; }
  .nl-where { font-size: var(--fs-xs); color: var(--dim); margin-top: var(--sp-2xs); }
  .nl-foot { flex: none; display: block; width: 100%; min-height: 44px; padding: var(--sp-md) var(--sp-lg); background: none; border: none; border-top: 1px solid var(--line);
    color: var(--text); font: 500 var(--fs-md) var(--display); text-align: center; touch-action: manipulation; }
  .nl-foot:hover { background: rgba(var(--ink-rgb),0.04); }
  /* the full page (SOLAR-327): Settings' look, a card per day under its date, full width like the data pages */
  .alerts-page { padding-bottom: var(--sp-2xl); }
  .alerts-head { padding: 0; gap: var(--sp-sm); }
  .alerts-head .page-head h1 { margin: 0; }
  .alerts-head .page-head + .nl-gear { margin-left: auto; }
  .alerts-head .page-head + .nl-all { margin-left: auto; }
  .alerts-filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-sm) var(--sp-lg); margin: var(--sp-lg) 0 var(--sp-2xs); }
  .alerts-row2 { display: flex; align-items: center; gap: var(--sp-lg); }
  .alerts-kind { width: 170px; }
  /* the same height as the time buttons beside it */
  .alerts-kind .pick-btn { height: 34px; font-size: var(--fs-sm); }
  .alerts-unread { display: flex; align-items: center; gap: var(--sp-sm); font-size: var(--fs-md); color: var(--muted); }
  .alerts-page .nl-day { padding: var(--sp-lg) var(--sp-3xs) var(--sp-sm); font-size: var(--fs-sm); color: var(--muted); }
  .card.alerts-card { padding: var(--sp-2xs) var(--sp-sm); }
  .alerts-card .nl-row { padding: var(--sp-md) var(--sp-md) var(--sp-md) var(--sp-xs); }
  .alerts-card .nl-row + .nl-row { margin-top: var(--sp-3xs); }
  /* wide: the time sits on the right, level with the title */
  @media (min-width: 900px) {
    .alerts-card .nl-text { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--sp-3xl); }
    .alerts-card .nl-title, .alerts-card .nl-body { grid-column: 1; }
    .alerts-card .nl-where { grid-column: 2; grid-row: 1 / span 2; align-self: center; margin-top: 0; text-align: right; }
    .alerts-card .nl-pin .nl-text { display: flex; }
  }
  .alerts-more { text-align: center; padding: var(--sp-lg) 0 var(--sp-sm); }
  .alerts-more .ghost-btn { min-height: 40px; padding: var(--sp-sm) var(--sp-lg); }
  .nl-empty { padding: var(--sp-4xl) var(--sp-2xl) var(--sp-2xl); text-align: center; }
  .nl-empty .nl-glyph { margin: 0 auto var(--sp-lg); width: 44px; height: 44px; border-radius: var(--r-lg); }
  .nl-empty b { display: block; font-size: var(--fs-lg); font-weight: 600; margin-bottom: var(--sp-xs); }
  .nl-empty p { margin: 0 0 var(--sp-lg); font-size: var(--fs-md); color: var(--muted); line-height: 1.5; }
  /* the page's one empty state, in the middle of the space under the filters */
  .alerts-page > .nl-empty { min-height: 55vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 0; }
  @media (max-width: 599px) {
    .bell-btn { width: 36px; }
    .notif-panel { position: fixed; inset: 0; z-index: 40; width: auto; max-height: none; border: none; border-radius: 0; box-shadow: none;
      background: var(--bg); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
    .nl-head { padding-left: var(--sp-sm); }
    .nl-back { display: grid; margin-right: var(--sp-3xs); }
    .nl-gear, .nl-back { width: 44px; height: 44px; }
    .alerts-head { margin-left: calc(-1 * var(--sp-sm)); }
    .card.alerts-card { padding: var(--sp-3xs) var(--sp-2xs); border-radius: var(--r-xl); }
    .alerts-filters { flex-direction: column; align-items: stretch; }
    .alerts-range { display: flex; } .alerts-range .seg-btn { flex: 1; }
    .alerts-row2 { justify-content: space-between; }
    .alerts-kind { width: auto; flex: 1; max-width: 200px; }
    .alerts-kind .pick-btn { height: 44px; }
    /* the header is its own layer (sticky, z-index 5): lift it over the bar and the setup card while the list is open */
    .head:has(.notif-panel) { z-index: 30; }
  }

  /* A notice to act on (SOLAR-384): billing and the grid-off prompt. A card the height of an
     Overview card, two of the Overview grid's columns wide (5 desktop, 3 tablet, 2 phone),
     tinted in its tone; the one action is a quiet button, so a fault never wears the solar green. */
  .notice-cards { --tile-h: 128px; /* an Overview card's height: label with its (?), number, trend line; 121 on a phone, which has no (?) */
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-lg); margin-bottom: var(--sp-lg); }
  /* desktop: as many columns as the Overview has cards (5, or 6 with Exported), so 2 of them line up */
  @media (min-width: 981px) {
    .notice-cards { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .frame:has(.today-strip > :nth-child(6)) .notice-cards { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  .notice-card { grid-column: span 2; position: relative; min-width: 0; min-height: var(--tile-h); display: flex; flex-direction: column; justify-content: space-between; gap: var(--sp-sm);
    padding: var(--sp-xl) var(--sp-lg); border-radius: var(--r-xl); border: 1px solid var(--card-edge); background: var(--panel); }
  .notice-card.bad { border-color: rgba(var(--bad-rgb),0.4); background: rgba(var(--bad-rgb),0.07); }
  .notice-card.warn { border-color: rgba(var(--warn-rgb),0.4); background: rgba(var(--warn-rgb),0.07); }
  .notice-card.closable .nc-text { padding-right: var(--sp-3xl); }
  .nc-text b { display: block; font-size: var(--fs-md); font-weight: 600; line-height: 1.3; }
  .nc-text p { margin: var(--sp-3xs) 0 0; font-size: var(--fs-sm); color: var(--muted); line-height: 1.45; }
  /* a narrow card (a phone, or 2 of 6 desktop columns) takes the short title and line, so
     each stays one line and the card keeps the Overview card's height */
  .notice-card { container-type: inline-size; }
  .nc-short { display: none; }
  @container (max-width: 370px) { .nc-long { display: none; } .nc-short { display: inline; } }
  .notice-card .ghost-btn { align-self: flex-start; color: var(--text); white-space: nowrap; }
  .notice-card.bad .ghost-btn { border-color: rgba(var(--bad-rgb),0.45); }
  .notice-card.warn .ghost-btn { border-color: rgba(var(--warn-rgb),0.45); }
  /* a 44 px tap area round a 16 px icon, pinned to the corner */
  .notice-x { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; display: grid; place-items: center;
    background: none; border: none; color: var(--muted); border-radius: var(--r-md); touch-action: manipulation; }
  .notice-x:hover { color: var(--text); background: rgba(var(--ink-rgb),0.05); }
  .notice-x .ico { width: var(--icon-md); height: var(--icon-md); }
  /* phone: full width of the 2-column grid */
  @media (max-width: 599px) {
    .notice-cards { --tile-h: 121px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-sm); margin-bottom: var(--sp-md); }
    .notice-card { padding: var(--sp-lg); }
  }
  /* touch screens: the notice buttons take a full 44 px tap */
  @media (pointer: coarse) {
    .notice-card .ghost-btn, .nl-act { min-height: 44px; touch-action: manipulation; }
    /* the taller tap target fits the Overview card's height */
    .notice-card { padding-top: var(--sp-md); padding-bottom: var(--sp-md); }
  }
  .page { display: flex; flex-direction: column; }
  /* Old readings: today's pictures fade, today's words and numbers go grey (SOLAR-343).
     Faded text fell to 2.3:1; grey stays over 4.5:1. History keeps its colour: [data-today]
     marks what shows today, and the first two tiles on Solar, Home and Grid are NOW and
     TODAY (SOLAR-386). */
  .page.old [data-today] :is(.chart-area, .meter, .legend-val), .page.old :is(.flow-wrap, .wiw[data-today]) :is(svg, .meter) { opacity: 0.45; }
  .page.old :is([data-today] .mini-value, .solar-stats > :nth-child(-n+2) .stat-value, .trio .stat-value, .flow-wrap, .wiw[data-today]),
  .page.old :is([data-today] .mini-value, .solar-stats > :nth-child(-n+2) .stat-value, .trio .stat-value, .flow-wrap, .wiw[data-today]) * { color: var(--muted) !important; }

  /* phone-only pieces, hidden wider */
  .phonebar, .sheet { display: none; }

  /* tablet: an 84 px rail, the icon over its name, initials for the account */
  @media (min-width: 600px) and (max-width: 1023px) {
    .frame { --rail-w: 84px; }
    .rail { padding: calc(var(--sp-lg) + var(--safe-top)) var(--sp-sm) var(--sp-lg); }
    .rail-logo { justify-content: center; padding-left: 0; }
    .rail-logo .app-name { display: none; }
    .nav > button { flex-direction: column; gap: var(--sp-2xs); padding: var(--sp-sm) var(--sp-3xs) var(--sp-sm); font-size: var(--fs-xs); text-align: center; }
    .nav > button .t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct-btn { justify-content: center; padding: var(--sp-sm) 0; }
    .acct-rail .who { display: none; }
    .acct-btn.needs::after { left: calc(50% + 8px); }
    .acct-menu { right: auto; width: 250px; }
    .head { --pad: var(--sp-2xl); }
    .content { padding-left: var(--sp-2xl); padding-right: var(--sp-2xl); }
  }

  /* phone: the header plus a five-slot bottom bar; the account moves to the header */
  @media (max-width: 599px) {
    .frame { --head-h: 56px; grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .head { padding: var(--safe-top) var(--sp-sm) 0 var(--sp-lg); gap: var(--sp-xs); }
    /* header meta stays small so the plant name keeps its room (SOLAR-344) */
    .status-age, .status-sync { font-size: var(--fs-xs); }
    .status-sync { gap: var(--sp-2xs); }
    .plant { margin-left: calc(-1 * var(--sp-sm)); }
    .plant-btn { font-size: var(--fs-lg); padding: var(--sp-xs) var(--sp-xs) var(--sp-xs) var(--sp-sm); gap: var(--sp-2xs); }
    .plant-menu { min-width: 0; width: calc(100vw - 20px); max-width: 360px; }
    .status-sync { display: none; }
    .refresh, .bell-btn { height: 36px; min-width: 36px; }
    /* first load: only "Fetching history" and its %, no status word or refresh (SOLAR-182) */
    .status.fetching .status-dot, .status.fetching .status-word, .status.fetching .status-age, .refresh.fetching { display: none; }
    .status.fetching .status-sync { display: inline-flex; padding-left: 0; border-left: none; }
    /* the plant name needs the room more; the page's banner already says how old the reading is */
    @media (max-width: 359px) { .status-age { display: none; } }
    .status-age .age-date { display: none; }
    .acct-head { display: block; flex: none; }
    /* nothing between them (no inverter yet, Connect open): the avatar still sits at the right edge */
    .plant + .acct-head { margin-left: auto; }
    .acct-head .acct-btn { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; }
    .acct-head .avatar { width: 32px; height: 32px; }
    .acct-head .acct-btn.needs::after { left: auto; right: 1px; top: 1px; box-shadow: 0 0 0 2px var(--bg); }
    .acct-head .acct-menu { left: auto; right: 0; bottom: auto; top: calc(100% + 6px); width: 260px; max-width: calc(100vw - 20px); }

  .mflow-inv { display: flex; flex-direction: column; align-items: center; }
  .mflow-inv svg { display: block; }
  .mflow-inv-label { font: 700 var(--fs-xs) var(--display); letter-spacing: 0.14em; color: var(--text); margin-top: var(--sp-sm); }

  /* ---------- trend arrows on overview cards ---------- */
  .trend-badge { font-family: var(--display); font-size: var(--fs-xs); font-weight: 600; margin-left: var(--sp-sm); letter-spacing: 0; white-space: nowrap; }
  .trend-badge.good { color: var(--ok); }
  .trend-badge.bad { color: var(--bad); }
  .trend-badge.flat { color: var(--dim); font-weight: 500; }
  /* the badge keeps one line; its sentence wraps inside the bubble's width */
  .trend-badge .info-bubble { white-space: normal; font-weight: 400; }

  /* ---------- chart ---------- */
  .hv-datebar { display: flex; align-items: center; gap: var(--sp-sm); margin-bottom: var(--sp-md); flex-wrap: wrap; }
  /* the arrows and the date box share one height (--datebar-h) so they read as one control */
  .hv-datebar, .pick { --datebar-h: 32px; }   /* .pick: the calendar's month arrows in Your data */
  .hv-daynav { box-sizing: border-box; width: var(--datebar-h); height: var(--datebar-h); flex: none; display: inline-flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); color: var(--text);
    line-height: 0; cursor: pointer; transition: var(--dur-fast) var(--ease-out); padding: 0; }
  .hv-daynav svg { display: block; }
  .hv-daynav:hover:not(:disabled) { border-color: var(--line-2); }
  .hv-daynav:disabled { color: var(--dim); cursor: default; opacity: .45; }
  /* the date box: "Tue 6 Oct", opening our calendar (SOLAR-72); Today sits inside it only on a phone */
  .hv-datebox { position: relative; box-sizing: border-box; height: var(--datebar-h); display: inline-flex; align-items: center; gap: var(--sp-sm);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); }
  .hv-datebox:hover { border-color: rgba(var(--ink-rgb),0.3); } .hv-datebox.open { border-color: var(--focus); }   /* as Your data's From and To */
  .hv-datepick { display: inline-flex; align-items: center; gap: var(--sp-sm); height: 100%; padding: 0 var(--sp-md); background: none; border: 0; color: var(--text); cursor: pointer; }
  .hv-datepick:disabled { cursor: default; }
  .hv-cal { display: block; flex: none; color: var(--muted); }
  /* fixed width, so ‹ › stay under the pointer while someone clicks through days */
  .hv-dateface, .day-face { font: 600 var(--fs-sm) var(--display); letter-spacing: 0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hv-dateface { display: inline-block; min-width: 6.9em; text-align: center; }
  .hv-today-in { display: none; }
  .cal-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; width: 276px; padding: var(--sp-md); box-sizing: border-box;
    background: var(--panel); border-radius: var(--r-lg); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-sm); }
  .cal-title { font: 600 var(--fs-md) var(--display); color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--sp-3xs); }
  .cal-dow { text-align: center; font: 500 var(--fs-2xs) var(--display); letter-spacing: 0.08em; color: var(--dim); padding: var(--sp-2xs) 0 var(--sp-xs); }
  .cal-day { height: 34px; border: 1px solid transparent; border-radius: var(--r-md); background: none; color: var(--text); font: 500 var(--fs-sm) var(--mono); cursor: pointer; padding: 0; }
  .cal-day:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line-2); }
  .cal-day:disabled { color: var(--dim); opacity: 0.35; cursor: default; }
  .cal-day.today { color: var(--accent); }
  .cal-day.on { background: rgba(var(--ink-rgb),0.12); border-color: rgba(var(--ink-rgb),0.4); color: var(--text); font-weight: 700; }
  .cal-day:focus-visible, .hv-datepick:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .hv-gap { display: inline-flex; align-items: center; gap: var(--sp-xs); font-size: var(--fs-xs); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-pill); padding: var(--sp-2xs) var(--sp-sm); margin-left: var(--sp-3xs); cursor: help; white-space: nowrap; }
  .hv-gap-sq, .tip-dot.tip-sq { width: 8px; height: 8px; border-radius: var(--r-xs); background: var(--bad); flex: none; }
  .hv-today { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); color: var(--text);
    font-size: var(--fs-xs); padding: var(--sp-xs) var(--sp-md); cursor: pointer; transition: var(--dur-fast) var(--ease-out); margin-left: auto; }
  .hv-today:hover { border-color: var(--line-2); }
  .hv-today:disabled { color: var(--dim); border-color: var(--line); cursor: default; text-decoration: none; }
  .hv-lag { font-size: var(--fs-xs); color: var(--dim); }
  .chart-area { width: 100%; min-width: 0; overflow: hidden; }
  .chart-empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: var(--fs-sm); text-align: center; padding: 0 var(--sp-lg); }
  .chart-svg { display: block; touch-action: pan-y; }
  .ax { font: 400 var(--fs-xs) var(--mono); fill: var(--muted); }
  .ax-hi { fill: var(--text); }
  .legend-row { display: flex; align-items: center; gap: var(--sp-sm); flex-wrap: wrap; margin-bottom: var(--sp-xs); }
  .legend-chip { display: inline-flex; align-items: center; gap: var(--sp-sm); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: var(--sp-xs) var(--sp-md); font-size: var(--fs-sm); color: var(--text); transition: var(--dur-fast) var(--ease-out); }
  .legend-chip.off { color: var(--dim); }
  .legend-val { margin-left: var(--sp-xs); padding-left: var(--sp-sm); border-left: 1px solid var(--line-2); font-family: var(--mono); font-weight: 600; letter-spacing: -0.01em;
    display: inline-block; font-variant-numeric: tabular-nums; }
  .legend-chip.off .legend-val { color: var(--dim); border-color: var(--line); }
  /* Dragging across a chart otherwise text-selects the axis labels and tooltip, so the
     plot fills with blue highlight while you're trying to read a range. Charts are
     interactive surfaces, not prose — nothing here is worth selecting. */
  svg.chart-svg, .chart-area, .hv-root, .chart-tip {
    -webkit-user-select: none; user-select: none;
  }
  /* stops the long-press "copy/share" bubble on iOS while dragging the chart */
  svg.chart-svg { -webkit-touch-callout: none; }

  .chart-tip { position: absolute; pointer-events: none;
    border-radius: var(--r-md); padding: var(--sp-sm) var(--sp-md); min-width: 168px; white-space: nowrap; z-index: 5; }
  .tip-time { font: 600 var(--fs-xs) var(--mono); color: var(--text); margin-bottom: var(--sp-sm); }
  .tip-row { display: flex; align-items: center; gap: var(--sp-sm); font-size: var(--fs-xs); margin: var(--sp-2xs) 0; }
  .tip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tip-l { color: var(--muted); } .tip-v { margin-left: auto; color: var(--text); }
  /* drag-to-select range totals */
  .chart-range { position: absolute; left: 8px; top: 8px;
    border-radius: var(--r-md); padding: var(--sp-sm) var(--sp-md); min-width: 180px; z-index: 6; }
  .cr-head { display: flex; align-items: center; gap: var(--sp-sm); margin-bottom: var(--sp-sm); }
  .cr-head .tip-time { margin-bottom: 0; }
  .cr-x { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: var(--fs-md); line-height: 1; padding: 0 var(--sp-3xs); }
  .cr-x:hover { color: var(--text); }
  /* lives in the SVG's empty top margin — bottom-right overlapped the last x-axis label */

  /* ---------- segmented / buttons ---------- */
  .segmented { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-2xs); gap: var(--sp-3xs); }
  .seg-btn { background: none; border: none; color: var(--muted); padding: var(--sp-sm) var(--sp-lg); border-radius: var(--r-md); font-size: var(--fs-sm); font-weight: 500; transition: var(--dur-fast) var(--ease-out); }
  .seg-block { display: flex; } .seg-block .seg-btn { flex: 1; }
  .seg-sm .seg-btn { padding: var(--sp-2xs) var(--sp-md); font-size: var(--fs-sm); }
  .seg-btn:hover:not(:disabled) { color: var(--text); } .seg-btn:disabled { cursor: default; } .seg-btn.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(var(--shade-rgb),0.3); }
  .ghost-btn { background: none; border: 1px solid var(--line-2); color: var(--muted); padding: var(--sp-sm) var(--sp-lg); border-radius: var(--r-md); font-size: var(--fs-sm); transition: var(--dur-fast) var(--ease-out); }
  .ghost-btn:hover { color: var(--text); } .ghost-btn.active { border-color: var(--focus); color: var(--text); }


  /* ---------- grids used by tabs ---------- */
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-lg); }

  /* solar tab, and the Battery and Grid tabs, which are built the same way */
  .solar-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-lg); }
  .solar-stats .stat-tile { padding: var(--sp-2xl) var(--sp-2xl); }
  .stat-sub .trend-badge { margin: 0 var(--sp-2xs) 0 0; top: 0; font-size: inherit; }
  .mini-sub .trend-badge { font-size: inherit; }
  .solar-tab .section-title .info-dot { margin-left: var(--sp-sm); }
  :is(.solar-tab, .eq-tab) .section-right { text-transform: none; letter-spacing: 0; font-size: var(--fs-sm); font-weight: 400; color: var(--muted); }
  :is(.solar-tab, .eq-tab) .section-right b { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .solar-row { display: grid; grid-template-columns: minmax(0, 35fr) minmax(0, 65fr); gap: var(--sp-xl); align-items: stretch; }
  .solar-row > * { min-width: 0; }
  .solar-row > :only-child { grid-column: 1 / -1; }
  /* below the sticky header, not under it (SOLAR-275) */
  #solar-day, #battery-day, #grid-day, #home-day { scroll-margin-top: calc(var(--stick, 60px) + var(--sp-lg)); }
  .tip-hint { font-size: var(--fs-sm); color: var(--dim); margin-top: var(--sp-xs); }
  /* Where it went, beside the 30 days (SOLAR-332): a hollow pie with the day's sum in its
     middle and each part's kWh beside it. The card stretches to the row; the pie sits centred. */
  .solar-tab .wiw { display: flex; flex-direction: column; }
  .solar-tab .wiw .section-title { flex-direction: row; align-items: center; flex-wrap: wrap; gap: var(--sp-2xs) var(--sp-md); margin-bottom: var(--sp-lg); }
  /* the figures drop under the pie when the card is too narrow for both side by side */
  .pie-wrap { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--sp-2xl); }
  .pie { width: 150px; height: 150px; flex: none; }
  .pie circle { fill: none; stroke-width: 18; }
  .pie-track { stroke: rgba(var(--ink-rgb),0.06); }
  /* a day with nothing to share: the bare ring and the note, so the card is not a blank box (SOLAR-345) */
  .pie-wrap.empty .pie-num { fill: var(--dim); }
  .pie-wrap:is(.empty, .whole) .solar-note { flex: 1 1 160px; margin: 0; }
  .pie-num { text-anchor: middle; font: 700 var(--fs-2xl) var(--mono); fill: var(--text); }
  .pie-u { font-size: var(--fs-xs); opacity: 0.85; }
  .pie-word { text-anchor: middle; font: 500 var(--fs-2xs) var(--display); letter-spacing: 0.12em; text-transform: uppercase; fill: var(--muted); }
  .pie-figs { flex: 1 1 auto; min-width: 0; display: grid; gap: var(--sp-lg); }
  .pie-figs > div { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-md); }
  .pie-figs span:not(.u) { font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .pie-figs b { font: 700 var(--fs-2xl) var(--mono); line-height: 1; white-space: nowrap; }
  .pie-figs b .u { font-size: var(--fs-sm); margin-left: var(--sp-2xs); opacity: 0.85; }
  .solar-note { margin: 0 0 var(--sp-sm); font-size: var(--fs-md); color: var(--muted); max-width: 60ch; }
  .solar-note:last-child { margin-bottom: 0; }   /* a note that ends its card adds no space under it (SOLAR-284) */
  /* Equipment (SOLAR-75): one headline, a coral-edged card per problem, then Simple (a tile
     each: one figure, one word) or Detailed (string bars, battery meter, inverter tiles,
     spec sheets). */
  .eq-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-md); }
  .eq-label { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
  .eq-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--dim); }
  .eq-dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(var(--ok-rgb),0.15); }
  .eq-dot.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(var(--warn-rgb),0.15); }
  .eq-dot.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(var(--bad-rgb),0.15); }
  .eq-head { display: flex; align-items: center; gap: var(--sp-md); font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .eq-head-sub { margin: var(--sp-xs) 0 0 var(--sp-2xl); font-size: var(--fs-md); color: var(--muted); }
  .eq-problems { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-md); }
  .eq-problem { border: 1px solid rgba(var(--bad-rgb),0.42); background: rgba(var(--bad-rgb),0.06); border-radius: var(--r-xl); padding: var(--sp-lg) var(--sp-lg); }
  .eq-problem-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-md); }
  .eq-problem-head b { font-size: var(--fs-lg); font-weight: 600; line-height: 1.35; }
  .eq-problem-head span { flex: none; font-size: var(--fs-xs); color: var(--dim); }
  .eq-problem p { margin: var(--sp-xs) 0 0; font-size: var(--fs-md); color: var(--muted); line-height: 1.5; }

  /* Simple (SOLAR-397): a tile per part, figure, one line, and a small chart of today; four
     across when wide, two by two on a phone */
  .eq-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-md); }
  @media (min-width: 1100px) { .eq-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-xl); } }
  .eq-tiles > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  @media (min-width: 1100px) { .eq-tiles > :last-child:nth-child(odd) { grid-column: auto; } }
  .eq-tile { display: flex; flex-direction: column; min-width: 0; }
  .eq-tile-label { font-size: var(--fs-lg); font-weight: 600; }
  .eq-tile-state { display: flex; align-items: center; gap: var(--sp-sm); margin-top: var(--sp-2xs); font-size: var(--fs-sm); color: var(--muted); }
  .eq-tile-state.warn { color: var(--warn); }
  .eq-fig { margin-top: var(--sp-lg); font-weight: 700; font-size: var(--fs-4xl); line-height: 1; display: flex; align-items: baseline; gap: var(--sp-2xs); }
  .eq-fig .u { font-size: var(--fs-xl); opacity: 0.85; }
  .eq-fig-sub { margin-top: var(--sp-sm); font-size: var(--fs-sm); color: var(--muted); }
  .eq-tile.stale .eq-fig { color: var(--muted); }   /* an old reading greys out; faded colour fell under 4.5:1 (SOLAR-343) */
  .eq-spark { margin-top: auto; padding-top: var(--sp-lg); height: 72px; }
  @media (max-width: 599px) {
    .eq-fig { margin-top: var(--sp-md); font-size: var(--fs-3xl); }
    .eq-fig .u { font-size: var(--fs-lg); }
    .eq-spark { height: 52px; padding-top: var(--sp-md); }
  }

  /* Detailed (SOLAR-392): cards in pairs when wide, one on a phone; the inverters read across */
  .eq-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-xl); align-items: stretch; }
  .eq-cards > * { min-width: 0; }
  @media (min-width: 980px) {
    .eq-cards { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
    .eq-cards > :only-child { grid-column: 1 / -1; }
  }
  .eq-big { font-size: var(--fs-4xl); font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: var(--sp-xs); }
  .eq-big .u { font-size: var(--fs-2xl); opacity: 0.85; }
  .eq-big.stale { color: var(--muted); }
  .eq-big-sub { margin-top: var(--sp-sm); font-size: var(--fs-sm); color: var(--muted); }
  .eq-meter { position: relative; height: 7px; border-radius: var(--r-pill); background: rgba(var(--ink-rgb),0.07); }
  .eq-meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r-pill); }
  .eq-meter b { position: absolute; top: -4px; width: 2px; height: 15px; margin-left: -1px; border-radius: 1px; background: rgba(var(--ink-rgb),0.7); }
  .eq-note { margin-top: var(--sp-lg); font-size: var(--fs-sm); color: var(--dim); }
  .eq-meter { margin-top: var(--sp-lg); }
  .eq-meter.stale i { opacity: 0.5; }
  .eq-meter-scale { position: relative; height: 18px; margin-top: var(--sp-xs); font-size: var(--fs-xs); color: var(--dim); }
  .eq-meter-scale span { position: absolute; white-space: nowrap; }
  .eq-rows { margin: var(--sp-lg) 0 0; }
  .eq-rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-md); padding: var(--sp-sm) 0; border-top: 1px solid var(--line); font-size: var(--fs-md); }
  .eq-rows dt { color: var(--muted); }
  .eq-rows dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .eq-rows dd.bad { color: var(--bad); }
  /* a column per inverter; more than fit scroll sideways inside the card */
  .eq-table { margin-top: var(--sp-lg); overflow-x: auto; }
  .section-title + .eq-table, .section-title + .eq-rows { margin-top: 0; }
  .eq-table table { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
  .eq-table thead th { padding: 0 0 var(--sp-sm) var(--sp-lg); text-align: right; vertical-align: bottom; font-size: var(--fs-sm); font-weight: 600; min-width: 11ch; }
  .eq-table thead th.down { color: var(--muted); }
  .eq-table tbody th { padding: var(--sp-sm) var(--sp-md) var(--sp-sm) 0; text-align: left; font-weight: 400; color: var(--muted); white-space: nowrap; border-top: 1px solid var(--line); }
  .eq-table td { padding: var(--sp-sm) 0 var(--sp-sm) var(--sp-lg); text-align: right; vertical-align: top; border-top: 1px solid var(--line); white-space: nowrap; }
  .eq-table td .mono { display: inline-flex; align-items: center; gap: var(--sp-sm); }
  .eq-table td.pv .mono { color: var(--pv-text); }
  .eq-table td.bad, .eq-table td.bad .eq-sub { color: var(--bad); }
  .eq-table td.warn { color: var(--warn); }
  /* a model name breaks at its hyphens, not between letters (SOLAR-407) */
  .eq-table td.wrap { white-space: normal; overflow-wrap: break-word; }
  .eq-sub { display: block; margin-top: var(--sp-3xs); font-size: var(--fs-sm); color: var(--dim); }
  .eq-more { margin-top: var(--sp-lg); }
  .eq-more summary { cursor: pointer; list-style: none; font-size: var(--fs-sm); color: var(--muted); min-height: 32px; display: flex; align-items: center; gap: var(--sp-xs); }
  .eq-more summary::-webkit-details-marker { display: none; }
  .eq-more[open] summary .ico { transform: rotate(180deg); }
  .eq-more summary:hover { color: var(--text); }
  .eq-more .eq-rows { margin-top: var(--sp-xs); }
  @media (max-width: 599px) {
    .eq-head { font-size: var(--fs-2xl); }
    .eq-problem { border-radius: var(--r-xl); }
    .eq-big { font-size: var(--fs-3xl); }
    .eq-big .u { font-size: var(--fs-xl); }
    /* two inverter columns fit at 375 px: row labels wrap, cells sit closer (SOLAR-407) */
    .eq-table thead th { min-width: 0; padding-left: var(--sp-md); }
    .eq-table tbody th { white-space: normal; }
    .eq-table td { padding-left: var(--sp-md); }
    /* a sub line such as "DC side 59 °C, at 20:00" wraps in its column, not past the card (SOLAR-411) */
    .eq-table td .eq-sub { white-space: normal; }
  }
  @media (min-width: 900px) { .eq-problems { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .eq-problems > :only-child { grid-column: 1 / -1; }

  /* ---------- settings: Account, Billing, Plant ----------
     One scrolling page each, in one area with a side menu (SOLAR-250). A section is its
     title and note over a full-width card. */
  .settings-page { display: flex; flex-direction: column; max-width: 920px; padding-bottom: var(--sp-2xl); }
  .page-head h1 { font-size: var(--fs-2xl); margin: 0 0 var(--sp-2xs); letter-spacing: -0.01em; }
  .page-head p { margin: 0 0 var(--sp-xs); color: var(--muted); font-size: var(--fs-md); overflow-wrap: anywhere; }
  .sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-sm); padding: var(--sp-lg) 0; margin-top: var(--sp-sm);
    scroll-margin-top: calc(var(--stick, 60px) + var(--sp-md)); }

     the background is animated, and a ~forever delay means it never arrives. */

  /* info tooltip */
  .info-dot { position: relative; display: inline-flex; align-items: center; vertical-align: middle;

  .info-bubble { display: none; position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(calc(-50% + var(--shift, 0px))) translateY(4px);
    width: 210px; border-radius: var(--r-md); padding: var(--sp-sm) var(--sp-md);

  /* ---- auth + connect screens ------------------------------------------------

  .login-wrap {

  /* Sizes follow common guidance: 52px fields (44-48 minimum targets), 16px field text (iOS

  .login-card {

  .field-hint { color: var(--dim); font-size: var(--fs-sm); line-height: 1.2; text-align: right; }
  .field-err { color: var(--bad); font-size: var(--fs-sm); line-height: 1.2; text-align: right; }

  .login-card .login-link.inline { min-height: 0; display: inline; font-size: inherit; }
  /* No inverter yet (SOLAR-94): a data page is its own layout as a still, faint outline,

  /* The outline and the card share one grid cell. The card's layer is one screen tall and

    padding: var(--sp-2xl); border-radius: var(--r-xl); background: rgba(var(--bg-rgb),0.9); border: 1px solid var(--line-2); box-shadow: 0 20px 50px -24px rgba(var(--shade-rgb),0.9); }
