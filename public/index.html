<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prince Solar</title>
<!-- Installable / chromeless on a tablet: Add to Home Screen → runs fullscreen (ideal wall display) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Prince Solar" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0d12" />
<!-- Safari/iOS turns email addresses in text into blue mailto links; keep them plain -->
<meta name="format-detection" content="email=no" />
<!-- Tab icon: the dashboard's own sun (see .sun below). SVG first for crispness at
     any size; the PNG is the fallback for anything that won't take an SVG favicon.
     apple-touch-icon is rendered on the dark background because iOS composites
     home-screen icons onto a solid backdrop and a transparent one looks accidental. -->
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0d12;
    --panel: #11161d;
    --panel-2: #141a22;
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.12);
    --text: #e7ecf2;
    /* Raised a step for readability (SOLAR-14): --muted is 7.0:1 and --dim 5.2:1 at worst,
       on --panel-2. Before that they were 5.8:1 and 4.5:1, and small grey labels still
       read as faint on a phone. Keep --dim above 5:1 on all three surfaces. */
    --muted: #9aa5b3;
    --dim: #7f8da0;
    --pv: #3ddc84; --batt: #a78bfa; --grid: #facc15; --load: #f87171; --soc: #22d3ee;
    --ok: #3ddc84;
    /* status colours, distinct from the five series colours: stale/estimate amber, fault red */
    --warn: #f59e0b; --bad: #ef4444;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  /* the hidden attribute must beat any display: flex set by a class */
  [hidden] { display: none !important; }
  /* clip, not hidden: overflow-x hidden on body turns it into a scroll container and kills position: sticky further down */
  html, body { margin: 0; overflow-x: clip; max-width: 100%; }
  /* no rubber-band bounce past the top or bottom (SOLAR-22) */
  html, body { overscroll-behavior: none; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(91,157,255,0.06), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(52,211,153,0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--display);
    /* No -webkit-font-smoothing: antialiased. On a dark theme it renders light text
       THINNER than the default and reads as soft; the browser default is crisper here. */
    min-height: 100vh;
  }
  /* ---------- scrollbar ----------
     The browser default is a light bar, which reads as a bright seam down a dark app.
     Firefox takes the two standard properties; Chrome/Safari/Edge need the -webkit
     pseudo-elements. The thumb is inset via a transparent border + background-clip so
     it floats clear of the edge instead of butting against it.
     Note: on macOS with "Show scroll bars: When scrolling", this only appears mid-scroll. */
  /* The standard properties and the -webkit ones CONFLICT: if scrollbar-width is set,
     Chrome uses standard sizing and ignores ::-webkit-scrollbar entirely, which rendered
     a 2px sliver instead of the intended thumb. So the standard pair is scoped to
     browsers that have no -webkit scrollbar support (Firefox), and Chrome/Safari get
     the pseudo-elements. */
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; }
  }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.14); border-radius: 7px;
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:active { background: rgba(255,255,255,0.34); background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- skeletons ---------- */
  .skel { position: relative; overflow: hidden; background: rgba(255,255,255,0.055); }
  .skel::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
    animation: skel-sweep 1.5s ease-in-out infinite;
  }
  @keyframes skel-sweep { 100% { transform: translateX(100%); } }
  /* a sweeping highlight is exactly the kind of motion this setting exists to stop */
  @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }

  /* ---------- frame (SOLAR-13) ----------
     A sidebar of pages and the account (≥1024 px), an 84 px icon rail on a tablet
     (600–1023), and on a phone a header with the avatar plus a bottom bar. The page
     scrolls as a document; the sidebar and header stay put. The selected page is a
     raised neutral surface: green is kept for the data. */
  .frame { --rail-w: 208px; --head-h: 60px; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100dvh; }
  .frame-body { display: flex; flex-direction: column; min-width: 0; }
  /* with a sidebar, only the page beside it scrolls, so a wheel over the sidebar
     moves nothing (SOLAR-22); a phone keeps scrolling the document */
  @media (min-width: 600px) {
    .frame { height: 100dvh; }
    .frame-body { overflow-y: auto; overscroll-behavior: none; }
  }
  /* flex: 1 0 auto: shrinking to the scroll box would push the bottom padding under the last card (SOLAR-25) */
  /* the gap under the last card matches the one above the first (SOLAR-25) */
  .content { flex: 1 0 auto; display: flex; flex-direction: column; width: 100%; max-width: 1360px; margin: 0 auto; padding: 14px 28px; }
  /* > * so a tab whose root is a grid/stack still behaves as it did before */
  .content > * { flex: none; }
  .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sun {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 38% 34%, #ffd56b, #f4a93a 58%, #e07a1f);
    box-shadow: 0 0 0 4px rgba(244,169,58,0.12);
  }

  .rail { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 4px; padding: 14px 12px;
    background: #0d1117; border-right: 1px solid var(--line); z-index: 6; }
  .rail-logo { height: calc(var(--head-h) - 14px); display: flex; align-items: center; gap: 11px; padding-left: 8px; margin-bottom: 8px;
    font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
  .nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: none; background: none; color: var(--muted);
    border-radius: 9px; font-size: 14.5px; font-weight: 500; text-align: left; }
  .nav button:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav button[aria-current="page"] { color: var(--text); background: rgba(255,255,255,0.075); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); font-weight: 600; }
  .nav button:disabled { cursor: progress; }
  .nav .nav-settings { margin-top: auto; }

  /* the account: a row at the foot of the sidebar, an avatar in a phone's header */
  .acct { position: relative; }
  .acct-rail { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
  .acct-btn { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: none; background: none; border-radius: 9px; text-align: left; color: var(--text); }
  .acct-btn:hover, .acct-btn[aria-expanded="true"], .acct-btn[aria-current="page"] { background: rgba(255,255,255,0.05); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #26303d; color: var(--text);
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
  .who { display: grid; min-width: 0; line-height: 1.25; }
  .who b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span.warn { color: var(--warn); }
  /* a SunSynk login needs reconnecting */
  .acct-btn.needs::after { content: ''; position: absolute; left: 32px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px #0d1117; }
  .acct-head { display: none; }

  /* menus: the plant list and the account */
  .menu { position: absolute; z-index: 20; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 11px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 7px; color: var(--text); font-size: 14px; text-align: left; }
  .menu button:hover, .menu button:focus-visible { background: rgba(255,255,255,0.06); outline: none; }
  .menu button .ico { width: 16px; height: 16px; color: var(--muted); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-left: auto; }
  .menu-email { padding: 8px 10px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct-menu { left: 0; right: 0; bottom: calc(100% + 6px); }
  .plant-menu { top: calc(100% + 6px); left: 0; min-width: 300px; width: max-content; max-width: min(460px, calc(100vw - 260px)); }
  .plant-menu button { display: grid; grid-template-columns: 18px minmax(0, 1fr); padding: 10px 12px; white-space: nowrap; }
  .plant-menu button[aria-checked="true"] { background: rgba(255,255,255,0.075); font-weight: 600; }
  .plant-menu .nm { overflow: hidden; text-overflow: ellipsis; }

  /* header: the plant left; status and refresh right */
  /* flex: none: the page under it no longer shrinks, so a shrinkable header was squashed to 39px (SOLAR-25) */
  /* past 1360 px .content centres, so the padding grows on both sides to keep the plant
     and refresh over the cards' edges */
  .head { flex: none; position: sticky; top: 0; z-index: 5; height: var(--head-h); display: flex; align-items: center; gap: 16px; padding: 0 max(28px, calc((100% - 1360px) / 2 + 28px));
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .plant { position: relative; min-width: 0; margin-left: -10px; }
  .plant-btn { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: 9px;
    background: none; color: var(--text); font-size: 17px; font-weight: 600; }
  .plant-btn:not(.static):hover, .plant-btn[aria-expanded="true"] { background: var(--panel-2); border-color: var(--line-2); }
  .plant-btn .ico { width: 16px; height: 16px; color: var(--muted); }
  .plant-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* the plant name gives way first; the status and its age never clip */
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
  .status-age { font-size: 12.5px; }
  .status-word { font-size: 14px; font-weight: 600; }
  /* every state breathes, in its own colour; --ring is the halo */
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none;
    --ring: rgba(255,255,255,0.14); box-shadow: 0 0 0 3px var(--ring); animation: status-breathe 2.4s ease-in-out infinite; }
  .status-live .status-dot { background: var(--pv); --ring: rgba(61,220,132,0.18); }
  .status-live .status-word { color: var(--pv); }
  .status-stale .status-dot { background: var(--warn); --ring: rgba(245,158,11,0.18); }
  .status-stale .status-word, .status-stale .status-age { color: var(--warn); }
  .status-offline .status-dot { background: var(--bad); --ring: rgba(239,68,68,0.18); }
  .status-offline .status-word, .status-offline .status-age { color: var(--bad); }
  .status-idle .status-word { color: var(--muted); }
  @keyframes status-breathe { 0%, 100% { box-shadow: 0 0 0 3px var(--ring); } 50% { box-shadow: 0 0 0 5px transparent; } }
  @media (prefers-reduced-motion: reduce) { .status-dot { animation: none; } }
  /* "Fetching history" beside the status while a fresh plant's 60 days arrive (0048) */
  .status-sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--soc); padding-left: 9px; border-left: 1px solid var(--line-2); }
  .sync-arc { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(34,211,238,0.25); border-top-color: var(--soc); animation: sync-spin 0.9s linear infinite; flex: none; }
  @keyframes sync-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sync-arc { animation: none; border-top-color: rgba(34,211,238,0.6); } }
  .refresh { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; min-width: 38px; padding: 0 10px; flex: none;
    border-radius: 10px; background: var(--panel); border: 1px solid var(--line-2); color: var(--text); font-size: 14px; font-weight: 500; transition: border-color .15s; }
  .refresh:hover:not(:disabled) { border-color: var(--muted); }
  .refresh:disabled { opacity: .55; cursor: progress; }
  .refresh-stale { color: var(--warn); border-color: rgba(245,158,11,0.45); }
  .refresh-offline { color: var(--bad); border-color: rgba(239,68,68,0.5); padding: 0 14px; }
  /* spins for as long as a snapshot fetch is in flight (app.jsx holds it ≥ 800 ms) */
  .refresh.busy .ico { animation: refresh-spin .8s linear infinite; }
  @keyframes refresh-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh.busy .ico { animation: none; opacity: .5; } }

  /* the page says when its numbers are old, and why; grid off is calm purple, not a fault */
  .notice { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; border: 1px solid; font-size: 14px; }
  .notice p { margin: 0; flex: 1 1 240px; line-height: 1.45; }
  .notice p b { font-weight: 600; }
  .notice.stale { border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.07); }
  .notice.offline { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.07); }
  .notice.gridoff { border-color: rgba(167,139,250,0.35); background: rgba(167,139,250,0.08); }
  .page { display: flex; flex-direction: column; }
  .page.old .mini-value, .page.old .stat-value, .page.old .metric-value, .page.old .flow-wrap,
  .page.old .chart-area, .page.old .solar-dest, .page.old .solar-verdict { opacity: 0.45; }

  /* phone-only pieces, hidden wider */
  .phonebar, .sheet { display: none; }

  /* tablet: an 84 px rail, the icon over its name, initials for the account */
  @media (min-width: 600px) and (max-width: 1023px) {
    .frame { --rail-w: 84px; }
    .rail { padding: 14px 8px; }
    .rail-logo { justify-content: center; padding-left: 0; }
    .rail-logo .app-name { display: none; }
    .nav button { flex-direction: column; gap: 5px; padding: 9px 2px 8px; font-size: 11.5px; text-align: center; }
    .nav button .t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct-btn { justify-content: center; padding: 8px 0; }
    .acct-rail .who { display: none; }
    .acct-btn.needs::after { left: calc(50% + 8px); }
    .acct-menu { right: auto; width: 250px; }
    .head, .content { padding-left: 24px; padding-right: 24px; }
  }

  /* phone: the header plus a five-slot bottom bar; the account moves to the header */
  @media (max-width: 599px) {
    .frame { --head-h: 56px; grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .head { padding: 0 10px 0 14px; gap: 8px; }
    .plant { margin-left: -8px; }
    .plant-btn { font-size: 15.5px; padding: 6px 8px; }
    .plant-menu { min-width: 0; width: calc(100vw - 20px); max-width: 360px; }
    .status-sync { display: none; }
    .refresh { height: 36px; min-width: 36px; }
    @media (max-width: 399px) { .refresh-offline { padding: 0 10px; } .refresh .lbl { display: none; } }
    /* the plant name needs the room more; the page's banner already says how old the reading is */
    @media (max-width: 359px) { .status-age { display: none; } }
    .acct-head { display: block; flex: none; }
    .acct-head .acct-btn { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; }
    .acct-head .avatar { width: 32px; height: 32px; }
    .acct-head .acct-btn.needs::after { left: auto; right: 1px; top: 1px; box-shadow: 0 0 0 2px var(--bg); }
    .acct-head .acct-menu { left: auto; right: 0; bottom: auto; top: calc(100% + 6px); width: 260px; max-width: calc(100vw - 20px); }
    /* bottom: the 56px bar plus the same 10px gap as at the top (SOLAR-25) */
    .content { padding: 10px 12px calc(66px + env(safe-area-inset-bottom, 0px)); }

    .phonebar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: #0d1117; border-top: 1px solid var(--line);
      padding: 0 6px env(safe-area-inset-bottom, 0px); }
    .phonebar button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 10px;
      border: none; background: none; color: var(--muted); font-size: 11.5px; font-weight: 500; }
    .phonebar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .phonebar button[aria-current="page"], .phonebar button.on { color: var(--text); font-weight: 600; }
    .phonebar button[aria-current="page"] .ico, .phonebar button.on .ico { stroke-width: 2.2; }

    .sheet { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(5,7,10,0.55); }
    .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel-2); border-top: 1px solid var(--line-2); border-radius: 16px 16px 0 0;
      padding: 8px 10px calc(14px + env(safe-area-inset-bottom, 0px)); }
    .sheet-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 4px auto 10px; }
    .sheet-panel button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 12px; border: none; background: none; border-radius: 10px;
      font-size: 15px; text-align: left; color: var(--text); }
    .sheet-panel button[aria-current="page"] { background: rgba(255,255,255,0.075); font-weight: 600; }
  }

  /* ---------- cards ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; }
  /* charts want the width more than they want the gutter */
  .trend-chart-card { padding-left: 12px; padding-right: 12px; }
  /* the day chart and power flow keep one gutter on all four sides */
  .chart-card, .flow-card { padding: 12px; }
  /* the 28px Fullscreen button made the row taller and centring pushed the title down;
     pin both to the top so the title sits as far from the top edge as from the left */
  .flow-card .section-title { align-items: flex-start; }
  /* loading stand-in for .flow-wrap: the summary line (app.jsx), then the diagram, which
     the wide layout draws 374px tall at every width; the stacked one (flow.jsx, ≤900px) is about 625px */
  .flow-skel { height: 374px !important; }
  /* a chart's plot area before it can be drawn, at the heights useChartSize picks */
  .chart-skel { height: 300px !important; }
  @media (max-width: 620px) { .chart-skel { height: 220px !important; } }
  /* the month's bars, likewise */
  .bars-skel { height: 220px !important; }
  @media (max-width: 620px) { .bars-skel { height: 192px !important; } }
  /* a tile's second line held open at two lines where the real one wraps (SolarSkeleton) */
  @media (max-width: 600px) { .sub-hold-2 { display: block; height: 34px; } }
  @media (max-width: 900px) { .flow-skel { height: 625px !important; } }
  /* legend to plot gets the same gap as date bar to legend */
  .hv-root .legend-row { margin-bottom: 12px; }
  .grow { flex: 1; } .stack { display: flex; flex-direction: column; gap: 20px; }
  .section-title { display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; margin-bottom: 18px; }
  .section-right { font-size: 11px; letter-spacing: 0.04em; }

  /* ---------- stat tiles (the 4 the user liked) ---------- */
  .stat-tile { display: flex; flex-direction: column; gap: 0; }
  .stat-label { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .stat-value { font-family: var(--mono); font-weight: 700; margin-top: 10px; line-height: 1; display: flex; align-items: baseline; }
  .stat-value .num { font-size: 44px; }
  .stat-value .unit { font-size: 24px; margin-left: 4px; opacity: 0.85; }
  .stat-sub { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .stat-sub b { color: var(--text); font-weight: 600; }
  .batt-eta { display: block; margin-top: 7px; font-size: 12px; color: var(--soc); font-family: var(--mono); letter-spacing: -0.01em; }
  .batt-eta b { color: var(--soc); font-weight: 700; }
  .batt-eta .bel { display: block; }
  .batt-eta .bel.sub { color: var(--muted); margin-top: 1px; }
  .meter { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; margin-top: 14px; position: relative; }
  .meter.sm { height: 5px; margin-top: 8px; }

  .mini-label { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 2px 8px; }
  .ml-text { display: flex; align-items: center; min-width: 0; line-height: 1.35; }

  .mv-unit { font-size: 14px; font-weight: 500; margin-left: 4px; opacity: 0.85; }

  /* baseline, not flex-end. Aligning the boxes lines up the two fonts' DESCENDER
     space, and the mono face reserves more of it — so its glyphs ride higher and the

  .mini-value { font-size: 24px; font-weight: 600; margin-top: 10px; letter-spacing: -0.01em;
    display: flex; align-items: baseline; flex-wrap: wrap; row-gap: 2px; }
  /* Baseline alone sits the badge a touch high, box-bottom a touch low. 1px down off
     the baseline is the middle, and it is a nudge rather than a different rule. */
  .trend-badge { position: relative; top: 1px; }

  /* a tile's second line that is an action ("Set your rate" on Est. saved with no rate yet) */

  /* a Settings card flashes once when a link elsewhere sends you to it */

  @keyframes sset-flash {

  /* grid presence chip on the Imported card — green when the mains is live, red when down */

  .grid-state { display: inline-flex; align-items: center; gap: 6px; cursor: help; padding-left: 3px; }

  .mini-sub { font-size: 12.5px; color: var(--dim); margin-top: 5px; line-height: 1.35;

  /* ---------- flow svg ---------- */

  /* wall-dashboard mode (tabs.jsx): a class rather than :fullscreen, because an iPad

  .flow-fs-wrap.wall { --wall-pad: clamp(16px, 3vmin, 48px);
    position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: var(--bg);
    display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); gap: clamp(8px, 1.5vmin, 24px);
    padding: max(var(--wall-pad), env(safe-area-inset-top)) max(var(--wall-pad), env(safe-area-inset-right))
             max(var(--wall-pad), env(safe-area-inset-bottom)) max(var(--wall-pad), env(safe-area-inset-left));
    font-size: clamp(14px, 1.6vmin + 4px, 24px); }

    transition: opacity .3s, visibility .3s, border-color .15s, color .15s; }

  @media (prefers-reduced-motion: reduce) { .wall .wall-exit { transition: none; } }
  .wall .flow-card { background: none; border: 0; border-radius: 0; padding: 0; min-height: 0; }

  /* both layouts are HTML at screen sizes; tabs.jsx sets the zoom that fills the room */

  .wall .mflow { flex: none; width: 440px; max-width: none; margin: 0 auto; zoom: var(--wall-zoom, 1); }
  /* slide a whole number of dash-periods so the loop is seamless: 195 = 15 (desktop "2 13") × 13 (mobile "2 11") */
  @keyframes flow { to { stroke-dashoffset: -195; } }

  /* ---------- power-flow box, shared by both layouts (SOLAR-39) ---------- */

  .fbox-val { font: 600 30px var(--mono); letter-spacing: -0.01em; line-height: 1; margin-top: 12px; white-space: nowrap; }

  .hv-today { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font-size: 12px; padding: 6px 12px; cursor: pointer; transition: .15s; margin-left: auto; }
  .hv-today:hover { border-color: var(--line-2); }
  .hv-lag { font-size: 12px; color: var(--dim); }
  .chart-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .chart-controls-right { display: flex; align-items: center; gap: 10px; }
  .chart-area { width: 100%; min-width: 0; overflow: hidden; }
  .chart-svg { display: block; touch-action: pan-y; }
  .ax { font: 400 11.5px var(--mono); fill: var(--muted); }
  .ax-hi { fill: var(--text); }
  .legend-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .legend-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; color: var(--text); transition: .15s; }
  .legend-chip.off { color: var(--dim); }
  .legend-val { margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--line-2); font-family: var(--mono); font-weight: 600; letter-spacing: -0.01em;
    display: inline-block; min-width: 9.5ch; text-align: left; font-variant-numeric: tabular-nums; }
  .legend-chip.off .legend-val { color: var(--dim); border-color: var(--line); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; }
  .legend-note { font-size: 12.5px; color: var(--dim); margin-left: 4px; }
  .legend-mode { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
  /* Dragging across a chart otherwise text-selects the axis labels and tooltip, so the
     plot fills with blue highlight while you're trying to read a range. Charts are
     interactive surfaces, not prose — nothing here is worth selecting. */
  svg.chart-svg, .chart-area, .hv-root, .trend-chart, .chart-tip, .trend-tip, .chart-legend, .seg-usage {
    -webkit-user-select: none; user-select: none;
  }
  /* stops the long-press "copy/share" bubble on iOS while dragging the chart */
  svg.chart-svg { -webkit-touch-callout: none; }

  .chart-tip { position: absolute; pointer-events: none; background: rgba(13,17,23,0.96); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 10px 12px; min-width: 168px; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,0.5); z-index: 5; }
  .tip-time { font: 600 12px var(--mono); color: var(--text); margin-bottom: 8px; }
  .tip-row { display: flex; align-items: center; gap: 7px; font-size: 12px; margin: 3px 0; }
  .tip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tip-l { color: var(--muted); } .tip-v { margin-left: auto; color: var(--text); }
  .tip-total { margin-top: 5px; border-top: 1px solid var(--line); padding-top: 6px; }
  .tip-total .tip-l { color: var(--text); font-weight: 600; }
  /* drag-to-select range totals */
  .chart-range { position: absolute; left: 8px; top: 8px; background: rgba(13,17,23,0.97); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 9px 12px; min-width: 180px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); z-index: 6; }
  .cr-head { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .cr-head .tip-time { margin-bottom: 0; }
  .cr-x { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
  .cr-x:hover { color: var(--text); }
  /* lives in the SVG's empty top margin — bottom-right overlapped the last x-axis label */
  .chart-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 18px;
    border-top: 1px solid var(--line); padding-top: 18px; }
  .sum-cell { } .sum-label { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .sum-value { font-size: 22px; font-weight: 600; margin-top: 6px; } .sum-sub { font-size: 11px; color: var(--dim); margin-top: 3px; }

  /* ---------- segmented / buttons ---------- */
  .segmented { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg-btn { background: none; border: none; color: var(--muted); padding: 7px 15px; border-radius: 7px; font-size: 13px; font-weight: 500; transition: .12s; }
  .seg-sm .seg-btn { padding: 5px 11px; font-size: 12.5px; }
  .seg-btn:hover { color: var(--text); } .seg-btn.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .ghost-btn { background: none; border: 1px solid var(--line-2); color: var(--muted); padding: 7px 14px; border-radius: 9px; font-size: 12.5px; transition: .15s; }
  .ghost-btn:hover { color: var(--text); } .ghost-btn.active { border-color: var(--pv); color: var(--pv); }

  /* ---------- metric / badge ---------- */
  .metric-label { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .metric-value { font-size: 20px; font-weight: 600; margin-top: 5px; }
  .metric-unit { font-size: 13px; color: var(--muted); margin-left: 2px; font-family: var(--mono); }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 4px 11px; border-radius: 999px; border: 1px solid; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  /* a dead SunSynk login: on the Settings tab and its Logins entry */
  .alert-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-left: 6px; vertical-align: middle; }
  .badge-ok { color: var(--ok); border-color: rgba(61,220,132,0.4); background: rgba(61,220,132,0.08); }
  .badge-warn { color: var(--load); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }
  .badge-neutral { color: var(--muted); border-color: var(--line-2); }

  /* ---------- grids used by tabs ---------- */
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .hint-line { font-size: 13.5px; color: var(--dim); margin-top: 16px; line-height: 1.5; }

  /* solar tab, and the Battery and Grid tabs, which are built the same way */
  .solar-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .solar-stats .stat-tile { padding: 26px 28px; }
  .stat-sub .trend-badge { margin: 0 3px 0 0; top: 0; }
  .solar-tab .section-title .info-dot { margin-left: 8px; }
  .solar-tab .section-right { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .solar-tab .section-right b { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .solar-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 20px; align-items: stretch; }
  .solar-row > * { min-width: 0; }
  .solar-row > :only-child { grid-column: 1 / -1; }
  #solar-day, #battery-day, #grid-day { scroll-margin-top: 16px; }
  .solar-empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .tip-hint { font-size: 12px; color: var(--dim); margin-top: 6px; }
  /* Where it went: one object. Each share is a column — its own segment of the bar, its
     kWh tinted in the series colour, its name under it. The bar keeps exact proportions;
     the label row below carries a min-width floor so a thin share never clips its text,
     which is why the two are separate elements rather than one nested column. */
  .solar-split { display: flex; gap: 3px; cursor: help; }
  .solar-split i { display: block; height: 10px; border-radius: 4px; min-width: 3px; }
  .solar-dest { display: flex; gap: 3px; margin-top: 13px; }
  .solar-dest .sd { flex: 0 1 auto; min-width: 84px; }
  .solar-dest .sd-v { font-size: 20px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  .solar-dest .sd-v s { text-decoration: none; font-size: 11px; font-weight: 700; opacity: 0.85; margin-left: 3px; }
  .solar-dest .sd-k { margin-top: 7px; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap; }
  .solar-note { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); max-width: 60ch; }
  .solar-verdict { font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
  .solar-verdict .mono { font-weight: 700; }
  .solar-spare-note { margin: 14px 0 6px; font-size: 13.5px; color: var(--muted); max-width: 62ch; line-height: 1.5; }
  .solar-lead { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
  .solar-invs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px 20px; }
  .solar-inv-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12.5px; }
  .solar-inv-name { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
  .solar-inv-today { font-family: var(--mono); color: var(--pv); }
  .solar-strings { display: grid; gap: 8px; }
  .solar-string { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .solar-string.warn { border-color: rgba(248,113,113,0.35); }
  .solar-string-top { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap; }
  .solar-string-name { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
  .solar-string-kw { font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--pv); }
  .solar-string.idle .solar-string-kw { color: var(--muted); }
  .solar-string-sub { margin-top: 7px; font-family: var(--mono); font-size: 13px; color: var(--dim); }
  .solar-best { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .solar-best b { font-family: var(--mono); font-weight: 600; color: var(--text); }

  /* battery packs */
  .mini-panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .mp-head { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 14px; }

  /* inverters */
  .inv-card { } .inv-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .inv-sn { font-size: 22px; font-weight: 700; font-family: var(--mono); }
  .inv-meta { font-size: 12.5px; margin-top: 5px; }
  .inv-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 18px 16px; }
  .inv-warn { margin-top: 18px; font-size: 12.5px; color: var(--load); background: rgba(248,113,113,0.07);
    border: 1px solid rgba(248,113,113,0.25); border-radius: 7px; padding: 9px 12px; }

  /* ---------- settings and account ----------
     One scrolling page each. A section is its title and note on the left and its card
     on the right; one column on a phone. */
  .settings-page { display: flex; flex-direction: column; max-width: 920px; padding-bottom: 24px; }
  .page-head h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .page-head p { margin: 0 0 6px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .sec { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; padding: 22px 0; border-top: 1px solid var(--line); margin-top: 16px;
    scroll-margin-top: calc(var(--head-h, 60px) + 12px); }
  .page-head + .sec { margin-top: 16px; }
  .sec + .sec { margin-top: 0; }
  .sec-intro { min-width: 0; }
  .sset { padding: 18px 22px 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
  .sset-title { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .sset-note { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .sset-count { margin-left: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; color: var(--dim); }
  /* the inverter's own answers, folded away under the battery */
  details.adv { margin-top: 12px; border-top: 1px solid var(--line); }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 13.5px; padding: 14px 0 4px; list-style: none; }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary::before { content: '▸ '; } details.adv[open] summary::before { content: '▾ '; }
  details.adv summary:hover { color: var(--text); }
  @media (max-width: 899px) {
    .sec { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  }
  .sset .field-row { grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .sset .field { margin-bottom: 0; }
  .sset .field-row .field-note { margin-top: 8px; }
  /* toggle rows keep the login rows' rhythm: 14px, no rule above the first, nothing under the last.
     (`:first-of-type` never matched: the field's own <label> is the first label in the field.) */
  .sset .toggle-row { padding: 14px 0; }
  .sset .field > label:not(.toggle-row) + .toggle-row { border-top: none; padding-top: 6px; }
  .sset .field > .toggle-row:last-of-type { padding-bottom: 0; }
  .sset-choice .toggle-label { color: var(--text); }
  .sset-choice .segmented { margin-top: 12px; }
  .sset-choice .seg-btn { white-space: nowrap; }
  /* Toggle is a <label>, and .field label is display:block; put the row back to flex */
  .sset .field label.toggle-row { display: flex; margin-bottom: 0; letter-spacing: 0; color: var(--text); }
  .sset .field label.toggle-row .toggle-label { font-size: 14px; }
  .sset .sset-body > .field + .field { margin-top: 20px; }
  /* Tariff, Plant and Battery: the login rows' layout (name and hint left, control right).
     The name is a <label> or a <div> of spans, so stack the spans like the login rows' divs. */
  .sset-row .conn-text > span { display: block; }
  /* no rules between these rows (the tiles already box each answer); 20px apart, like Display's fields */
  .conn-row.sset-row { border-top: none; padding: 10px 0; }
  .sset-body > .sset-row:last-child { padding-bottom: 0; }
  .unit-input.wide { width: 150px; }
  .unit-input.wide .input { padding-right: 66px; }   /* room for "R/unit" */
  /* a number box with its unit inside it, e.g. "26.5 kWh" */
  .unit-input { position: relative; width: 128px; }
  .unit-input .input { padding-right: 46px; -moz-appearance: textfield; }
  .unit-input .input::-webkit-outer-spin-button, .unit-input .input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .unit-input .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--dim); pointer-events: none; }
  .cap-switch { flex-basis: 100%; margin-top: 2px; }   /* the switch leads the boxes it governs */
  /* panel capacity: the Total box, or the By panel rows, under the row's name and switch */
  .cap-body { flex-basis: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .cap-text { flex: 1 1 auto; min-width: 0; }
  .sset-row .conn-text > .cap-head { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .cap-kw { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .cap-kw.empty { color: var(--dim); }
  .panel-add { background: none; border: none; padding: 0; color: var(--pv); font-size: 13px; font-weight: 600; cursor: pointer; }
  .panel-add:hover { text-decoration: underline; text-underline-offset: 3px; }
  .panel-add:focus-visible { outline: 2px solid var(--pv); outline-offset: 3px; border-radius: 3px; }
  .panel-row > * { animation: conn-in .2s ease-out; }   /* an added row eases in, as a login row does */
  @media (prefers-reduced-motion: reduce) { .panel-row > * { animation: none; } }
  .cap-err { margin: 0; font-size: 12px; line-height: 1.5; color: var(--load); }
  .cap-total { flex-direction: row; align-items: center; gap: 12px; }   /* the error sits beside the box, so it moves nothing */
  /* By panel: count × watts and a remove per row. The two box columns give way on the narrowest
     phones rather than push the remove out of the card. */
  .panel-list { display: grid; grid-template-columns: minmax(0, 76px) min-content minmax(0, 96px) min-content; align-items: center; gap: 8px; width: max-content; max-width: 100%; }
  .panel-row { display: contents; }
  .panel-list .unit-input { width: auto; }
  .panel-of { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .unit-input.panel-watts .input { padding-right: 32px; }   /* room for "W" */
  @media (max-width: 355px) { .panel-list { grid-template-columns: minmax(0, 64px) min-content minmax(0, 84px) min-content; } }
  .panel-del { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; background: none; border: none; border-radius: 7px; color: var(--muted); cursor: pointer; transition: color .15s; }
  .panel-del:hover { color: var(--text); }
  .panel-del:focus-visible { outline: 2px solid var(--pv); outline-offset: -2px; }
  @media (max-width: 600px) { .panel-del { width: 44px; height: 44px; } }   /* a finger-sized remove */
  .cap-body .cap-err { min-height: 18px; }   /* the error's slot, kept even when there is none */
  .input[aria-invalid="true"], .input[aria-invalid="true"]:focus { border-color: var(--load); }
  /* reserve's slider runs the row's full width under its name and box, filled to the value */
  /* pick one of a few (Plant, Battery, Display): described tiles across the row, native radios underneath */
  .choice-tiles { flex-basis: 100%; display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px; }
  .sset-choice .choice-tiles { margin-top: 12px; }
  .choice-tile { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel-2); cursor: pointer; transition: border-color .15s, background-color .15s; }
  .choice-tile:hover { border-color: rgba(255,255,255,0.2); }
  .choice-tile.on { border-color: rgba(61,220,132,0.55); background: rgba(61,220,132,0.06); }
  .choice-tile input { -webkit-appearance: none; appearance: none; flex: none; width: 16px; height: 16px; margin: 2px 0 0; border: 1.5px solid var(--dim); border-radius: 50%; cursor: pointer; }
  .choice-tile input:checked { border: 5px solid var(--pv); }
  .choice-tile input:focus-visible { outline: 2px solid var(--pv); outline-offset: 2px; }
  /* a tile is a <label>; inside a .field (Display) the field's small grey block label style would win */
  .sset .field label.choice-tile { display: flex; margin-bottom: 0; font-size: inherit; letter-spacing: 0; color: var(--text); }
  .choice-text { flex: 1; min-width: 0; }
  .choice-text > span { display: block; }
  @media (max-width: 600px) {
    .sset-row > .conn-text { flex-basis: 100%; }   /* on a phone each control drops under its name */
    .choice-tiles { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .choice-tile { transition: none; } }

  /* just the number, centred under the last section */
  .app-version { padding-top: 14px; text-align: center; font-size: 11.5px; color: var(--dim); }
  .conn-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .conn-row:first-child { border-top: none; padding-top: 0; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grid); flex: none; }
  .conn-dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,220,132,0.18); }
  .conn-text { flex: 1; min-width: 0; }
  .conn-user { font-size: 14px; }
  .conn-plants { color: var(--muted); }
  /* the add row: a filled button so it reads as the section's one action, plus a hint */
  .conn-add { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }
  #settings-delete .conn-row { padding-bottom: 0; }
  .conn-add-row { padding-bottom: 0; }   /* the open add form ends at the card's own padding */
  .conn-add .save-btn { display: inline-flex; align-items: center; gap: 6px; }
  .conn-meta { font-size: 13px; color: var(--dim); margin-top: 3px; line-height: 1.5; }
  .conn-status::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--grid); }
  .conn-status.ok { color: var(--ok); } .conn-status.ok::before { background: var(--ok); }
  .conn-status.warn { color: var(--warn); } .conn-status.warn::before { background: var(--warn); }
  .conn-actions { display: flex; gap: 8px; align-self: center; flex: none; }   /* centred on the row's two text lines */
  .conn-row { align-items: flex-start; flex-wrap: wrap; }
  /* a login row or an inline card eases in; a removed row folds away before the list refreshes */
  @keyframes conn-in { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes conn-out { from { max-height: 200px; } to { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; border-color: transparent; } }
  .conn-row > .conn-text, .conn-row > .conn-actions, .conn-form { animation: conn-in .2s ease-out; } /* the row's rule itself stays put */
  .conn-row.leaving { overflow: hidden; animation: conn-out .24s ease-in forwards; }
  @media (prefers-reduced-motion: reduce) { .conn-row > .conn-text, .conn-row > .conn-actions, .conn-form, .conn-row.leaving { animation: none; } }
  .conn-row > .conn-form { flex-basis: 100%; }
  .conn-form { margin-top: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.015); }
  .conn-form .field-row { grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .conn-form-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  /* inline confirmation for a destructive row: same inset box, coral edge and tint */
  .confirm-card { margin-top: 4px; border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.06); }
  .confirm-title { font-size: 15px; line-height: 1.4; color: var(--text); }
  .confirm-title b { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
  .confirm-text { margin-top: 4px; font-size: 14px; line-height: 1.5; color: var(--text); }

  .confirm-card .conn-form-actions { margin-top: 12px; }

  /* unsaved plant changes: one bar floating at the foot of the screen (above a phone's bar) */
  .save-bar { position: sticky; bottom: 16px; z-index: 4; display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 12px 10px 16px;
    background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
  @media (max-width: 599px) { .save-bar { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } }
  .save-bar.dirty { border-color: rgba(61,220,132,0.4); }
  .save-text { font-size: 13px; color: var(--muted); margin-right: auto; }
  .save-btn { background: var(--pv); color: #07130c; border: none; padding: 8px 18px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .save-btn:disabled { opacity: .4; cursor: default; }   /* a Save that cannot save must not look like one that can */
  .sset .ghost-btn:disabled, .sset .danger-btn:disabled { opacity: .5; }

  @media (max-width: 900px) {
    .sset { padding: 16px 15px 20px; border-radius: 14px; }
    .sset .field-row { grid-template-columns: 1fr; }
    /* one button sits beside the text; a dead login's two (Reconnect + Remove) drop under it */
    .conn-row { flex-wrap: wrap; }
    .conn-actions:has(> :nth-child(2)) { width: 100%; }
    .conn-actions:has(> :nth-child(2)) > * { flex: 1; }
    .conn-form .field-row { grid-template-columns: 1fr; }
    .save-bar { flex-wrap: wrap; }
    .save-text { flex-basis: 100%; }
  }
  .field { margin-bottom: 16px; } .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.04em; }
  .field-note { font-size: 13px; color: var(--dim); margin-top: 10px; line-height: 1.55; }
  .input { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--text);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: var(--mono); }
  .input:focus { outline: none; border-color: var(--grid); }
  /* Autofilled fields, on every input in the app (login and Settings both sit on
     --panel-2). Chrome paints its own near-white background for an autofilled field
     and ignores `background`, so the only way to keep a dark field dark is to cover it
     with a huge inset box-shadow. The absurd transition delay is the companion trick:
     the background is animated, and a ~forever delay means it never arrives. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active,
  select:-webkit-autofill {
    -webkit-box-shadow: 0 0 0 1000px var(--panel-2) inset;
    -webkit-text-fill-color: var(--text);
    caret-color: var(--text);
    transition: background-color 9999s ease-in-out 0s;
  }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
  .toggle-row:first-of-type { border-top: none; }
  .toggle-text { display: flex; flex-direction: column; gap: 3px; }
  .toggle-label { font-size: 14.5px; } .toggle-hint { font-size: 12.5px; color: var(--dim); }
  .switch { width: 42px; height: 24px; border-radius: 14px; background: rgba(255,255,255,0.1); border: none; position: relative; transition: .18s; flex: none; }
  .switch.on { background: var(--ok); }
  .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .18s; }
  .switch.on .knob { left: 21px; }

  .sparkline { display: block; }

  /* info tooltip */
  .info-dot { position: relative; display: inline-flex; align-items: center; vertical-align: middle;
    color: var(--dim); cursor: help; margin-left: 5px; }
  .info-dot:hover, .info-dot:focus { color: var(--grid); outline: none; }
  /* a 13px glyph is too small to tap; the invisible pad makes the hit area ~37px */
  .info-dot::before { content: ''; position: absolute; inset: -12px; }
  .info-dot svg { display: block; }
  /* Closed, the bubble is display: none: a hidden one still widened the page and put a
     horizontal scrollbar under a dot near the right edge (SOLAR-26). Open, it is nudged by
     --shift to stay on screen, and the arrow moves back by the same so it still points at the dot. */
  .info-bubble { display: none; position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(calc(-50% + var(--shift, 0px))) translateY(4px);
    width: 210px; background: rgba(13,17,23,0.98); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px;
    font-family: var(--display); font-size: 12px; font-weight: 400; line-height: 1.5; letter-spacing: 0; text-transform: none;
    color: var(--text); box-shadow: 0 14px 34px rgba(0,0,0,0.55); opacity: 0; visibility: hidden; transition: opacity .15s, transform .15s;
    z-index: 30; pointer-events: none; }
  .info-bubble::after { content: ''; position: absolute; top: 100%; left: calc(50% - var(--shift, 0px)); transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: var(--line-2); }
  .info-dot:hover .info-bubble, .info-dot:focus .info-bubble { display: block; opacity: 1; visibility: visible; transform: translateX(calc(-50% + var(--shift, 0px))) translateY(0); }
  @starting-style { .info-dot:hover .info-bubble, .info-dot:focus .info-bubble { opacity: 0; transform: translateX(calc(-50% + var(--shift, 0px))) translateY(4px); } }

  @media (max-width: 980px) {
    .stat-col { grid-template-columns: 1fr 1fr; }
    .solar-stats { grid-template-columns: 1fr 1fr; }
    .solar-row { grid-template-columns: minmax(0, 1fr); }
    .trio, .quad, .duo, .inv-grid, .field-row { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- phones ---------- */
  @media (max-width: 600px) {
    /* thumb-sized targets on phones (36px inside the segmented track), desktop unchanged */
    .hv-daynav { width: 40px; height: 40px; }
    .hv-today, .hv-dateinput { min-height: 40px; }
    /* SOLAR-27: arrows at the two ends, the date centred between them as "Fri 2 Oct" */
    .hv-datebox { display: flex; flex: 1; min-width: 0; min-height: 40px; align-items: center; justify-content: center; gap: 10px;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
    .hv-datepick { display: inline-flex; position: relative; align-items: center; gap: 8px; padding: 6px 4px; cursor: pointer; }
    .hv-cal { display: block; flex: none; color: var(--muted); }
    .hv-dateface { display: inline; font: 600 14px var(--display); letter-spacing: 0.01em; color: var(--text); white-space: nowrap; }
    /* the real input, invisible, over the words: a tap opens the phone's own picker */
    .hv-datepick .hv-dateinput { position: absolute; inset: 0; width: 100%; min-height: 0; opacity: 0; padding: 0; border: 0; }
    .hv-today-out { display: none; }
    .hv-today-in { display: inline-flex; align-items: center; min-height: 0; margin-left: 0; background: none; border: 0; border-left: 1px solid var(--line-2);
      border-radius: 0; padding: 2px 0 2px 10px; color: var(--soc); font: 500 12px var(--display);
      text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
    .legend-chip { min-height: 40px; }
    .seg-btn { min-height: 36px; }
    .ghost-btn, .danger-btn, .flow-fs-btn { min-height: 40px; }
    .trend-stats { grid-template-columns: 1fr; }

    .card { padding: 16px 15px; border-radius: 14px; min-width: 0; }
    .chart-card, .flow-card { padding: 15px; }
    /* let grid/flex items shrink below their content so wide children scroll instead of widening the page */
    .live-grid > *, .stack > *, .duo > * { min-width: 0; }

    /* big-number rows stack; metric grids stay 2-up */
    .stat-col, .trio, .duo { grid-template-columns: 1fr; }
    .quad, .inv-grid, .solar-stats, .mp-grid, .field-row { grid-template-columns: 1fr 1fr; }
    /* five overview tiles in a two-up grid orphan the last one; an odd last tile spans */
    .today-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .today-strip > :last-child:nth-child(odd) { grid-column: 1 / -1; }
    .mini-stat { padding: 14px; }
    .mini-value { font-size: 21px; }
    .solar-stats { gap: 12px; }
    .solar-stats .stat-tile { padding: 18px; }
    .solar-tab .section-title { flex-direction: column; align-items: flex-start; gap: 5px; }
    .solar-row { gap: 14px; }
    .solar-invs { grid-template-columns: 1fr; }
    .stat-value .num { font-size: 34px; }
    .stat-value .unit { font-size: 18px; }
    .inv-sn { font-size: 18px; }

    /* chart: smaller pills */
    .legend-chip { padding: 5px 10px; font-size: 11.5px; }

    /* power-flow: the summary sentence a step smaller on a phone */
    .flow-narrative { font-size: 15.5px; }

    /* keep wide controls/SVGs from forcing the grid column wider than the screen. clip, not
       hidden: hidden makes a scroll box, and focusing a period button scrolled it sideways
       onto the hidden info bubbles that hang past the edge */
    .overview-section, .flow-card { overflow: clip; }
    .overview-head { flex-direction: column; align-items: stretch; gap: 10px; }
    .overview-head .segmented { display: flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    .overview-head .segmented::-webkit-scrollbar { display: none; }
    .seg-btn { padding: 6px 10px; }

    .hv-approx { font-size: 11px; padding: 1px 6px; }

    /* battery banner on phones: status on row 1, stats forced to their own row
       below via flex-basis:100% (margin-auto alone doesn't wrap reliably) */
    .batt-balance { font-size: 12px; gap: 6px 14px; }
    .bb-div { display: none; }
    .bb-stats { flex-basis: 100%; gap: 10px 18px; }

    /* a phone is not a wall display, so no Fullscreen button there
       (Exit stays, for a desktop window narrowed while in wall mode) */
    .flow-fs-btn:not(.wall-exit) { display: none; }

    /* trend card sub-nav: stack the label above its control on phones */
    .trend-subnav { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
  /* --- login gate ------------------------------------------------------- */
  /* ---- auth + connect screens ------------------------------------------------
     One card system shared by sign-in, sign-up, reset and Connect-SunSynk. The
     ambient glow is the same warm sun as the header orb, so the sign-in page reads
     as the front door of the same product rather than a generic form. */
  .login-wrap {
    /* Centred. Field errors sit on the label line, so only a server error grows the card,
       nudging it up about 10px once. min-height, not height, so a tall card never clips. */
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    position: relative; isolation: isolate;
  }
  .login-wrap::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(520px 320px at 50% 38%, rgba(244,169,58,0.10), transparent 70%),
      radial-gradient(900px 500px at 50% 110%, rgba(61,220,132,0.06), transparent 70%);
  }
  /* Sizes follow common guidance: 52px fields (44-48 minimum targets), 16px field text (iOS
     zooms below it). Spacing: 10 inside a pair, 20 between items, 30 between groups, 40 under
     the brand. The card gap is 20; groups add margin-top: 10. Padding is 32 on every side:
     48 was proportioned for the old 600px card and reads heavy at this width. */
  .login-card {
    width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line-2); border-radius: 22px; padding: 32px;
    color: var(--text); text-align: left;
    box-shadow: 0 24px 60px -30px rgba(0,0,0,0.9), 0 0 0 1px rgba(0,0,0,0.25) inset;
  }
  .auth-brand { display: flex; align-items: center; gap: 14px; }
  .auth-brand .sun { width: 40px; height: 40px; box-shadow: 0 0 0 5px rgba(244,169,58,0.10), 0 0 28px rgba(244,169,58,0.40); }
  .auth-brand-name { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
  .auth-brand-tag { font-size: 13.5px; color: var(--dim); margin-top: 6px; letter-spacing: 0.01em; }
  .login-title { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 20px; }
  .login-sub { font-size: 16px; color: var(--muted); line-height: 1.5; margin-top: -10px; margin-bottom: 10px; }
  .auth-field { display: flex; flex-direction: column; gap: 10px; }
  .auth-label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .auth-field > label, .auth-label-row > label { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .login-card input {
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px;
    padding: 15px 18px; color: var(--text); font-family: var(--display); font-size: 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  .login-card input::placeholder { color: var(--dim); }
  .login-card input:focus { outline: none; border-color: var(--pv); box-shadow: 0 0 0 3px rgba(61,220,132,0.14); }
  /* invalid: red border; invalid and focused: red border plus the ring, so focus stays visible */
  .login-card input:not([type="checkbox"])[aria-invalid="true"] { border-color: var(--load); box-shadow: none; }
  .login-card input:not([type="checkbox"])[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(248,113,113,0.28); }
  /* the ring hugs the box, with no green focus glow around it, and the links go red with the
     rest of the sentence */
  .auth-consent input[aria-invalid="true"] { outline: 2px solid var(--load); outline-offset: 0; box-shadow: none; }
  .auth-consent.invalid > span, .auth-consent.invalid a { color: var(--load); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .auth-consent input[aria-invalid="true"]:focus-visible { box-shadow: 0 0 0 6px rgba(248,113,113,0.28); }
  .field-hint { color: var(--dim); font-size: 13px; line-height: 1.2; text-align: right; }
  /* a follow-up link inside an error sentence stays inline, not a 48px row */
  .login-card .login-err .login-link { min-height: 0; display: inline; font-size: inherit; }
  .field-err { color: var(--load); font-size: 13px; line-height: 1.2; text-align: right; }
  .login-pw { position: relative; display: flex; }
  .login-pw input { flex: 1; padding-right: 56px; min-width: 0; }
  .login-card .login-eye {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; padding: 0;
    background: none; border: 0; border-radius: 8px;
    color: var(--muted); cursor: pointer; transition: color .15s;
  }
  .login-card .login-eye:hover { color: var(--text); }
  .login-card .login-eye:focus-visible { outline: 2px solid var(--pv); outline-offset: -2px; }
  .login-card button[type="submit"] {
    margin-top: 10px;
    background: var(--pv); color: #06210f; border: 0; border-radius: 12px; padding: 16px 18px;
    font-family: var(--display); font-size: 16px; font-weight: 700; letter-spacing: 0.005em; cursor: pointer;
    box-shadow: 0 8px 22px -10px rgba(61,220,132,0.7);
    transition: transform .12s, filter .12s;
  }
  .login-card button[type="submit"]:hover { filter: brightness(1.06); }
  .login-card button[type="submit"]:active { transform: translateY(1px); }
  .login-card button[type="submit"]:disabled { opacity: 0.6; cursor: default; box-shadow: none; }
  /* server error or note, 10 under the button. Empty, it is zero-height but stays mounted
     as a live region, so the button keeps the usual 30 to whatever follows. */
  .login-err { color: var(--load); font-size: 14px; line-height: 1.35; margin-top: -10px; }
  .login-note { color: var(--muted); }
  .login-links {
    /* the links are 48px targets; 6 + their 14px of slack reads as 20 above the text, and
       -14 below cancels the slack so the card's bottom padding shows at its full value */
    /* One line wherever the pair fits, phone included. They only stack on a screen too
       narrow to hold both, and wrap does that on its own, so there is no breakpoint to
       keep in step with the card's width. Row gap 0: the 48px targets are the spacing. */
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 0 12px;
    padding-top: 6px; margin-bottom: -14px; border-top: 1px solid var(--line);
    font-size: 14.5px; color: var(--muted);
  }
  /* a footer link breaks the line, never its own phrase */
  .login-links .login-link { white-space: nowrap; }
  .login-card .login-link {
    background: none; border: 0; padding: 0; margin: 0; width: auto; box-shadow: none;
    min-height: 48px; display: inline-flex; align-items: center;
    color: var(--pv); font-family: var(--display); font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  .login-card .login-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .login-card .login-link.quiet { color: var(--muted); font-weight: 500; }
  .login-fine { font-size: 13.5px; color: var(--dim); line-height: 1.5; }
  .login-fine a { color: var(--muted); }
  /* "or" rule between the password form and the Google button */
  .login-or { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--dim); }
  .login-or::before, .login-or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .login-card .login-google {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line-2); border-radius: 12px; padding: 15px 18px;
    font-family: var(--display); font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .login-card .login-google:hover { border-color: var(--muted); }
  .login-card .login-google:disabled { opacity: 0.6; cursor: default; }
  @media (max-width: 480px) {
    .login-wrap { padding: 12px; }
    .login-card { padding: 24px; border-radius: 18px; }
    .auth-brand .sun { width: 34px; height: 34px; }
    .auth-brand-name { font-size: 22px; }
    .auth-brand-tag { font-size: 13px; }
    .login-title { font-size: 26px; }
  }
  /* sign-up consent */
  /* the whole label ticks the box; 13px of invisible padding makes it a 48px target without moving anything */
  .auth-consent { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--muted); line-height: 1.45; padding-block: 13px; margin-block: -13px; }
  /* flex: none, or a phone-width sentence squeezes the box narrower than it is tall; margin
     overrides each browser's own, so the box lines up with the fields' left edge */
  .auth-consent input { flex: none; margin: 2px 0 0; width: 18px; height: 18px; accent-color: var(--pv); color-scheme: dark; }
  .auth-consent a { color: var(--pv); }
  /* legal pages */
  .legal-wrap { min-height: 100dvh; padding: 40px 24px 80px; display: flex; justify-content: center; }
  .legal { max-width: 680px; width: 100%; color: var(--text); }
  .legal h1 { font-size: 28px; letter-spacing: -0.02em; margin: 24px 0 6px; }
  .legal-meta { color: var(--dim); font-size: 12.5px; margin-bottom: 26px; }
  .legal-flag { color: var(--load); }
  .legal section { margin-bottom: 20px; }
  .legal h2 { font-size: 15px; margin: 0 0 6px; }
  .legal p { margin: 0; color: var(--muted); line-height: 1.55; font-size: 14.5px; }
  .legal-links { margin-top: 36px; font-size: 13px; color: var(--dim); }
  .legal-links a { color: var(--pv); }
  /* danger zone in settings */
  .danger-btn { background: none; border: 1px solid var(--load); color: var(--load); padding: 8px 14px; border-radius: 9px; font-size: 13px; cursor: pointer; }
  /* pull down at the top to reload: the bounce is off, which also took the browser's own (SOLAR-22) */
  .ptr { position: fixed; top: 0; left: 50%; z-index: 40; width: 38px; height: 38px; margin: -46px 0 0 -19px; border-radius: 50%;
    display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--muted); pointer-events: none; opacity: 0; }
  .ptr.ready { color: var(--text); border-color: var(--muted); }
  .ptr.go svg { animation: refresh-spin .8s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous"></script>

<!-- config first: auth.jsx and data.jsx both read window.SUNSYNK_CONFIG -->
<script src="config.js"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="link.jsx"></script>

<!-- pull down at the top to reload, on any touch screen (SOLAR-22) -->
<script>
(() => {
  const PULL = 70;   // px of finger travel that reloads on release
  const ptr = document.createElement('div');
  ptr.className = 'ptr'; ptr.setAttribute('aria-hidden', 'true');
  ptr.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
  document.body.appendChild(ptr);
  let startY = null, dy = 0;
  // at the top only if the page and every scrollable box under the finger are at their top
  const atTop = (el) => {
    if (window.scrollY > 0) return false;
    for (; el && el !== document.body; el = el.parentElement) if (el.scrollTop > 0) return false;
    return true;
  };
  const show = (d) => {
    const y = Math.min(d, PULL * 1.4);
    ptr.style.transform = `translateY(${y + 16}px) rotate(${y * 4}deg)`;
    ptr.style.opacity = Math.min(1, d / PULL);
    ptr.classList.toggle('ready', d >= PULL);
  };
  addEventListener('touchstart', (e) => {
    startY = e.touches.length === 1 && atTop(e.target) ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  addEventListener('touchmove', (e) => {
    if (startY === null) return;
    dy = (e.touches[0].clientY - startY) * 0.5;
    if (dy <= 0) { show(0); return; }
    show(dy);
  }, { passive: true });
  addEventListener('touchend', () => {
    if (startY === null) return;
    startY = null;
    if (dy >= PULL) { ptr.classList.add('go'); location.reload(); return; }
    ptr.style.transition = 'transform .2s, opacity .2s'; show(0);
    setTimeout(() => { ptr.style.transition = ''; }, 200);
  });
  addEventListener('touchcancel', () => { startY = null; show(0); });
})();
</script>
