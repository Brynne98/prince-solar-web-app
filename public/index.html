<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prince Solar Hub</title>
<!-- The app stays out of search; the showcase at princesolarhub.co.za is the one listed (SOLAR-120) -->
<meta name="robots" content="noindex" />
<!-- Installable / chromeless on a tablet: Add to Home Screen → runs fullscreen (ideal wall display) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Prince Solar Hub" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0d12" />
<!-- Safari/iOS turns email addresses in text into blue mailto links; keep them plain -->
<meta name="format-detection" content="email=no" />
<!-- Tab icon: the dashboard's own sun (see .sun below). SVG first for crispness at
     any size; the PNG is the fallback for anything that won't take an SVG favicon.
     apple-touch-icon is rendered on the dark background because iOS composites
     home-screen icons onto a solid backdrop and a transparent one looks accidental. -->
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0d12;
    --panel: #11161d;
    --panel-2: #141a22;
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.12);
    --text: #e7ecf2;
    /* Raised a step for readability (SOLAR-14): --muted is 7.0:1 and --dim 5.2:1 at worst,
       on --panel-2. Before that they were 5.8:1 and 4.5:1, and small grey labels still
       read as faint on a phone. Keep --dim above 5:1 on all three surfaces. */
    --muted: #9aa5b3;
    --dim: #7f8da0;
    --pv: #3ddc84; --batt: #a78bfa; --grid: #facc15; --load: #f87171; --soc: #22d3ee;
    --ok: #3ddc84;
    /* status colours, distinct from the five series colours: stale/estimate amber, fault red */
    --warn: #f59e0b; --bad: #ef4444;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  /* the hidden attribute must beat any display: flex set by a class */
  [hidden] { display: none !important; }
  /* clip, not hidden: overflow-x hidden on body turns it into a scroll container and kills position: sticky further down */
  html, body { margin: 0; overflow-x: clip; max-width: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(91,157,255,0.06), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(52,211,153,0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--display);
    /* No -webkit-font-smoothing: antialiased. On a dark theme it renders light text
       THINNER than the default and reads as soft; the browser default is crisper here. */
    min-height: 100vh;
  }
  /* ---------- scrollbar ----------
     The browser default is a light bar, which reads as a bright seam down a dark app.
     Firefox takes the two standard properties; Chrome/Safari/Edge need the -webkit
     pseudo-elements. The thumb is inset via a transparent border + background-clip so
     it floats clear of the edge instead of butting against it.
     Note: on macOS with "Show scroll bars: When scrolling", this only appears mid-scroll. */
  /* The standard properties and the -webkit ones CONFLICT: if scrollbar-width is set,
     Chrome uses standard sizing and ignores ::-webkit-scrollbar entirely, which rendered
     a 2px sliver instead of the intended thumb. So the standard pair is scoped to
     browsers that have no -webkit scrollbar support (Firefox), and Chrome/Safari get
     the pseudo-elements. */
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; }
  }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.14); border-radius: 7px;
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:active { background: rgba(255,255,255,0.34); background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- skeletons ---------- */
  .skel { position: relative; overflow: hidden; background: rgba(255,255,255,0.055); }
  .skel::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
    animation: skel-sweep 1.5s ease-in-out infinite;
  }
  @keyframes skel-sweep { 100% { transform: translateX(100%); } }
  /* a sweeping highlight is exactly the kind of motion this setting exists to stop */
  @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }

  /* ---------- frame (SOLAR-13) ----------
     A sidebar of pages and the account (≥1024 px), an 84 px icon rail on a tablet
     (600–1023), and on a phone a header with the avatar plus a bottom bar. The page
     scrolls as a document; the sidebar and header stay put. The selected page is a
     raised neutral surface: green is kept for the data. */
  .frame { --rail-w: 232px; --head-h: 60px; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100dvh; }
  .frame-body { display: flex; flex-direction: column; min-width: 0; }
  /* with a sidebar and a mouse or trackpad, only the page beside it scrolls, so a wheel
     over the sidebar moves nothing, and nothing bounces (SOLAR-22). A touch screen keeps
     scrolling the document, so it keeps the bounce and the browser's pull-down to
     reload (SOLAR-108) */
  @media (min-width: 600px) and (hover: hover) and (pointer: fine) {
    html, body { overscroll-behavior: none; }
    .frame { height: 100dvh; }
    /* stable: a short page keeps the scrollbar's room, so moving between pages never
       shifts the content sideways (SOLAR-95) */
    .frame-body { overflow-y: auto; overscroll-behavior: none; scrollbar-gutter: stable; }
  }
  /* flex: 1 0 auto: shrinking to the scroll box would push the bottom padding under the last card (SOLAR-25) */
  /* the gap under the last card matches the one above the first (SOLAR-25) */
  .content { flex: 1 0 auto; display: flex; flex-direction: column; width: 100%; max-width: 1360px; margin: 0 auto; padding: 14px 28px; }
  /* > * so a tab whose root is a grid/stack still behaves as it did before */
  .content > * { flex: none; }
  .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sun {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 38% 34%, #ffd56b, #f4a93a 58%, #e07a1f);
    box-shadow: 0 0 0 4px rgba(244,169,58,0.12);
  }

  .rail { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 4px; padding: 14px 12px;
    background: #0d1117; border-right: 1px solid var(--line); z-index: 6; }
  .rail-logo { height: calc(var(--head-h) - 14px); display: flex; align-items: center; gap: 11px; padding-left: 8px; margin-bottom: 8px;
    font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
  .nav > button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: none; background: none; color: var(--muted);
    border-radius: 9px; font-size: 14.5px; font-weight: 500; text-align: left; }
  .nav > button:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav > button[aria-current="page"] { color: var(--text); background: rgba(255,255,255,0.075); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); font-weight: 600; }
  .nav > button:disabled { cursor: progress; }

  /* the account: a row at the foot of the sidebar, an avatar in a phone's header */
  .acct { position: relative; }
  .acct-rail { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
  .acct-btn { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: none; background: none; border-radius: 9px; text-align: left; color: var(--text); }
  .acct-btn:hover, .acct-btn[aria-expanded="true"], .acct-btn[aria-current="page"] { background: rgba(255,255,255,0.05); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #26303d; color: var(--text);
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
  .who { display: grid; min-width: 0; line-height: 1.25; }
  .who b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span.warn { color: var(--warn); }
  /* a SunSynk login needs reconnecting */
  .acct-btn.needs::after { content: ''; position: absolute; left: 32px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px #0d1117; }
  .acct-head { display: none; }

  /* menus: the plant list and the account */
  .menu { position: absolute; z-index: 20; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 11px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 7px; color: var(--text); font-size: 14px; text-align: left; }
  .menu button:hover, .menu button:focus-visible { background: rgba(255,255,255,0.06); outline: none; }
  .menu button .ico { width: 16px; height: 16px; color: var(--muted); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-left: auto; }
  .acct-menu { left: 0; right: 0; bottom: calc(100% + 6px); }
  /* who is signed in, above Account and Sign out (back in SOLAR-97) */
  .menu-email { padding: 8px 10px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plant-menu { top: calc(100% + 6px); left: 0; width: 320px; max-width: calc(100vw - 260px); }
  .plant-menu button { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; row-gap: 8px; padding: 10px 12px; white-space: nowrap; }
  /* each plant's state on the right; a turning ring while it sets up (SOLAR-182) */
  .pm-state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .pm-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pm-pct { font-weight: 500; }
  .pm-state.status-live { color: var(--pv); } .pm-state.status-stale { color: var(--warn); }
  .pm-state.status-offline { color: var(--bad); } .pm-state.status-loading { color: var(--soc); }
  .plant-menu button[aria-checked="true"] { background: rgba(255,255,255,0.075); font-weight: 600; }
  .plant-menu .nm { overflow: hidden; text-overflow: ellipsis; }
  /* each SunSynk login's email above its plants (SOLAR-251) */
  .plant-menu .pm-login { padding: 8px 12px 4px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plant-menu [role="group"] + [role="group"] { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
  .plant-menu .pm-stopped .nm { color: var(--dim); }

  /* header: the plant left; status and refresh right */
  /* flex: none: the page under it no longer shrinks, so a shrinkable header was squashed to 39px (SOLAR-25) */
  /* past 1360 px .content centres, so the padding grows on both sides to keep the plant
     and refresh over the cards' edges */
  .head { flex: none; position: sticky; top: 0; z-index: 5; height: var(--head-h); display: flex; align-items: center; gap: 16px; padding: 0 max(28px, calc((100% - 1360px) / 2 + 28px));
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .plant { position: relative; min-width: 0; margin-left: -10px; }
  .plant-btn { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: 9px;
    background: none; color: var(--text); font-size: 17px; font-weight: 600; }
  .plant-btn:not(.static):hover, .plant-btn[aria-expanded="true"] { background: var(--panel-2); border-color: var(--line-2); }
  .plant-btn .ico { width: 16px; height: 16px; color: var(--muted); }
  .plant-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* the plant name gives way first; the status and its age never clip */
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
  .status-age { font-size: 12.5px; }
  .status-word { font-size: 14px; font-weight: 600; }
  /* every state breathes, in its own colour; --ring is the halo */
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none;
    --ring: rgba(255,255,255,0.14); box-shadow: 0 0 0 3px var(--ring); animation: status-breathe 2.4s ease-in-out infinite; }
  .status-live .status-dot { background: var(--pv); --ring: rgba(61,220,132,0.18); }
  .status-live .status-word { color: var(--pv); }
  .status-stale .status-dot { background: var(--warn); --ring: rgba(245,158,11,0.18); }
  .status-stale .status-word, .status-stale .status-age { color: var(--warn); }
  .status-offline .status-dot { background: var(--bad); --ring: rgba(239,68,68,0.18); }
  .status-offline .status-word, .status-offline .status-age { color: var(--bad); }
  .status-idle .status-word { color: var(--muted); }
  .status-loading .status-dot { background: var(--soc); --ring: rgba(34,211,238,0.18); }
  .status-loading .status-word { color: var(--soc); }
  @keyframes status-breathe { 0%, 100% { box-shadow: 0 0 0 3px var(--ring); } 50% { box-shadow: 0 0 0 5px transparent; } }
  @media (prefers-reduced-motion: reduce) { .status-dot { animation: none; } }
  /* "Fetching history" beside the status while a fresh plant's 60 days arrive (0048) */
  .status-sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--soc); padding-left: 9px; border-left: 1px solid var(--line-2); }
  .sync-arc { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(34,211,238,0.25); border-top-color: var(--soc); animation: sync-spin 0.9s linear infinite; flex: none; }
  @keyframes sync-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sync-arc { animation: none; border-top-color: rgba(34,211,238,0.6); } }
  .refresh { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; min-width: 38px; padding: 0 10px; flex: none;
    border-radius: 10px; background: var(--panel); border: 1px solid var(--line-2); color: var(--text); font-size: 14px; font-weight: 500; transition: border-color .15s; }
  .refresh:hover:not(:disabled) { border-color: var(--muted); }
  .refresh:disabled { opacity: .55; cursor: progress; }
  .refresh-stale { color: var(--warn); border-color: rgba(245,158,11,0.45); }
  .refresh-offline { color: var(--bad); border-color: rgba(239,68,68,0.5); padding: 0 14px; }
  /* spins for as long as a snapshot fetch is in flight (app.jsx holds it ≥ 800 ms) */
  .refresh.busy .ico { animation: refresh-spin .8s linear infinite; }
  @keyframes refresh-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh.busy .ico { animation: none; opacity: .5; } }

  /* Notifications (SOLAR-244): a bell right of Refresh with the unread count; a panel
     under it, a full page on a phone (below) */
  .bell { position: relative; flex: none; }
  /* the same box as Refresh beside it (SOLAR-248) */
  .bell-btn { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line-2); color: var(--text); transition: border-color .15s; }
  .bell-btn:hover:not(:disabled), .bell-btn[aria-expanded="true"] { border-color: var(--muted); }
  .bell-btn:disabled { opacity: .55; }
  .bell-btn .ico { width: 18px; height: 18px; }
  .bell-count { position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
  .notif-panel { position: absolute; z-index: 20; top: calc(100% + 8px); right: 0; width: 400px; max-height: min(640px, calc(100vh - 90px)); overflow-y: auto;
    background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); padding-bottom: 4px; }
  .nl-head { display: flex; align-items: center; gap: 6px; padding: 12px 10px 6px 16px; }
  .nl-head h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .nl-all { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 500; padding: 8px 6px; }
  .nl-gear, .nl-back { width: 36px; height: 36px; display: grid; place-items: center; background: none; border: none; color: var(--muted); border-radius: 9px; flex: none; }
  .nl-head h2 + .nl-gear { margin-left: auto; }
  .nl-all:hover, .nl-gear:hover, .nl-back:hover { color: var(--text); }
  .nl-gear .ico, .nl-back .ico { width: 18px; height: 18px; }
  .nl-back { display: none; }
  .nl-day { padding: 12px 16px 4px; font-size: 12.5px; color: var(--dim); font-weight: 500; }
  .nl-row { display: grid; grid-template-columns: 8px 32px minmax(0, 1fr) 14px; gap: 10px; align-items: start; width: 100%; padding: 9px 14px 9px 10px;
    background: none; border: none; color: var(--text); text-align: left; }
  .nl-row:hover, .nl-row:focus-visible { background: rgba(255,255,255,0.04); outline: none; }
  .nl-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 12px; }
  .nl-row.unread .nl-dot { background: var(--ok); }
  .nl-glyph { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; }
  .nl-glyph .ico { width: 17px; height: 17px; }
  .g-grid { background: rgba(250,204,21,0.12); color: var(--grid); }
  .g-battery { background: rgba(167,139,250,0.14); color: var(--batt); }
  .g-panels { background: rgba(61,220,132,0.12); color: var(--pv); }
  .g-readings, .g-sunsynk { background: rgba(255,255,255,0.07); color: var(--muted); }
  .nl-text { display: flex; flex-direction: column; min-width: 0; }
  .nl-title { font-size: 14.5px; font-weight: 500; line-height: 1.3; }
  .nl-row.unread .nl-title { font-weight: 600; }
  .nl-body { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .nl-where { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .nl-chev { color: #56606e; margin-top: 8px; } .nl-chev .ico { width: 14px; height: 14px; }
  .nl-foot { padding: 12px 16px; font-size: 12.5px; color: var(--dim); text-align: center; }
  .nl-empty { padding: 40px 28px 28px; text-align: center; }
  .nl-empty .nl-glyph { margin: 0 auto 14px; width: 44px; height: 44px; border-radius: 12px; }
  .nl-empty b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .nl-empty p { margin: 0 0 16px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  @media (max-width: 599px) {
    .bell-btn { width: 36px; height: 36px; }
    .notif-panel { position: fixed; inset: 0; z-index: 40; width: auto; max-height: none; border: none; border-radius: 0; box-shadow: none;
      background: var(--bg); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
    .nl-head { padding-left: 8px; }
    .nl-back { display: grid; margin-right: 2px; }
    /* the header is its own layer (sticky, z-index 5): lift it over the bar and the setup card while the list is open */
    .head:has(.notif-panel) { z-index: 30; }
  }

  /* the page says when its numbers are old, and why; grid off is calm purple, not a fault */
  .notice { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; border: 1px solid; font-size: 14px; }
  .notice p { margin: 0; flex: 1 1 240px; line-height: 1.45; }
  .notice p b { font-weight: 600; }
  .notice.stale { border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.07); }
  .notice.offline { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.07); }
  .notice.gridoff { border-color: rgba(167,139,250,0.35); background: rgba(167,139,250,0.08); }
  .page { display: flex; flex-direction: column; }
  .page.old .mini-value, .page.old .stat-value, .page.old .metric-value, .page.old .flow-wrap,
  .page.old .chart-area, .page.old .wiw, .page.old .meter { opacity: 0.45; }

  /* phone-only pieces, hidden wider */
  .phonebar, .sheet { display: none; }

  /* tablet: an 84 px rail, the icon over its name, initials for the account */
  @media (min-width: 600px) and (max-width: 1023px) {
    .frame { --rail-w: 84px; }
    .rail { padding: 14px 8px; }
    .rail-logo { justify-content: center; padding-left: 0; }
    .rail-logo .app-name { display: none; }
    .nav > button { flex-direction: column; gap: 5px; padding: 9px 2px 8px; font-size: 11.5px; text-align: center; }
    .nav > button .t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct-btn { justify-content: center; padding: 8px 0; }
    .acct-rail .who { display: none; }
    .acct-btn.needs::after { left: calc(50% + 8px); }
    .acct-menu { right: auto; width: 250px; }
    .head, .content { padding-left: 24px; padding-right: 24px; }
  }

  /* phone: the header plus a five-slot bottom bar; the account moves to the header */
  @media (max-width: 599px) {
    .frame { --head-h: 56px; grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .head { padding: 0 10px 0 14px; gap: 8px; }
    .plant { margin-left: -8px; }
    .plant-btn { font-size: 15.5px; padding: 6px 8px; }
    .plant-menu { min-width: 0; width: calc(100vw - 20px); max-width: 360px; }
    .status-sync { display: none; }
    .refresh { height: 36px; min-width: 36px; }
    /* first load: only "Fetching history" and its %, no status word or refresh (SOLAR-182) */
    .status.fetching .status-dot, .status.fetching .status-word, .status.fetching .status-age, .refresh.fetching { display: none; }
    .status.fetching .status-sync { display: inline-flex; padding-left: 0; border-left: none; }
    @media (max-width: 399px) { .refresh-offline { padding: 0 10px; } .refresh .lbl { display: none; } }
    /* the plant name needs the room more; the page's banner already says how old the reading is */
    @media (max-width: 359px) { .status-age { display: none; } }
    .status-age .age-date { display: none; }
    .acct-head { display: block; flex: none; }
    /* nothing between them (no inverter yet, Connect open): the avatar still sits at the right edge */
    .plant + .acct-head { margin-left: auto; }
    .acct-head .acct-btn { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; }
    .acct-head .avatar { width: 32px; height: 32px; }
    .acct-head .acct-btn.needs::after { left: auto; right: 1px; top: 1px; box-shadow: 0 0 0 2px var(--bg); }
    .acct-head .acct-menu { left: auto; right: 0; bottom: auto; top: calc(100% + 6px); width: 260px; max-width: calc(100vw - 20px); }
    /* bottom: the 56px bar plus the same 10px gap as at the top (SOLAR-25) */
    .content { padding: 10px 12px calc(66px + env(safe-area-inset-bottom, 0px)); }

    .phonebar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: #0d1117; border-top: 1px solid var(--line);
      padding: 0 6px env(safe-area-inset-bottom, 0px); }
    .phonebar button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 10px;
      border: none; background: none; color: var(--muted); font-size: 11.5px; font-weight: 500; }
    .phonebar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .phonebar button[aria-current="page"], .phonebar button.on { color: var(--text); font-weight: 600; }
    .phonebar button[aria-current="page"] .ico, .phonebar button.on .ico { stroke-width: 2.2; }

    .sheet { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(5,7,10,0.55); }
    .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel-2); border-top: 1px solid var(--line-2); border-radius: 16px 16px 0 0;
      padding: 8px 10px calc(14px + env(safe-area-inset-bottom, 0px)); }
    .sheet-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 4px auto 10px; }
    .sheet-panel > button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 12px; border: none; background: none; border-radius: 10px;
      font-size: 15px; text-align: left; color: var(--text); }
    .sheet-panel > button[aria-current="page"] { background: rgba(255,255,255,0.075); font-weight: 600; }
  }

  /* ---------- cards ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; }
  /* charts want the width more than they want the gutter */
  .trend-chart-card { padding-left: 12px; padding-right: 12px; }
  /* the day chart and power flow keep one gutter on all four sides */
  .chart-card, .flow-card { padding: 12px; }
  /* the 28px Fullscreen button made the row taller and centring pushed the title down;
     pin both to the top so the title sits as far from the top edge as from the left */
  .flow-card .section-title { align-items: flex-start; }
  /* loading stand-in for .flow-wrap: the summary line (app.jsx), then the diagram, which
     the wide layout draws 374px tall at every width; the stacked one (flow.jsx, ≤900px) is about 625px */
  .flow-skel { height: 374px !important; }
  /* a tile's second line held open at two lines where the real one wraps (SolarSkeleton) */
  @media (max-width: 600px) { .sub-hold-2 { display: block; height: 34px; } }
  @media (max-width: 900px) { .flow-skel { height: 625px !important; } }
  /* the summary line before it is written: one line wide, two on a phone, where most wrap */
  .narr-hold { height: 23px; display: flex; flex-direction: column; justify-content: center; gap: 9px; }
  .narr-hold .narr-2 { display: none; }
  @media (max-width: 620px) { .narr-hold { height: 41.5px; } .narr-hold .narr-2 { display: block; } }
  /* legend to plot gets the same gap as date bar to legend */
  .hv-root .legend-row { margin-bottom: 12px; }
  .grow { flex: 1; } .stack { display: flex; flex-direction: column; gap: 20px; }
  .section-title { display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; margin-bottom: 18px; }
  .section-right { font-size: 11px; letter-spacing: 0.04em; }

  /* ---------- stat tiles (the 4 the user liked) ---------- */
  .stat-tile { display: flex; flex-direction: column; gap: 0; }
  .stat-label { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .stat-value { font-family: var(--mono); font-weight: 700; margin-top: 10px; line-height: 1; display: flex; align-items: baseline; }
  .stat-value .num { font-size: 44px; }
  .stat-value .unit { font-size: 24px; margin-left: 4px; opacity: 0.85; }
  .stat-sub { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .stat-sub b { color: var(--text); font-weight: 600; }
  .batt-eta { display: block; margin-top: 7px; font-size: 12px; color: var(--soc); font-family: var(--mono); letter-spacing: -0.01em; }
  .batt-eta b { color: var(--soc); font-weight: 700; }
  .batt-eta .bel { display: block; }
  .batt-eta .bel.sub { color: var(--muted); margin-top: 1px; }
  .meter { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; margin-top: 14px; position: relative; }
  .meter.sm { height: 5px; margin-top: 8px; }
  .meter-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }

  /* ---------- live layout ---------- */
  .live-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  /* battery banner: status (left) + a few labelled stats (right) */
  .batt-balance { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 10px 15px; border-radius: 12px;
    background: rgba(255,255,255,0.02); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .batt-balance.watch { border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.06); }
  .batt-balance.drifting { border-color: rgba(248,113,113,0.55); background: rgba(248,113,113,0.09); }
  .bb-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .bb-title { color: var(--text); font-weight: 600; }
  .bb-status { font-weight: 600; cursor: help; }
  .bb-div { width: 1px; align-self: stretch; background: var(--line); }
  .bb-stats { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
  .bb-stat { display: inline-flex; align-items: baseline; gap: 5px; cursor: help; }
  .bb-k { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .bb-stat b { color: var(--text); font-weight: 600; }
  .bb-stat.bb-hot b { color: var(--warn); }
  .chart-card { display: flex; flex-direction: column; min-width: 0; }
  .hv-root { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; }
  .stat-col { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  /* five in a row from 1200 px (six for an exporting plant), four from 980 px, three below that, two per row on a phone */
  .today-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (min-width: 981px) { .today-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1200px) { .today-strip { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); } }
  .overview-section { order: -1; }
  .overview-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .overview-head .section-title { margin-bottom: 0; }
  .cmp-note { font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
  .mini-stat { padding: 20px 22px; }
  /* label left, trend arrow right on the same line; a long label wraps, the arrow keeps its corner */
  .mini-label { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 2px 8px; }
  .ml-text { display: flex; align-items: center; min-width: 0; line-height: 1.35; }
  .mini-label .trend-badge { margin-left: 0; top: 0; line-height: 1.35; text-transform: none; }
  .mv-unit { font-size: 14px; font-weight: 500; margin-left: 4px; opacity: 0.85; }
  .mv-unit.pct { margin-left: 1px; }
  .mini-stat { transition: border-color .15s; }
  .mini-stat:hover { border-color: var(--line-2); }
  /* baseline, not flex-end. Aligning the boxes lines up the two fonts' DESCENDER
     space, and the mono face reserves more of it — so its glyphs ride higher and the
     badge reads as sitting low. Baselines are where the glyphs actually rest. */
  .mini-value { font-size: 24px; font-weight: 600; margin-top: 10px; letter-spacing: -0.01em;
    display: flex; align-items: baseline; flex-wrap: wrap; row-gap: 2px; }
  /* Baseline alone sits the badge a touch high, box-bottom a touch low. 1px down off
     the baseline is the middle, and it is a nudge rather than a different rule. */
  .trend-badge { position: relative; top: 1px; }
  .mv-num { white-space: nowrap; }
  /* a tile's second line that is an action ("Set your rate" on Est. saved with no rate yet) */
  .mini-link { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
  .mini-link:hover { color: var(--text); text-decoration-color: currentColor; }
  /* a Settings card flashes once when a link elsewhere sends you to it */
  .sset-flash { animation: sset-flash 1.1s ease-out 0.15s 1; }
  @keyframes sset-flash {
    0%, 100% { border-color: var(--line); box-shadow: 0 0 0 0 rgba(61,220,132,0); }
    35% { border-color: var(--pv); box-shadow: 0 0 0 4px rgba(61,220,132,0.18); }
  }
  @media (prefers-reduced-motion: reduce) { .sset-flash { animation: none; } }
  .mini-link:focus-visible { outline: 2px solid var(--line-2); outline-offset: 2px; border-radius: 3px; }
  /* grid presence chip on the Imported card — green when the mains is live, red when down */
  /* padding-left leaves room for the dot's 3px glow ring: .mini-sub clips overflow for
     its ellipsis, so a ring flush against x=0 loses its left edge. */
  .grid-state { display: inline-flex; align-items: center; gap: 6px; cursor: help; padding-left: 3px; }
  .grid-state .gs-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .grid-state.on  { color: var(--muted); }
  .grid-state.on  .gs-dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,220,132,0.14); }
  .grid-state.off { color: var(--load); font-weight: 600; }
  .grid-state.unknown { color: var(--dim); cursor: default; }
  .grid-state.unknown .gs-dot { background: var(--dim); opacity: .5; }
  .grid-state.off .gs-dot { background: var(--load); box-shadow: 0 0 0 3px rgba(248,113,113,0.16); }
  /* Two lines, then clip. The old single-line ellipsis cut "Set your rate in Settings"
     to "Set your rate in Se…" on every width; a second line costs 15px and keeps
     the sentence. Grid rows stretch, so a two-line tile does not misalign its row. */
  .mini-sub { font-size: 12.5px; color: var(--dim); margin-top: 5px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }


  /* ---------- flow svg ---------- */
  .flow-fs-wrap { width: 100%; }
  .flow-wrap { width: 100%; }
  .flow-fs-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 9px; color: var(--muted); font-size: 12px; padding: 5px 11px; cursor: pointer; transition: .15s; }
  .flow-fs-btn:hover { border-color: var(--line-2); color: var(--text); }
  /* wall-dashboard mode (tabs.jsx): a class rather than :fullscreen, because an iPad
     home-screen app has no Fullscreen API and there the wrapper just covers the page.
     No card: status and Exit in a bar at the top, the sentence and diagram centred in
     the rest, every size taken from the screen. */
  .flow-fs-wrap.wall { --wall-pad: clamp(16px, 3vmin, 48px);
    position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: var(--bg);
    display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); gap: clamp(8px, 1.5vmin, 24px);
    padding: max(var(--wall-pad), env(safe-area-inset-top)) max(var(--wall-pad), env(safe-area-inset-right))
             max(var(--wall-pad), env(safe-area-inset-bottom)) max(var(--wall-pad), env(safe-area-inset-left));
    font-size: clamp(14px, 1.6vmin + 4px, 24px); }
  html:has(.flow-fs-wrap.wall) { overflow: hidden; }
  .wall-bar { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
  .wall-status { display: inline-flex; align-items: center; gap: .6em; min-width: 0; white-space: nowrap; }
  .wall-status .status-dot { width: .55em; height: .55em; }
  .wall-status .status-word { font-size: 1em; }
  .wall-status .status-detail { font-size: .9em; padding-left: .6em; }
  .wall .wall-exit { font-size: .85em; padding: .5em .9em; gap: .5em; border-radius: .7em; flex: none;
    transition: opacity .3s, visibility .3s, border-color .15s, color .15s; }
  .wall .wall-exit svg { width: 1em; height: 1em; }
  @media (pointer: coarse) { .wall .wall-exit { min-height: 44px; } }
  .wall.idle .wall-exit:not(:focus-visible) { opacity: 0; visibility: hidden; }
  .wall.idle, .wall.idle * { cursor: none !important; }
  @media (prefers-reduced-motion: reduce) { .wall .wall-exit { transition: none; } }
  .wall .flow-card { background: none; border: 0; border-radius: 0; padding: 0; min-height: 0; }
  .wall .flow-wrap { height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .wall .flow-narrative { flex: none; text-align: center; text-wrap: balance;
    font-size: clamp(18px, 2vmin + 8px, 40px); margin-bottom: clamp(10px, 2.5vmin, 36px); }
  /* both layouts are HTML at screen sizes; tabs.jsx sets the zoom that fills the room */
  .wall .pflow { flex: none; width: 1100px; max-width: none; margin: 0 auto; zoom: var(--wall-zoom, 1); }
  .wall .mflow { flex: none; width: 440px; max-width: none; margin: 0 auto; zoom: var(--wall-zoom, 1); }
  /* slide a whole number of dash-periods so the loop is seamless: 195 = 15 (desktop "2 13") × 13 (mobile "2 11") */
  @keyframes flow { to { stroke-dashoffset: -195; } }
  /* the moving dashes are the one piece of continuous motion on the page */
  @media (prefers-reduced-motion: reduce) { .pflow-lane *, .mflow-links * { animation: none !important; } }
  /* ---------- power-flow box, shared by both layouts (SOLAR-39) ---------- */
  /* the type matches the overview cards above (SOLAR-16): label, number and unit */
  .fbox { border: 1.3px solid var(--line); border-radius: 16px; min-width: 0; overflow: hidden; transition: border-color .2s; }
  .fbox.off { border-style: dashed; }
  .fbox-now { display: flex; flex-direction: column; min-width: 0; }
  .fbox-head { display: flex; align-items: center; gap: 9px; }
  .fbox-head svg { flex: none; }
  .fbox-label { font: 500 12px var(--display); letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fbox-val { font: 600 30px var(--mono); letter-spacing: -0.01em; line-height: 1; margin-top: 12px; white-space: nowrap; }
  .fbox-val .u { font-size: 15px; font-weight: 500; margin-left: 5px; opacity: 0.85; }
  .fbox-state { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 8px; white-space: nowrap; }
  .fbox-state b { font: 600 12.5px var(--mono); color: var(--text); margin-left: 5px; }
  /* the foot sits on the box's bottom edge whatever is above it */
  .fbox-foot { margin-top: auto; padding-top: 10px; }
  .fbox-bar { display: flex; gap: 2px; height: 5px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,0.08); }
  .fbox-bar i { display: block; height: 100%; border-radius: 3px; min-width: 6px; }   /* a 1% share still reads as a segment */
  .fbox-split { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; margin-top: 7px; }
  .fbox-split span { display: flex; flex-direction: column; gap: 2px; }
  .fbox-split span:last-child:not(:first-child) { align-items: flex-end; }
  .fbox-split em, .fbox-today span, .fbox-today-h { font: 500 11px var(--display); font-style: normal; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .fbox-split b { font: 600 12.5px var(--mono); }
  .fbox-charge { display: flex; align-items: center; gap: 10px; }
  .fbox-charge .fbox-bar { flex: 1; }
  .fbox-charge b { font: 700 18px var(--mono); white-space: nowrap; }
  /* mains there or gone: a green dot, or a hollow grey one */
  .fbox-grid { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .fbox-grid i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ok); }
  .fbox-grid.off i { box-sizing: border-box; background: none; border: 1.5px solid var(--dim); }
  .fbox-today { display: flex; flex-direction: column; gap: 12px; }
  .fbox-today > div:not(.fbox-today-h) { display: flex; flex-direction: column; gap: 3px; }
  .fbox-today b { font: 600 17px var(--mono); color: var(--text); white-space: nowrap; }
  .fbox-today b .u { font: 500 11px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 4px; }

  /* ---------- wide power-flow: two rows of two, the inverter in a lane between ---------- */
  .pflow { display: grid; }
  .pflow-cell { display: grid; min-width: 0; }
  .pflow .fbox { display: grid; grid-template-columns: minmax(0, 1fr) 148px; }
  .pflow .fbox-now { padding: 18px 20px 16px; }
  .pflow .fbox-today { border-left: 1px solid var(--line); background: rgba(255,255,255,0.015); padding: 18px 18px 16px; }
  .pflow.narrow .fbox { grid-template-columns: minmax(0, 1fr) 116px; }
  .pflow.narrow .fbox-now { padding: 16px 14px 14px; }
  .pflow.narrow .fbox-today { padding: 16px 14px 14px; }
  .pflow.narrow .fbox-val { font-size: 24px; }
  .pflow.narrow .fbox-val .u { font-size: 14px; }
  .pflow-lane { position: relative; }
  .pflow-lane svg { display: block; overflow: visible; }
  .pflow-inv-label { position: absolute; left: 0; right: 0; text-align: center; font: 700 11px var(--display); letter-spacing: 0.14em; color: var(--text); }
  /* the summary sentence opens the card, above the diagram */
  .flow-narrative { font-size: 17px; line-height: 1.35; color: var(--text); text-wrap: pretty; margin-bottom: 14px; }
  .flow-narrative b { font-weight: 600; }

  /* ---------- mobile power-flow (vertical, card-style nodes) ---------- */
  .mflow { display: flex; flex-direction: column; }
  /* on a tablet the stacked layout keeps a phone-ish width instead of stretching the tiles across the card */
  @media (min-width: 601px) { .mflow { width: 100%; max-width: 620px; margin: 0 auto; } }
  .mflow-sources { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* a tile: the box with today's figures under a rule instead of beside it */
  .mflow .fbox { display: flex; flex-direction: column; border-radius: 14px; }
  .mflow .fbox-now { padding: 13px 13px 12px; flex: 1; }
  .mflow .fbox-head { gap: 7px; }
  /* under 360 px a tile is narrow: the name needs the room more than the icon does */
  @media (max-width: 359px) { .mflow .fbox-head svg { display: none; } }
  .mflow .fbox-val { font-size: 21px; margin-top: 10px; }
  .mflow .fbox-val .u { font-size: 14px; margin-left: 4px; }
  .mflow .fbox-state { font-size: 12px; margin-top: 7px; white-space: normal; }
  .mflow .fbox-state b { font-size: 12px; margin-left: 4px; white-space: nowrap; }
  .mflow .fbox-charge b { font-size: 15px; }
  .mflow .fbox-split span { flex-direction: row; align-items: baseline; gap: 5px; }
  .mflow .fbox-split span:last-child:not(:first-child) { align-items: baseline; }
  .mflow .fbox-split { justify-content: flex-start; }
  .mflow .fbox-split em { font-size: 10.5px; }
  .mflow .fbox-split b { font-size: 12px; }
  .mflow .fbox-today { border-top: 1px solid var(--line); padding: 9px 13px 10px; gap: 5px; }
  .mflow .fbox-today-h { display: none; }
  .mflow .fbox-today > div:not(.fbox-today-h) { flex-direction: row; justify-content: space-between; align-items: baseline; gap: 6px; }
  .mflow .fbox-today span { font-size: 10.5px; }
  .mflow .fbox-today b { font-size: 13px; }
  .mflow .fbox-today b .u { font-size: 10px; margin-left: 3px; }
  .mflow-links { display: block; width: 100%; height: 72px; overflow: visible; }
  .mflow-inv { display: flex; flex-direction: column; align-items: center; }
  .mflow-inv svg { display: block; }
  .mflow-inv-label { font: 700 12px var(--display); letter-spacing: 0.14em; color: var(--text); margin-top: 8px; }

  /* ---------- trend arrows on overview cards ---------- */
  .trend-badge { font-family: var(--display); font-size: 12px; font-weight: 600; margin-left: 9px; letter-spacing: 0; white-space: nowrap; }
  .trend-badge.good { color: #3ddc84; }
  .trend-badge.bad { color: #f87171; }
  .trend-badge.flat { color: var(--dim); font-weight: 500; }

  /* ---------- chart ---------- */
  .hv-waste { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  .hv-waste b { font-weight: 600; }
  .hv-waste-sub { color: var(--dim); }
  .hv-waste-none { opacity: 0.78; }
  .hv-datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  /* the arrows and the date box share one height (--datebar-h) so they read as one control */
  .hv-datebar { --datebar-h: 32px; }
  .hv-daynav { box-sizing: border-box; width: var(--datebar-h); height: var(--datebar-h); flex: none; display: inline-flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    line-height: 0; cursor: pointer; transition: .15s; padding: 0; }
  .hv-daynav svg { display: block; }
  .hv-daynav:hover:not(:disabled) { border-color: var(--line-2); }
  .hv-daynav:disabled { color: var(--dim); cursor: default; opacity: .45; }
  /* the date box: "Tue 6 Oct", opening our calendar (SOLAR-72); Today sits inside it only on a phone */
  .hv-datebox { position: relative; box-sizing: border-box; height: var(--datebar-h); display: inline-flex; align-items: center; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; }
  .hv-datebox:hover { border-color: var(--line-2); }
  .hv-datepick { display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; background: none; border: 0; color: var(--text); cursor: pointer; }
  .hv-datepick:disabled { cursor: default; }
  .hv-cal { display: block; flex: none; color: var(--muted); }
  /* fixed width, so ‹ › stay under the pointer while someone clicks through days */
  .hv-dateface { font: 600 13px var(--display); letter-spacing: 0.01em; white-space: nowrap;
    display: inline-block; min-width: 6.9em; text-align: center; font-variant-numeric: tabular-nums; }
  .hv-today-in { display: none; }
  .cal-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; width: 276px; padding: 12px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font: 600 14px var(--display); color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow { text-align: center; font: 500 11px var(--display); letter-spacing: 0.08em; color: var(--dim); padding: 4px 0 6px; }
  .cal-day { height: 34px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--text); font: 500 13px var(--mono); cursor: pointer; padding: 0; }
  .cal-day:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line-2); }
  .cal-day:disabled { color: var(--dim); opacity: 0.35; cursor: default; }
  .cal-day.today { color: var(--pv); }
  .cal-day.on { background: rgba(61,220,132,0.14); border-color: rgba(61,220,132,0.55); color: var(--text); }
  .cal-day:focus-visible, .hv-datepick:focus-visible { outline: 2px solid var(--pv); outline-offset: 1px; }
  .hv-approx { font-size: 11px; color: var(--warn); border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px; margin-left: 2px; cursor: help; white-space: nowrap; }
  .hv-gap { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin-left: 2px; cursor: help; white-space: nowrap; }
  .hv-gap-sq, .tip-dot.tip-sq { width: 8px; height: 8px; border-radius: 2px; background: var(--load); flex: none; }
  .hv-today { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font-size: 12px; padding: 6px 12px; cursor: pointer; transition: .15s; margin-left: auto; }
  .hv-today:hover { border-color: var(--line-2); }
  .hv-today:disabled { color: var(--dim); border-color: var(--line); cursor: default; opacity: .45; }
  .hv-lag { font-size: 12px; color: var(--dim); }
  .chart-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .chart-controls-right { display: flex; align-items: center; gap: 10px; }
  .chart-area { width: 100%; min-width: 0; overflow: hidden; }
  .chart-svg { display: block; touch-action: pan-y; }
  .ax { font: 400 11.5px var(--mono); fill: var(--muted); }
  .ax-hi { fill: var(--text); }
  .legend-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .legend-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; color: var(--text); transition: .15s; }
  .legend-chip.off { color: var(--dim); }
  .legend-val { margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--line-2); font-family: var(--mono); font-weight: 600; letter-spacing: -0.01em;
    display: inline-block; font-variant-numeric: tabular-nums; }
  .legend-chip.off .legend-val { color: var(--dim); border-color: var(--line); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; }
  .legend-note { font-size: 12.5px; color: var(--dim); margin-left: 4px; }
  .legend-mode { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
  /* Dragging across a chart otherwise text-selects the axis labels and tooltip, so the
     plot fills with blue highlight while you're trying to read a range. Charts are
     interactive surfaces, not prose — nothing here is worth selecting. */
  svg.chart-svg, .chart-area, .hv-root, .trend-chart, .chart-tip, .trend-tip, .chart-legend, .seg-usage {
    -webkit-user-select: none; user-select: none;
  }
  /* stops the long-press "copy/share" bubble on iOS while dragging the chart */
  svg.chart-svg { -webkit-touch-callout: none; }

  .chart-tip { position: absolute; pointer-events: none; background: rgba(13,17,23,0.96); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 10px 12px; min-width: 168px; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,0.5); z-index: 5; }
  .tip-time { font: 600 12px var(--mono); color: var(--text); margin-bottom: 8px; }
  .tip-row { display: flex; align-items: center; gap: 7px; font-size: 12px; margin: 3px 0; }
  .tip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tip-l { color: var(--muted); } .tip-v { margin-left: auto; color: var(--text); }
  .tip-total { margin-top: 5px; border-top: 1px solid var(--line); padding-top: 6px; }
  .tip-total .tip-l { color: var(--text); font-weight: 600; }
  /* drag-to-select range totals */
  .chart-range { position: absolute; left: 8px; top: 8px; background: rgba(13,17,23,0.97); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 9px 12px; min-width: 180px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); z-index: 6; }
  .cr-head { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .cr-head .tip-time { margin-bottom: 0; }
  .cr-x { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
  .cr-x:hover { color: var(--text); }
  /* lives in the SVG's empty top margin — bottom-right overlapped the last x-axis label */
  .chart-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 18px;
    border-top: 1px solid var(--line); padding-top: 18px; }
  .sum-cell { } .sum-label { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .sum-value { font-size: 22px; font-weight: 600; margin-top: 6px; } .sum-sub { font-size: 11px; color: var(--dim); margin-top: 3px; }

  /* ---------- segmented / buttons ---------- */
  .segmented { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg-btn { background: none; border: none; color: var(--muted); padding: 7px 15px; border-radius: 7px; font-size: 13px; font-weight: 500; transition: .12s; }
  .seg-sm .seg-btn { padding: 5px 11px; font-size: 12.5px; }
  .seg-btn:hover { color: var(--text); } .seg-btn.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .ghost-btn { background: none; border: 1px solid var(--line-2); color: var(--muted); padding: 7px 14px; border-radius: 9px; font-size: 12.5px; transition: .15s; }
  .ghost-btn:hover { color: var(--text); } .ghost-btn.active { border-color: var(--pv); color: var(--pv); }

  /* ---------- metric / badge ---------- */
  .metric-label { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .metric-value { font-size: 20px; font-weight: 600; margin-top: 5px; }
  .metric-unit { font-size: 13px; color: var(--muted); margin-left: 2px; font-family: var(--mono); }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 4px 11px; border-radius: 999px; border: 1px solid; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  /* a dead SunSynk login: on the Settings tab and its Logins entry */
  .alert-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-left: 6px; vertical-align: middle; }
  .badge-ok { color: var(--ok); border-color: rgba(61,220,132,0.4); background: rgba(61,220,132,0.08); }
  .badge-warn { color: var(--load); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }
  .badge-neutral { color: var(--muted); border-color: var(--line-2); }

  /* ---------- grids used by tabs ---------- */
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hint-line { font-size: 13.5px; color: var(--dim); margin-top: 16px; line-height: 1.5; }

  /* solar tab, and the Battery and Grid tabs, which are built the same way */
  .solar-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .solar-stats .stat-tile { padding: 26px 28px; }
  .stat-sub .trend-badge { margin: 0 3px 0 0; top: 0; }
  .solar-tab .section-title .info-dot { margin-left: 8px; }
  .solar-tab .section-right { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .solar-tab .section-right b { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .solar-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 20px; align-items: stretch; }
  .solar-row > * { min-width: 0; }
  .solar-row > :only-child { grid-column: 1 / -1; }
  /* the half-width cards stack their figure under the title at every width, as the phone does (SOLAR-49) */
  .solar-row .section-title { flex-direction: column; align-items: flex-start; gap: 5px; }
  #solar-day, #battery-day, #grid-day { scroll-margin-top: 16px; }
  .solar-empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .tip-hint { font-size: 12px; color: var(--dim); margin-top: 6px; }
  /* Where it went: a plain card, half the row (SOLAR-74). Its title keeps "Made" beside it at every width. */
  .solar-row > .wiw { width: 100%; max-width: 560px; box-sizing: border-box; }
  .solar-tab .wiw .section-title { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 5px 12px; margin-bottom: 14px; }
  .wiw-figs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 16px; margin-top: 18px; }
  /* aligned as the Power Flow solar box's split: first left, last right, middle centred */
  .wiw-figs > :not(:first-child):not(:last-child) { text-align: center; }
  .wiw-figs > :last-child:not(:first-child) { text-align: right; }
  .wiw-figs b { display: block; font: 700 28px var(--mono); line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  .wiw-figs b .u { font-size: 15px; margin-left: 4px; opacity: 0.85; }
  .wiw-figs span:not(.u) { display: block; margin-top: 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .solar-note { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); max-width: 60ch; }
  /* Equipment (SOLAR-75): one headline, a coral-edged card per problem, then Simple (a tile
     each: one figure, one word) or Detailed (string bars, battery meter, inverter tiles,
     spec sheets). */
  .eq-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .eq-label { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
  .eq-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--dim); }
  .eq-dot.ok { background: var(--pv); box-shadow: 0 0 0 4px rgba(61,220,132,0.15); }
  .eq-dot.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(245,158,11,0.15); }
  .eq-dot.sm { width: 7px; height: 7px; }
  .eq-dot.sm.ok { box-shadow: 0 0 0 3px rgba(61,220,132,0.16); }
  .eq-dot.sm.warn { box-shadow: 0 0 0 3px rgba(245,158,11,0.16); }
  .eq-head { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .eq-head-sub { margin: 6px 0 0 22px; font-size: 13.5px; color: var(--muted); }
  .eq-problems { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .eq-problem { border: 1px solid rgba(248,113,113,0.42); background: rgba(248,113,113,0.06); border-radius: 16px; padding: 16px 18px; }
  .eq-problem-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .eq-problem-head b { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .eq-problem-head span { flex: none; font-size: 12px; color: var(--dim); }
  .eq-problem p { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.5; }

  /* Simple: a row of tiles, figure on top; below 900px a list, words left and figure right */
  .eq-tiles { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .eq-tile { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .eq-fig { font-weight: 700; font-size: 40px; line-height: 1; display: flex; align-items: baseline; gap: 4px; }
  .eq-fig.word { font-size: 34px; letter-spacing: -0.01em; }
  .eq-fig .u { font-size: 19px; opacity: 0.85; }
  .eq-fig-sub { margin-top: 7px; font-size: 12.5px; color: var(--dim); }
  .eq-tile.stale .eq-fig { opacity: 0.5; }
  .eq-tile-text { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .eq-tile-label { font-size: 15px; font-weight: 600; }
  .eq-tile-state { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
  .eq-tile-state.warn { color: var(--warn); }
  @media (min-width: 900px) { .eq-tiles { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 20px; } }
  @media (max-width: 899px) {
    .eq-tile { flex-direction: row-reverse; justify-content: space-between; align-items: center; gap: 16px; }
    .eq-tile-fig { text-align: right; flex: none; }
    .eq-fig { font-size: 30px; justify-content: flex-end; }
    .eq-fig.word { font-size: 26px; }
    .eq-fig .u { font-size: 15px; }
  }

  /* Detailed: three cards across when wide; two with the odd one full width; one on a phone */
  .eq-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: stretch; }
  .eq-cards > * { min-width: 0; }
  @media (min-width: 700px) {
    .eq-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .eq-cards > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  }
  @media (min-width: 1240px) {
    .eq-cards { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); }
    .eq-cards.two { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
    .eq-cards > :last-child:nth-child(odd) { grid-column: auto; }
  }
  .eq-big { font-size: 44px; font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: 6px; }
  .eq-big .u { font-size: 22px; opacity: 0.85; }
  .eq-big.stale { opacity: 0.5; }
  .eq-big-sub { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .eq-groups { margin-top: 20px; display: flex; flex-direction: column; gap: 18px; }
  .eq-group { display: flex; flex-direction: column; gap: 11px; }
  .eq-group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; font-weight: 600; }
  .eq-group-head .mono { font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .eq-group-head .warn { color: var(--warn); }
  .eq-string { display: grid; grid-template-columns: 64px minmax(0, 1fr) 48px; align-items: center; gap: 4px 12px; font-size: 13px; }
  .eq-string-name { color: var(--muted); }
  .eq-bar { position: relative; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.07); }
  .eq-bar i, .eq-meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--pv); }
  .eq-bar b, .eq-meter b, .eq-legend b { position: absolute; top: -4px; width: 2px; height: 15px; margin-left: -1px; border-radius: 1px; background: rgba(231,236,242,0.7); }
  .eq-string-kwh { text-align: right; font-weight: 600; }
  .eq-string.weak .eq-bar i { opacity: 0.45; }
  .eq-string.weak .eq-string-kwh, .eq-string-why { color: var(--load); }
  .eq-string-why { grid-column: 2 / -1; font-size: 12.5px; }
  .eq-fold { align-self: flex-start; font-size: 13px; min-height: 32px; }
  .eq-legend { margin-top: 16px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); }
  .eq-legend b { position: static; margin: 0; height: 12px; }
  .eq-note { margin-top: 16px; font-size: 13px; color: var(--dim); }
  .eq-meter { position: relative; height: 7px; margin-top: 16px; border-radius: 4px; background: rgba(255,255,255,0.07); }
  .eq-meter.stale i { opacity: 0.5; }
  .eq-meter-scale { position: relative; height: 18px; margin-top: 6px; font-size: 12px; color: var(--dim); }
  .eq-meter-scale span { position: absolute; white-space: nowrap; }
  .eq-rows { margin: 10px 0 0; }
  .eq-rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .eq-rows dt { color: var(--muted); }
  .eq-rows dd { margin: 0; text-align: right; }
  .eq-rows dd.warn { color: var(--warn); }
  .eq-foot { margin-top: 6px; font-size: 12.5px; color: var(--dim); }
  .eq-inv-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .eq-inv-tiles.one { grid-template-columns: minmax(0, 1fr); }
  .eq-inv { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .eq-inv.down { border-color: rgba(248,113,113,0.42); }
  .eq-inv-name { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eq-inv-state { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .eq-inv-state.warn { color: var(--warn); }
  .eq-inv-now { margin-top: 8px; font-size: 22px; font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: 4px; }
  .eq-inv-now .u { font-size: 13px; opacity: 0.85; }
  .eq-inv-cap, .eq-inv-foot { font-size: 12px; color: var(--dim); }
  .eq-inv-today { margin-top: 6px; padding-top: 9px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 12.5px; }
  .eq-inv-today span:first-child { color: var(--muted); }
  .eq-inv-today .mono { font-weight: 600; }
  .eq-inv.down .eq-inv-today .mono { color: var(--dim); }
  .eq-specs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  @media (min-width: 900px) { .eq-specs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .eq-spec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; font-size: 16px; font-weight: 600; }
  .eq-spec-rows { margin: 0; }
  .eq-spec-rows > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .eq-spec-rows dt { color: var(--muted); }
  .eq-spec-rows dd { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
  .eq-pack-label { margin-top: 16px; }
  .eq-pack { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .eq-pack > div { background: var(--panel-2); border-radius: 10px; padding: 10px 11px; min-width: 0; }
  .eq-pack b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .eq-pack span { display: block; margin-top: 4px; font-size: 12px; color: var(--dim); }
  @media (max-width: 599px) {
    .eq-head { font-size: 20px; }
    .eq-problem { border-radius: 14px; }
    .eq-big { font-size: 34px; }
    .eq-big .u { font-size: 17px; }
    .eq-spec-rows > div { grid-template-columns: 110px minmax(0, 1fr); }
  }
  @media (min-width: 900px) { .eq-problems { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .eq-problems > :only-child { grid-column: 1 / -1; }
  .solar-best { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .solar-best b { font-family: var(--mono); font-weight: 600; color: var(--text); }

  /* ---------- settings: Account, Billing, Plant ----------
     One scrolling page each, in one area with a side menu (SOLAR-250). A section is its
     title and note over a full-width card. */
  .settings-page { display: flex; flex-direction: column; max-width: 920px; padding-bottom: 24px; }
  .page-head h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .page-head p { margin: 0 0 6px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px 0; margin-top: 8px;
    scroll-margin-top: calc(var(--head-h, 60px) + 12px); }
  .page-head + .sec { margin-top: 16px; }
  .sec + .sec { margin-top: 0; }
  .sec-intro { min-width: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }   /* title top left, a button top right */
  .sec-intro > div { min-width: 0; }
  .sec-intro > button { flex: none; white-space: nowrap; }
  .sset { padding: 18px 22px 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
  .sset-title { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .sset-note { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .sset-count { margin-left: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; color: var(--dim); }
  /* the inverter's own answers, folded away under the battery */
  details.adv { margin-top: 12px; border-top: 1px solid var(--line); }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 13.5px; padding: 14px 0 4px; list-style: none; }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary::before { content: '▸ '; } details.adv[open] summary::before { content: '▾ '; }
  details.adv summary:hover { color: var(--text); }
  .sset .field-row { grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .sset .field { margin-bottom: 0; }
  .sset .field-row .field-note { margin-top: 8px; }
  /* toggle rows keep the login rows' rhythm: 14px, no rule above the first, nothing under the last.
     (`:first-of-type` never matched: the field's own <label> is the first label in the field.) */
  .sset .toggle-row { padding: 14px 0; }
  .sset .field > label:not(.toggle-row) + .toggle-row { border-top: none; padding-top: 6px; }
  .sset .field > .toggle-row:last-of-type { padding-bottom: 0; }
  .sset-choice .toggle-label { color: var(--text); }
  .sset-choice .segmented { margin-top: 12px; }
  .sset-choice .seg-btn { white-space: nowrap; }
  /* Toggle is a <label>, and .field label is display:block; put the row back to flex */
  .sset .field label.toggle-row { display: flex; margin-bottom: 0; letter-spacing: 0; color: var(--text); }
  .sset .field label.toggle-row .toggle-label { font-size: 14px; }
  .sset .sset-body > .field + .field { margin-top: 20px; }
  /* Notifications: two groups that open to a switch per email (SOLAR-164). */
  .notif-head { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
  .notif-group:first-child .notif-head { padding-top: 0; }
  .notif-group:last-child .notif-head:has(+ [hidden]) { padding-bottom: 0; }
  .notif-group + .notif-group { border-top: 1px solid var(--line); }
  .notif-open { flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0;
    background: none; border: none; color: inherit; text-align: left; }
  .notif-open svg { flex: none; color: var(--dim); transition: transform .18s; }
  .notif-open[aria-expanded="true"] svg { transform: rotate(90deg); }
  .notif-label { font-size: 15px; font-weight: 500; }
  /* an email sits under its group, indented past the group's name; no rule between emails */
  .sset .notif-rows { margin: 0 0 14px 42px; }
  .sset .notif-rows .toggle-row { padding: 8px 0; border-top: none; }
  .sset .toggle-hint { font-size: 13px; }   /* hints are 13px or more (SOLAR-14) */
  /* Email, then On this browser: pop-ups with the same five alert switches (SOLAR-244) */
  .notif-sub { font-size: 12.5px; color: var(--dim); font-weight: 500; margin: 0 0 4px; }
  .notif-sub + .notif-group .notif-head { padding-top: 10px; }
  .notif-push { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .notif-push .notif-group { border-top: 1px solid var(--line); }
  .notif-push.ios .switch, .notif-push.asking .switch { opacity: .35; }
  .notif-note { margin: 4px 0 6px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
    border: 1px solid var(--line-2); background: var(--panel-2); color: #b4bdc8; }
  .notif-note.warn { border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.07); color: #f3d9a6; }
  .notif-note b { color: var(--text); font-weight: 600; }
  /* Tariff, Plant and Battery: the login rows' layout (name and hint left, control right).
     The name is a <label> or a <div> of spans, so stack the spans like the login rows' divs. */
  .sset-row .conn-text > span { display: block; }
  /* no rules between these rows (the tiles already box each answer); 20px apart, like Display's fields */
  .conn-row.sset-row { border-top: none; padding: 10px 0; }
  .sset-body > .sset-row:last-child { padding-bottom: 0; }
  /* the fields are First steps' own (SOLAR-170): one field on the right, or the sum box under the name */
  .sset-one { flex-direction: column; align-items: flex-end; gap: 6px; }
  .sset-one .fs-in { width: 300px; }   /* one width for every field in Settings */
  /* the sum box on the right like the single fields, its switch and value over the box */
  .sset-sum { flex: none; width: 300px; max-width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .sset-row:has(> .sset-sum) { align-items: flex-start; }
  .sset-err { margin: 0; font-size: 12px; line-height: 1.5; color: var(--load); }
  .input[aria-invalid="true"], .input[aria-invalid="true"]:focus { border-color: var(--load); }
  /* reserve's slider runs the row's full width under its name and box, filled to the value */
  /* pick one of a few (Plant, Battery, Display): described tiles across the row, native radios underneath */
  @media (max-width: 600px) {
    .sset-row > .conn-text { flex-basis: 100%; }   /* on a phone each control drops under its name */
    .sset-one { align-items: stretch; width: 100%; }
    .sset-one .fs-in { width: 100%; }
    .sset-sum { width: 100%; }
  }


  /* the area: its menu beside the page; on a phone the menu is a list you tap into, and each
     page has a back link to it (SOLAR-250) */
  .set-area { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 32px; align-items: start; }
  .set-nav { position: sticky; top: calc(var(--head-h, 60px) + 16px); display: flex; flex-direction: column; gap: 2px; }
  .set-nav-title { font-size: 18px; font-weight: 600; margin: 2px 10px 12px; letter-spacing: -0.01em; }
  .set-nav button { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 10px; border-radius: 9px; background: none;
    border: 1px solid transparent; color: var(--muted); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
  .set-nav button > span:first-child { flex: 1; }
  .set-nav button:hover { color: var(--text); }
  .set-nav button[aria-current="page"] { background: var(--panel-2); border-color: var(--line-2); color: var(--text); }
  .set-nav .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
  .set-chev { display: none; flex: none; color: var(--dim); }
  .set-main { min-width: 0; }
  .set-main > .settings-page { padding-top: 2px; }
  .back-link { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px; padding: 4px 0; background: none; border: none;
    color: var(--muted); font: inherit; font-size: 13.5px; cursor: pointer; }
  .back-link:hover { color: var(--text); }
  .set-back { display: none; }
  @media (max-width: 599px) {
    .set-area { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .set-nav { display: none; position: static; }
    .set-back { display: inline-flex; }
    .set-list .set-nav { display: flex; gap: 0; }
    .set-list .set-nav-title { font-size: 22px; margin: 0 0 12px; }
    .set-list .set-nav button, .set-list .set-nav button[aria-current="page"] { min-height: 52px; padding: 0 2px; border: none; border-top: 1px solid var(--line);
      border-radius: 0; background: none; color: var(--text); font-size: 15px; }
    .set-list .set-chev { display: block; }
    .set-list .set-main { display: none; }
  }
  .set-method { color: var(--dim); }
  /* Billing's Plants: each login, its plants listed under it */
  /* Billing's Plants (SOLAR-251): one card; each login a grey caption over its plants, a switch each */
  .login-grp + .login-grp { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
  .login-grp.leaving { overflow: hidden; animation: conn-out .24s ease-in forwards; }
  .login-line { display: flex; align-items: center; gap: 8px; min-height: 34px; }
  .login-email { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .login-email .warn { color: var(--warn); white-space: nowrap; }
  .login-plant { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; min-height: 44px; }
  .login-plant .plant-nm { flex: 1; min-width: 0; font-size: 14.5px; }
  .login-plant.off .plant-nm { color: var(--dim); }
  .login-plant .plant-state { font-size: 13px; white-space: nowrap; }
  .login-plant > .confirm-card, .login-grp > .conn-form { flex-basis: 100%; margin: 4px 0 10px; }
  .switch:disabled { opacity: .5; }
  .login-more { position: relative; flex: none; }
  .more-btn { width: 34px; height: 34px; display: grid; place-items: center; background: none; border: none; border-radius: 9px; color: var(--dim); }
  .more-btn:hover, .more-btn[aria-expanded="true"] { background: var(--panel-2); color: var(--text); }
  .login-menu { right: 0; top: calc(100% + 4px); min-width: 180px; }
  .menu button.menu-danger { color: var(--load); }
  /* Account actions: one button width */
  #settings-actions .conn-actions > button { min-width: 112px; }
  /* change password, open: its name top left, the fields fill the rest, no box of their own */
  #settings-password:has(form) { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; }
  #settings-password .link-form { margin: 0; padding: 0; border: none; background: none; }
  @media (max-width: 599px) { #settings-password:has(form) { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
  /* Your system: each name on the left, its field fills the right (like change password);
     one column on a phone */
  #settings-system .conn-row.sset-row { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start;
    padding: 14px 0; border-top: 1px solid var(--line); }
  #settings-system .conn-row.sset-row:first-child { border-top: none; padding-top: 0; }
  #settings-system .sset-row > * { align-self: start; }   /* .conn-actions centres itself elsewhere */
  #settings-system .sset-row > .conn-text { flex-basis: auto; }
  #settings-system :is(.sset-sum, .sset-one) { width: 100%; align-items: stretch; }
  #settings-system .sset-one .fs-in { width: 100%; }
  /* on Total the box is the value; the sum over it only reads on By size */
  #settings-system .fs-sumhead:has(.fs-seg > button:first-child.on) .fs-val { display: none; }
  @media (max-width: 599px) { #settings-system .conn-row.sset-row { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
  /* Your data: From, To and Download on one line */
  .dl-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .dl-field { flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px; }
  .dl-row > button { flex: none; min-height: 41px; }
  .dl-row + .sset-err { margin-top: 8px; }
  /* Account: Delete is off while a paid plan runs, with this note under it */
  .set-warn { flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 9px 12px;
    border: 1px solid rgba(245,158,11,0.35); background: rgba(245,158,11,0.06); border-radius: 10px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .set-warn b { color: var(--text); font-weight: 600; }
  .set-warn .text-link, .plan-ctx .text-link { background: none; border: none; padding: 0; font: inherit; font-weight: 600; color: var(--pv); cursor: pointer; white-space: nowrap; }
  /* All emails: one switch over both groups, ruled off from them */
  .notif-all { min-height: 44px; border-bottom: 1px solid var(--line-2); }
  .notif-all .toggle-text { flex: 1; min-width: 0; }
  .notif-all + .notif-group .notif-head { padding-top: 14px; }
  /* Billing */
  .plan-lbl { font-size: 12.5px; color: var(--dim); }
  .plan-now .plan-name { font-size: 18px; margin-top: 2px; }
