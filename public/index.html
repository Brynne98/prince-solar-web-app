<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SynSynk · Solar Dashboard</title>
<!-- Installable / chromeless on a tablet: Add to Home Screen → runs fullscreen (ideal wall display) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SynSynk" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0d12" />
<!-- Tab icon: the dashboard's own sun (see .sun below). SVG first for crispness at
     any size; the PNG is the fallback for anything that won't take an SVG favicon.
     apple-touch-icon is rendered on the dark background because iOS composites
     home-screen icons onto a solid backdrop and a transparent one looks accidental. -->
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0d12;
    --panel: #11161d;
    --panel-2: #141a22;
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.12);
    --text: #e7ecf2;
    --muted: #707d8c;
    --dim: #4a5562;
    --pv: #3ddc84; --batt: #a78bfa; --grid: #facc15; --load: #f87171; --soc: #22d3ee;
    --ok: #3ddc84;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; max-width: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(91,157,255,0.06), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(52,211,153,0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- shell ---------- */
  /* Column layout so the tab content can grow and the version can be pushed to the
     real bottom of the page. The old 80px bottom padding just left dead space. */
  .app { max-width: 1320px; margin: 0 auto; padding: 30px 34px 22px;
    min-height: 100dvh; display: flex; flex-direction: column; }
  .content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* > * so a tab whose root is a grid/stack still behaves as it did before */
  .content > * { flex: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .sun {
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #ffd56b, #f4a93a 58%, #e07a1f);
    box-shadow: 0 0 0 6px rgba(244,169,58,0.10), 0 0 34px rgba(244,169,58,0.45);
    flex: none;
  }
  .brand-name { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
  .brand-dot { color: var(--muted); font-weight: 400; }
  .brand-live { color: var(--pv); }
  .brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 7px; letter-spacing: 0.02em; }
  .health-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
  .health-green { background: #3ddc84; box-shadow: 0 0 0 3px rgba(61,220,132,0.16); }
  .health-orange { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.16); }
  .health-red { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.16); }
  .topbar-actions { display: flex; align-items: center; gap: 16px; }
  .auto-toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); user-select: none; }
  .auto-toggle input { width: 17px; height: 17px; accent-color: var(--ok); }
  .refresh-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--line-2);
    padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 500; transition: .15s;
  }
  .refresh-btn:hover { background: var(--panel-2); border-color: var(--muted); }
  .refresh-btn.pulse { border-color: var(--ok); color: var(--ok); }

  /* version, bottom of the Settings page — no rule, no card, just the number */
  .app-version { margin-top: auto; padding-top: 26px; text-align: center; font-size: 11.5px; color: var(--dim); }

  /* ---------- tab bar ---------- */
  .tabbar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
  .tab {
    background: none; border: none; color: var(--muted); font-size: 15px; font-weight: 500;
    padding: 12px 18px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: .15s; border-radius: 8px 8px 0 0;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.02); }
  .tab.active { color: var(--text); border-bottom-color: var(--pv); }

  /* ---------- cards ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; }
  .grow { flex: 1; } .stack { display: flex; flex-direction: column; gap: 20px; }
  .section-title { display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; margin-bottom: 18px; }
  .section-right { font-size: 11px; letter-spacing: 0.04em; }

  /* ---------- stat tiles (the 4 the user liked) ---------- */
  .stat-tile { display: flex; flex-direction: column; gap: 0; }
  .stat-label { font-size: 11px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
  .stat-value { font-family: var(--mono); font-weight: 700; margin-top: 10px; line-height: 1; display: flex; align-items: baseline; }
  .stat-value .num { font-size: 44px; }
  .stat-value .unit { font-size: 24px; margin-left: 4px; opacity: 0.85; }
  .stat-sub { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .stat-sub b { color: var(--text); font-weight: 600; }
  .batt-eta { display: block; margin-top: 7px; font-size: 12px; color: var(--soc); font-family: var(--mono); letter-spacing: -0.01em; }
  .batt-eta b { color: var(--soc); font-weight: 700; }
  .batt-eta .bel { display: block; }
  .batt-eta .bel.sub { color: var(--muted); margin-top: 1px; }
  .meter { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; margin-top: 14px; position: relative; }
  .meter.sm { height: 5px; margin-top: 8px; } .meter.big { height: 12px; margin-top: 0; }
  .meter-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
  .reserve-mark { position: absolute; top: -2px; width: 2px; height: calc(100% + 4px); background: rgba(255,255,255,0.5); }
  .meter-head { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 8px; }
  .meter-cap { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .meter-head .mono { font-size: 15px; font-weight: 600; }
  .meter-scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); margin-top: 6px; font-family: var(--mono); }

  /* ---------- live layout ---------- */
  .live-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  /* battery banner: status (left) + a few labelled stats (right) */
  .batt-balance { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 10px 15px; border-radius: 12px;
    background: rgba(255,255,255,0.02); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .batt-balance.watch { border-color: rgba(245,181,69,0.45); background: rgba(245,181,69,0.06); }
  .batt-balance.drifting { border-color: rgba(245,102,78,0.55); background: rgba(245,102,78,0.09); }
  .bb-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .bb-title { color: var(--text); font-weight: 600; }
  .bb-status { font-weight: 600; cursor: help; }
  .bb-div { width: 1px; align-self: stretch; background: var(--line); }
  .bb-stats { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
  .bb-stat { display: inline-flex; align-items: baseline; gap: 5px; cursor: help; }
  .bb-k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .bb-stat b { color: var(--text); font-weight: 600; }
  .bb-stat.bb-hot b { color: var(--warn, #f5b545); }
  .chart-card { display: flex; flex-direction: column; min-width: 0; }
  .hv-root { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; }
  .stat-col { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .today-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 14px; }
  .overview-section { order: -1; }
  .overview-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .overview-head .section-title { margin-bottom: 0; }
  .mini-stat { padding: 16px 18px; }
  .mini-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; }
  .mini-stat { transition: border-color .15s; }
  .mini-stat:hover { border-color: var(--line-2); }
  .mini-value { font-size: 20px; font-weight: 600; margin-top: 8px; letter-spacing: -0.01em; }
  .mv-num { white-space: nowrap; }
  /* grid presence chip on the Imported card — green when the mains is live, red when down */
  .grid-state { display: inline-flex; align-items: center; gap: 6px; cursor: help; }
  .grid-state .gs-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .grid-state.on  { color: var(--muted); }
  .grid-state.on  .gs-dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,220,132,0.14); }
  .grid-state.off { color: var(--load); font-weight: 600; }
  .grid-state.off .gs-dot { background: var(--load); box-shadow: 0 0 0 3px rgba(248,113,113,0.16); }
  .mini-sub { font-size: 11.5px; color: var(--dim); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


  /* ---------- flow svg ---------- */
  .flow-fs-wrap { width: 100%; }
  .flow-wrap { width: 100%; }
  .flow-svg { width: 100%; height: auto; display: block; }
  .flow-fs-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 9px; color: var(--muted); font-size: 12px; padding: 5px 11px; cursor: pointer; transition: .15s; }
  .flow-fs-btn:hover { border-color: var(--line-2); color: var(--text); }
  /* wall-dashboard mode: fill the whole screen (incl. tablets), centre the flow */
  .flow-fs-wrap:fullscreen, .flow-fs-wrap:-webkit-full-screen {
    width: 100%; height: 100%; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: max(10px, 2vmin) max(10px, 2.5vmin); overflow: hidden;
    padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .flow-fs-wrap:fullscreen .flow-card, .flow-fs-wrap:-webkit-full-screen .flow-card {
    width: 100%; height: 100%; max-width: 1800px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .flow-fs-wrap:fullscreen .flow-svg, .flow-fs-wrap:-webkit-full-screen .flow-svg { max-height: 72vh; }
  .flow-fs-wrap:fullscreen .flow-narrative, .flow-fs-wrap:-webkit-full-screen .flow-narrative { font-size: 16px; }
  .cursor-hidden, .cursor-hidden * { cursor: none !important; }
  /* slide a whole number of dash-periods so the loop is seamless: 195 = 15 (desktop "2 13") × 13 (mobile "2 11") */
  @keyframes flow { to { stroke-dashoffset: -195; } }
  .flow-node-label { font: 600 10.5px var(--display); letter-spacing: 0.12em; fill: var(--muted); }
  .flow-node-val { font: 700 21px var(--mono); }
  .flow-node-unit { font-size: 11px; fill: var(--muted); }
  .flow-node-tag { font: 400 9.5px var(--display); letter-spacing: 0.08em; fill: var(--dim); text-transform: uppercase; }
  .flow-col-title { font: 600 10px var(--display); letter-spacing: 0.2em; fill: var(--dim); }
  .flow-node-extra { font: 600 11px var(--mono); fill: var(--batt); }
  .flow-inv-label { font: 700 11px var(--display); letter-spacing: 0.14em; fill: var(--text); }
  .flow-inv-sub { font: 400 10px var(--mono); fill: var(--muted); }
  .flow-sub { font: 500 9px var(--mono); fill: var(--muted); }
  .flow-pct { font: 700 13px var(--mono); }
  .flow-status { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    margin-top: 4px; padding-top: 16px; border-top: 1px solid var(--line); }
  .flow-narrative { font-size: 14px; color: var(--text); }
  .flow-narrative b { font-weight: 600; }
  .flow-chips { display: flex; gap: 16px; flex-wrap: wrap; }
  .flow-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
  .flow-chip-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid; flex: none; }
  .flow-chip b { font-weight: 600; }

  /* ---------- mobile power-flow (vertical, card-style nodes) ---------- */
  .mflow { display: flex; flex-direction: column; }
  .mflow-sources { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .mtile { background: rgba(255,255,255,0.015); border: 1px solid var(--line); border-radius: 14px; padding: 13px 12px; min-width: 0; transition: border-color .2s; }
  .mtile-head { display: flex; align-items: center; gap: 7px; margin-bottom: 11px; }
  .mtile-head svg { flex: none; }
  .mtile-label { font-size: 10.5px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mtile-val { font-family: var(--mono); font-weight: 700; font-size: 21px; line-height: 1; white-space: nowrap; }
  .mtile-val .u { font-size: 11px; color: var(--muted); margin-left: 2px; font-weight: 600; }
  .mtile-state { font-size: 12px; font-weight: 600; margin-top: 9px; line-height: 1.35; word-break: break-word; }
  .mtile-sub { font-size: 11px; color: var(--dim); margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mflow-links { display: block; width: 100%; height: 54px; }
  .mflow-inv { display: flex; flex-direction: column; align-items: center; }
  .mflow-inv svg { display: block; }
  .mflow-inv-label { font: 700 12px var(--display); letter-spacing: 0.14em; color: var(--text); margin-top: 8px; }
  .mflow-inv-sub { font: 400 11px var(--mono); color: var(--muted); margin-top: 3px; }
  .mflow-down { display: block; width: 8px; height: 32px; margin: 2px auto; }
  .mflow-home { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.015); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 6px; transition: border-color .2s; }
  .mflow-home svg { flex: none; }
  .mflow-home-text { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .mflow-home-label { font-size: 10.5px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
  .mflow-home-val { font-family: var(--mono); font-weight: 700; font-size: 24px; line-height: 1; }
  .mflow-home-val .u { font-size: 12px; color: var(--muted); margin-left: 2px; font-weight: 600; }
  .mflow-home-today { margin-left: auto; font-size: 12px; color: var(--dim); white-space: nowrap; padding-left: 10px; }

  /* ---------- trend arrows on overview cards ---------- */
  .trend-badge { font-family: var(--display); font-size: 12px; font-weight: 600; margin-left: 9px; letter-spacing: 0; white-space: nowrap; vertical-align: 2px; }
  .trend-badge.good { color: #3ddc84; }
  .trend-badge.bad { color: #f87171; }
  .trend-badge.flat { color: var(--dim); font-weight: 500; }

  /* ---------- trends ---------- */
  .trend-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .trend-stats > div { background: rgba(255,255,255,0.015); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
  .ts-l { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .ts-v { font-size: 18px; font-weight: 600; margin-top: 5px; white-space: nowrap; }
  .ts-sub { font-size: 11px; color: var(--dim); font-weight: 400; margin-top: 4px; }
  .trend-rec { display: flex; flex-direction: column; gap: 4px; }
  .trend-rec-label { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .trend-rec-window { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0; }
  .trend-rec-detail { font-size: 13px; color: var(--text); line-height: 1.5; }
  .trend-rec-detail b { font-weight: 600; }
  .rec-list { margin: 6px 0 0; padding-left: 18px; }
  .rec-list li { margin: 3px 0; color: var(--muted); }
  .rec-list li b { color: inherit; }
  .trend-subnav { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .trend-legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .tl-item { display: inline-flex; align-items: center; gap: 7px; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; }
  .tl-axes { margin-left: auto; font-size: 11px; color: var(--dim); }
  /* per-segment usage rows (units used + solar/battery/grid split bar) */
  .seg-list { display: flex; flex-direction: column; gap: 14px; margin: 14px 0 4px; }
  .seg-row { display: flex; flex-direction: column; gap: 6px; }
  .seg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .seg-name { color: var(--text); font-weight: 600; font-size: 13px; }
  .seg-range { color: var(--dim); font-weight: 400; font-size: 11.5px; }
  .seg-avg { color: var(--text); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .seg-kwh { color: var(--dim); font-weight: 400; }
  .seg-bar { display: flex; height: 13px; border-radius: 5px; overflow: hidden; background: rgba(255,255,255,0.05); }
  .seg-seg { flex: none; }
  .seg-from { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .seg-key { font-size: 11.5px; color: var(--dim); margin: 2px 0 6px; }
  .seg-key b { color: var(--muted); font-weight: 600; }
  .trend-chart { width: 100%; min-width: 0; overflow: hidden; }
  .trend-empty { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 200px; color: var(--muted); font-size: 13px; }
  /* keep a two-word source label on one line rather than wrapping mid-phrase */
  .trend-tip .tip-l, .trend-tip .tip-v { white-space: nowrap; }
  /* Consumed card: one bar split into own-supply vs grid, with the exact figures under it */
  /* legend key for a dashed series — a short dashed rule rather than a solid dot */
  .tl-dash { display: inline-block; width: 12px; height: 0; border-top: 2px dashed; opacity: 0.9; }
  .ts-split { display: flex; height: 6px; border-radius: 4px; overflow: hidden; margin-top: 12px; background: rgba(255,255,255,0.07); cursor: help; }
  .ts-split span { display: block; height: 100%; transition: width .5s ease; }
  .ts-split-key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .ts-split-key span { display: inline-flex; align-items: center; gap: 6px; }
  .ts-split-key i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .ts-split-key b { color: var(--text); font-weight: 600; }
  .trend-tip { position: absolute; top: 12px; pointer-events: none; background: rgba(13,17,23,0.96); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 10px 12px; min-width: 150px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); z-index: 5; }

  /* ---------- chart ---------- */
  .hv-waste { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  .hv-waste b { font-weight: 600; }
  .hv-waste-sub { color: var(--dim); }
  .hv-waste-none { opacity: 0.78; }
  .hv-datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .hv-daynav { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font-size: 18px; line-height: 1; cursor: pointer; transition: .15s; padding: 0; }
  .hv-daynav:hover:not(:disabled) { border-color: var(--line-2); }
  .hv-daynav:disabled { color: var(--dim); cursor: default; opacity: .45; }
  .hv-dateinput { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font-family: var(--mono); font-size: 12.5px; padding: 6px 10px; color-scheme: dark; cursor: pointer; }
  .hv-dateinput:hover { border-color: var(--line-2); }
  .hv-datelabel { font-size: 12.5px; color: var(--muted); margin-left: 2px; }
  .hv-approx { font-size: 11px; color: var(--warn, #d9a441); border: 1px solid var(--line); border-radius: 8px; padding: 1px 7px; margin-left: 2px; cursor: help; white-space: nowrap; }
  .hv-today { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font-size: 12px; padding: 6px 12px; cursor: pointer; transition: .15s; margin-left: auto; }
  .hv-today:hover { border-color: var(--line-2); }
  .chart-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .chart-controls-right { display: flex; align-items: center; gap: 10px; }
  .chart-area { width: 100%; min-width: 0; overflow: hidden; }
  .chart-svg { display: block; touch-action: pan-y; }
  .ax { font: 400 10.5px var(--mono); fill: var(--muted); }
  .ax-hi { fill: var(--text); }
  .legend-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .legend-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 20px; padding: 6px 13px; font-size: 12.5px; color: var(--text); transition: .15s; }
  .legend-chip.off { color: var(--dim); }
  .legend-val { margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--line-2); font-family: var(--mono); font-weight: 600; letter-spacing: -0.01em;
    display: inline-block; min-width: 9.5ch; text-align: left; font-variant-numeric: tabular-nums; }
  .legend-chip.off .legend-val { color: var(--dim); border-color: var(--line); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; }
  .legend-note { font-size: 11.5px; color: var(--dim); margin-left: 4px; }
  .legend-mode { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
  .chart-tip { position: absolute; pointer-events: none; background: rgba(13,17,23,0.96); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 10px 12px; min-width: 168px; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,0.5); z-index: 5; }
  .tip-time { font: 600 12px var(--mono); color: var(--text); margin-bottom: 8px; }
  .tip-row { display: flex; align-items: center; gap: 7px; font-size: 12px; margin: 3px 0; }
  .tip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tip-l { color: var(--muted); } .tip-v { margin-left: auto; color: var(--text); }
  .tip-total { margin-top: 5px; border-top: 1px solid var(--line); padding-top: 6px; }
  .tip-total .tip-l { color: var(--text); font-weight: 600; }
  /* drag-to-select range totals */
  .chart-range { position: absolute; left: 8px; top: 8px; background: rgba(13,17,23,0.97); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 9px 12px; min-width: 180px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); z-index: 6; }
  .cr-head { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .cr-head .tip-time { margin-bottom: 0; }
  .cr-x { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .cr-x:hover { color: var(--text); }
  /* lives in the SVG's empty top margin — bottom-right overlapped the last x-axis label */
  .chart-hint { position: absolute; right: 14px; top: 3px; font-size: 10.5px; color: var(--dim); pointer-events: none; opacity: 0.6; }
  .chart-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 18px;
    border-top: 1px solid var(--line); padding-top: 18px; }
  .sum-cell { } .sum-label { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .sum-value { font-size: 22px; font-weight: 600; margin-top: 6px; } .sum-sub { font-size: 11px; color: var(--dim); margin-top: 3px; }

  /* ---------- segmented / buttons ---------- */
  .segmented { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg-btn { background: none; border: none; color: var(--muted); padding: 7px 15px; border-radius: 7px; font-size: 13px; font-weight: 500; transition: .12s; }
  .seg-sm .seg-btn { padding: 5px 11px; font-size: 12px; }
  .seg-btn:hover { color: var(--text); } .seg-btn.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .ghost-btn { background: none; border: 1px solid var(--line-2); color: var(--muted); padding: 7px 14px; border-radius: 9px; font-size: 12.5px; transition: .15s; }
  .ghost-btn:hover { color: var(--text); } .ghost-btn.active { border-color: var(--pv); color: var(--pv); }

  /* ---------- metric / badge ---------- */
  .metric-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .metric-value { font-size: 19px; font-weight: 600; margin-top: 5px; }
  .metric-unit { font-size: 13px; color: var(--muted); margin-left: 2px; font-family: var(--mono); }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 4px 11px; border-radius: 20px; border: 1px solid; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-ok { color: var(--ok); border-color: rgba(61,220,132,0.4); background: rgba(61,220,132,0.08); }
  .badge-warn { color: var(--load); border-color: rgba(255,125,107,0.4); background: rgba(255,125,107,0.08); }
  .badge-neutral { color: var(--muted); border-color: var(--line-2); }

  /* ---------- grids used by tabs ---------- */
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .solar-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .solar-stats .stat-tile { padding: 26px 28px; }
  .quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .hint-line { font-size: 12.5px; color: var(--dim); margin-top: 16px; line-height: 1.5; }

  /* solar strings */
  .string-group { margin-bottom: 22px; }
  .string-group:last-of-type { margin-bottom: 0; }
  .string-group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .sgh-left { display: flex; align-items: baseline; gap: 10px; }
  .sgh-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .sgh-sn { font-size: 11px; }
  .sgh-pv { font-size: 12.5px; }
  .string-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .string-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .string-card.warn { border-color: rgba(255,125,107,0.35); }
  .string-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .string-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .string-sub { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; }
  .string-power { font-size: 28px; font-weight: 700; margin: 12px 0 14px; }
  .string-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 5px 0; border-top: 1px solid var(--line); }
  .string-row span:last-child { color: var(--text); white-space: nowrap; }

  /* battery */
  .batt-top { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
  .batt-gauge-card { display: flex; align-items: center; gap: 26px; }
  .gauge { position: relative; flex: none; }
  .gauge svg { display: block; } .gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge-val { font-size: 40px; font-weight: 700; line-height: 1; } .gauge-pct { font-size: 18px; }
  .gauge-label { font-size: 12px; color: var(--muted); margin-top: 6px; text-transform: capitalize; letter-spacing: 0.04em; }
  .gauge-sub { font-size: 12px; color: var(--text); margin-top: 2px; font-family: var(--mono); }
  .batt-gauge-meta { display: flex; flex-direction: column; gap: 16px; }
  .throughput, .savings-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .savings-row { grid-template-columns: repeat(3, 1fr); }
  .tp-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .tp-val { font-size: 22px; font-weight: 600; margin-top: 6px; }
  .mini-panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .mp-head { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 14px; }

  /* inverters */
  .inv-card { } .inv-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .inv-sn { font-size: 22px; font-weight: 700; font-family: var(--mono); }
  .inv-meta { font-size: 11.5px; margin-top: 5px; }
  .inv-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 18px 16px; }
  .inv-warn { margin-top: 18px; font-size: 12.5px; color: var(--load); background: rgba(255,125,107,0.07);
    border: 1px solid rgba(255,125,107,0.25); border-radius: 8px; padding: 9px 12px; }

  /* settings */
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
  .field { margin-bottom: 16px; } .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.04em; }
  .field-note { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.55; }
  .select, .input { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--text);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  .input { font-family: var(--mono); }
  .select:focus, .input:focus { outline: none; border-color: var(--grid); }
  /* Autofilled fields, on every input in the app (login and Settings both sit on
     --panel-2). Chrome paints its own near-white background for an autofilled field
     and ignores `background`, so the only way to keep a dark field dark is to cover it
     with a huge inset box-shadow. The absurd transition delay is the companion trick:
     the background is animated, and a ~forever delay means it never arrives. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active,
  select:-webkit-autofill {
    -webkit-box-shadow: 0 0 0 1000px var(--panel-2) inset;
    -webkit-text-fill-color: var(--text);
    caret-color: var(--text);
    transition: background-color 9999s ease-in-out 0s;
  }
  .range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 4px;
    background: rgba(255,255,255,0.1); outline: none; margin: 6px 0 2px; }
  .range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--soc); cursor: pointer; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--soc); }
  .range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--soc); cursor: pointer; border: 3px solid var(--bg); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
  .toggle-row:first-of-type { border-top: none; }
  .toggle-text { display: flex; flex-direction: column; gap: 3px; }
  .toggle-label { font-size: 14px; } .toggle-hint { font-size: 11.5px; color: var(--dim); }
  .switch { width: 42px; height: 24px; border-radius: 14px; background: rgba(255,255,255,0.1); border: none; position: relative; transition: .18s; flex: none; }
  .switch.on { background: var(--ok); }
  .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .18s; }
  .switch.on .knob { left: 21px; }

  .sparkline { display: block; }

  /* info tooltip */
  .info-dot { position: relative; display: inline-flex; align-items: center; vertical-align: middle;
    color: var(--dim); cursor: help; margin-left: 5px; }
  .info-dot:hover, .info-dot:focus { color: var(--grid); outline: none; }
  .info-dot svg { display: block; }
  .info-bubble { position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%) translateY(4px);
    width: 210px; background: rgba(13,17,23,0.98); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px;
    font-family: var(--display); font-size: 12px; font-weight: 400; line-height: 1.5; letter-spacing: 0; text-transform: none;
    color: var(--text); box-shadow: 0 14px 34px rgba(0,0,0,0.55); opacity: 0; visibility: hidden; transition: opacity .15s, transform .15s;
    z-index: 30; pointer-events: none; }
  .info-bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: var(--line-2); }
  .info-dot:hover .info-bubble, .info-dot:focus .info-bubble { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

  @media (max-width: 980px) {
    .stat-col { grid-template-columns: 1fr 1fr; }
    .solar-stats { grid-template-columns: 1fr 1fr; }
    .trio, .quad, .duo, .batt-top, .inv-grid, .field-row { grid-template-columns: 1fr 1fr; }
    .batt-top { grid-template-columns: 1fr; }
  }

  /* ---------- phones ---------- */
  @media (max-width: 600px) {
    .app { padding: 16px 12px 18px; }

    /* header wraps on narrow screens */
    .topbar { flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .brand { gap: 12px; }
    .sun { width: 38px; height: 38px; }
    .brand-name { font-size: 23px; }
    .topbar-actions { margin-left: auto; }

    /* tabs scroll horizontally instead of wrapping */
    .tabbar { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
    .tabbar::-webkit-scrollbar { display: none; }
    .tab { white-space: nowrap; padding: 11px 13px; font-size: 14px; }

    .card { padding: 16px 15px; border-radius: 14px; min-width: 0; }
    /* let grid/flex items shrink below their content so wide children scroll instead of widening the page */
    .live-grid > *, .stack > *, .duo > * { min-width: 0; }

    /* big-number rows stack; metric grids stay 2-up */
    .stat-col, .trio, .duo { grid-template-columns: 1fr; }
    .quad, .inv-grid, .solar-stats, .throughput, .savings-row, .mp-grid, .field-row { grid-template-columns: 1fr 1fr; }
    .solar-stats .stat-tile { padding: 18px; }
    .stat-value .num { font-size: 34px; }
    .stat-value .unit { font-size: 18px; }
    .inv-sn { font-size: 18px; }
    .gauge-val { font-size: 34px; }

    /* battery gauge keeps its readouts to the right of the circle */
    .batt-gauge-card { gap: 18px; }

    /* chart: smaller pills */
    .legend-chip { padding: 5px 10px; font-size: 11.5px; }

    /* power-flow: status stacks; the 4 chips become a 2×2 grid */
    .flow-status { flex-direction: column; align-items: stretch; gap: 12px; }
    .flow-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }

    /* keep wide controls/SVGs from forcing the grid column wider than the screen */
    .overview-section, .flow-card { overflow: hidden; }
    .overview-head { flex-direction: column; align-items: stretch; gap: 10px; }
    .overview-head .segmented { display: flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    .overview-head .segmented::-webkit-scrollbar { display: none; }
    .seg-btn { padding: 6px 10px; }

    /* day chart: hide the date label (the picker already shows the date) so the
       "missing" pill fits on one row; drag-to-range is mouse-only, so its hint
       and selection UI just cover the plot on phones */
    .hv-datelabel { display: none; }
    .hv-approx { font-size: 10px; padding: 1px 6px; }
    .chart-hint { display: none; }

    /* battery banner on phones: status on row 1, stats forced to their own row
       below via flex-basis:100% (margin-auto alone doesn't wrap reliably) */
    .batt-balance { font-size: 12px; gap: 6px 14px; }
    .bb-div { display: none; }
    .bb-stats { flex-basis: 100%; gap: 10px 18px; }

    /* fullscreen API is a no-op on mobile browsers — hide the button there */
    .flow-fs-btn { display: none; }

    /* trend card sub-nav: stack the label above its control on phones */
    .trend-subnav { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
  /* --- login gate ------------------------------------------------------- */
  .login-wrap {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px;
    color: var(--text); text-align: center;
  }
  .login-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .login-card input {
    background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 11px 13px; color: var(--text); font-family: var(--display); font-size: 14px;
  }
  .login-card input:focus { outline: none; border-color: var(--pv); }
  /* password field + its reveal toggle. The input keeps its own border, so the
     wrapper is purely for positioning the eye over the right-hand edge. */
  .login-pw { position: relative; display: flex; }
  .login-pw input { flex: 1; padding-right: 40px; min-width: 0; }
  /* Specificity note: `.login-card button` above paints the green primary button, and
     it outranks a lone `.login-eye`, so this has to match on both to win. */
  .login-card .login-eye {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0;
    background: none; border: 0; border-radius: 8px;
    color: var(--muted); cursor: pointer; transition: color .15s;
  }
  .login-card .login-eye:hover { color: var(--text); }
  .login-card .login-eye:focus-visible { outline: 2px solid var(--pv); outline-offset: -2px; }
  .login-card button {
    background: var(--pv); color: #06210f; border: 0; border-radius: 10px; padding: 11px 13px;
    font-family: var(--display); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .login-card button:disabled { opacity: 0.6; cursor: default; }
  /* min-height reserves exactly one line so the card is the same height empty or not
     (see auth.jsx). Errors here are short — "Invalid login credentials" — so one line
     covers them; a rare two-line message still nudges, which beats padding out the
     card for a case that hardly happens. */
  .login-err { color: var(--load); font-size: 13px; line-height: 1.3; min-height: 17px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="flow.jsx"></script>
<script type="text/babel" src="chart.jsx"></script>
